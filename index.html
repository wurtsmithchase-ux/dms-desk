<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>
.beat-cl{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.beat-cl li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;line-height:1.4}
.beat-cl input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.beat-cl li.done span{color:var(--muted);text-decoration:line-through}
.beat-add{display:flex;gap:8px;align-items:center}.beat-add input{flex:1;min-width:0}
.cl-rows{display:flex;flex-direction:column;gap:6px}
.cl-row{display:flex;gap:6px;align-items:center}.cl-row .cl-text{flex:1;min-width:0}
.cl-row .cl-done{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.cl-add{align-self:flex-start;margin-top:8px}
</style>
</head><body>
<title>DM's Desk</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f1812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DM's Desk"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,500;0,700;1,400&family=Spectral+SC:wght@600;700&family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a leather-bound header over a parchment desk; party members as monster-style stat blocks, quests as sidebar notes, tables in rulebook stripes */
:root{
  --bg:#efe4c9; --paper:#f8efd9; --surface:#fdf6e6; --surface2:#f2e7cb; --block:#fdf1dc;
  --ink:#2a1d14; --muted:#6e5a44; --line:#d6c19a; --stripe:#e0e5c1; --side:#e9ecd2;
  --accent:#7a200d; --accent-ink:#f9ecc9; --accent-soft:#f1dcc6; --gold:#b8913f; --bar:#e69a28;
  --blood:#9b1c12; --blood-soft:#f3d4cb; --ok:#3f6b2a; --ok-soft:#dfe8c8; --warn:#8a5a00; --warn-soft:#f3e2b7;
  --hdr:#2b1510; --hdr2:#40201a; --hdr-ink:#f0dcae;
  --title:"Cinzel","Trajan Pro",Georgia,serif; --display:"Spectral SC","Cinzel",Georgia,serif; --drop:"Cinzel Decorative","Cinzel",Georgia,serif;
  --body:"Spectral","Book Antiqua",Georgia,serif; --ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif; --sc:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --mono:"Alegreya Sans",system-ui,sans-serif; --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16110d; --paper:#1d1611; --surface:#241b15; --surface2:#2c2219; --block:#2a1f17;
  --ink:#eadcc0; --muted:#b3a183; --line:#4b3a2a; --stripe:#2b2f21; --side:#262a1d;
  --accent:#e4876c; --accent-ink:#1d0f0a; --accent-soft:#3b2119; --gold:#d6b36a; --bar:#c27a1c;
  --blood:#f07a64; --blood-soft:#3d1c16; --ok:#a5c47f; --ok-soft:#24301a; --warn:#e3b553; --warn-soft:#352812;
  --hdr:#0f0907; --hdr2:#1e100c; --hdr-ink:#e9cf94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110d; --paper:#1d1611; --surface:#241b15; --surface2:#2c2219; --block:#2a1f17;
  --ink:#eadcc0; --muted:#b3a183; --line:#4b3a2a; --stripe:#2b2f21; --side:#262a1d;
  --accent:#e4876c; --accent-ink:#1d0f0a; --accent-soft:#3b2119; --gold:#d6b36a; --bar:#c27a1c;
  --blood:#f07a64; --blood-soft:#3d1c16; --ok:#a5c47f; --ok-soft:#24301a; --warn:#e3b553; --warn-soft:#352812;
  --hdr:#0f0907; --hdr2:#1e100c; --hdr-ink:#e9cf94; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,var(--paper),transparent 60%),radial-gradient(ellipse at 90% 100%,var(--surface2),transparent 55%);background-attachment:fixed;color:var(--ink);font:17px/1.55 var(--body);margin:0}
button,input,select,textarea{font:inherit;font-family:var(--ui);color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--hdr2),var(--hdr));color:var(--hdr-ink);border-bottom:3px solid var(--gold);box-shadow:0 2px 0 var(--hdr)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.brand small{font:700 12px var(--sc);letter-spacing:.24em;color:var(--gold)}
.brand h1{font:900 32px/1.05 var(--title);margin:2px 0 0;letter-spacing:.04em;text-wrap:balance}
.brand h1 button{all:unset;cursor:pointer;overflow-wrap:anywhere}
.brand h1 button:hover{color:#fff3d1}
.brand h1 button:focus-visible{outline:2px solid var(--gold)}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid var(--gold);border-radius:2px;padding:4px 6px 4px 12px;background:rgba(0,0,0,.25)}
.clock .d{font:600 16px var(--title);white-space:nowrap;letter-spacing:.02em}
.clock .w{color:var(--gold);font:500 14px var(--sc);white-space:nowrap;letter-spacing:.04em}
.clock .btn{background:transparent;color:var(--hdr-ink);border-color:rgba(214,179,106,.5)}
.clock .btn:hover{border-color:var(--gold);background:rgba(214,179,106,.15)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 16px 8px;text-decoration:none;color:var(--hdr-ink);opacity:.7;font:700 15px var(--sc);letter-spacing:.1em;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
nav.tabs a:hover{opacity:1}
nav.tabs a[aria-current="page"]{opacity:1;color:#fff3d1;border-bottom-color:var(--bar)}
nav.tabs a .n{font:500 12px var(--ui);margin-left:5px;opacity:.8}

main{padding-block:26px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.bar h2{font:700 30px/1.05 var(--display);color:var(--accent);margin:0 auto 0 0;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;color:var(--muted);font:700 14px var(--sc);letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:var(--r);cursor:pointer;font:700 14px var(--sc);letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--blood)}
.btn.danger.armed{background:var(--blood);color:var(--surface);border-color:var(--blood)}
.btn.sm{padding:1px 9px;font-size:13px}
.icon{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;font-family:var(--ui)}
input.search,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;min-width:0}
.fmtbar{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:var(--surface2);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.fmt{border:1px solid transparent;background:none;color:var(--ink);padding:3px 10px;border-radius:var(--r);cursor:pointer;font:700 14px var(--sc);letter-spacing:.04em;min-height:32px}
.fmt:hover{background:var(--accent-soft);color:var(--accent)}
.fmt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fmt b,.fmt i{font-family:var(--body);font-size:16px}
.rte{border:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:10px 12px;min-height:140px;max-height:60vh;overflow:auto;font:16px/1.5 var(--body);outline:none;overflow-wrap:anywhere}
.rte.tall{min-height:320px}
.rte:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rte:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.rte p{margin:0 0 10px}
.rte h4{font:700 19px var(--display);color:var(--accent);margin:12px 0 4px;border-bottom:1px solid var(--gold)}
.rte ul{margin:0 0 10px;padding-left:22px}
.rte b,.rte strong{color:var(--accent)}
input.search{width:230px;max-width:100%}
.label{font:700 13px var(--sc);letter-spacing:.12em;color:var(--accent)}
.empty{border:1px dashed var(--gold);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);font-style:italic;background:var(--paper)}
.mono{font-family:var(--ui);font-variant-numeric:lining-nums tabular-nums}
.pill{display:inline-block;font:700 12px var(--sc);letter-spacing:.08em;padding:1px 8px;border-radius:2px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);vertical-align:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--blood-soft);color:var(--blood);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;border-radius:var(--r);margin-bottom:16px}
.section-h{font:700 20px var(--display);color:var(--accent);margin:0 0 10px;border-bottom:1px solid var(--gold);padding-bottom:2px}

/* Party: stat blocks */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:32px}
.pc{background:var(--block);border-top:5px solid var(--bar);border-bottom:5px solid var(--bar);box-shadow:0 0 0 1px var(--line),0 3px 8px rgba(40,20,5,.15);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc h3{margin:0;font:700 22px/1.15 var(--display);color:var(--accent);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.pc h3:hover{text-decoration:underline;text-decoration-thickness:1px}
.pc .sub{font-style:italic;color:var(--ink);font-size:15px;line-height:1.3}
.taper{height:5px;background:var(--accent);clip-path:polygon(0 50%,0 0,100% 50%,0 100%);margin:2px 0}
.prose::after{content:"";display:table;clear:both} /* the text box holds its own floated drop cap, so a divider after short text sits below it, not beside it */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.stat b{display:block;font:500 21px/1.15 var(--ui);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.stat span{font:800 12px var(--sc);letter-spacing:.08em;color:var(--accent)}
.hp{display:flex;align-items:center;gap:6px}
.hpbar{flex:1;height:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.hpbar i.mid{background:var(--warn)} .hpbar i.low{background:var(--blood)}
.pcnote{font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcnote b{color:var(--accent);font-style:italic}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-family:var(--ui);font-size:16px}
th,td{text-align:left;padding:6px 10px;vertical-align:top}
th{font:800 14px var(--sc);letter-spacing:.06em;color:var(--ink);border-bottom:1px solid var(--ink)}
tbody tr:nth-child(odd) td{background:var(--stripe)}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--accent-soft)}
td b{font-family:var(--body)}
td .clip{display:block;max-width:320px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Notes: a page of the tome */
.notes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.nlist{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);max-height:72vh;overflow:auto}
.nitem{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.nitem:hover{background:var(--surface2)}
.nitem[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.nitem b{font:600 16px/1.25 var(--body);overflow-wrap:anywhere}
.nitem small{color:var(--muted);font:500 13px var(--sc);letter-spacing:.04em}
.reader{background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 14px rgba(40,20,5,.12);padding:26px 32px;min-width:0}
.reader h3.t{font:700 34px/1.1 var(--display);color:var(--accent);margin:6px 0 2px;text-wrap:balance;padding-bottom:4px;border-bottom:2px solid var(--gold)}
/* Library groups, list and entry page */
.lib-q{flex:1 1 220px;max-width:380px}
.lib-groups{display:flex;flex-wrap:wrap;gap:5px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;background:var(--paper)}
.lib-g{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:500 14px var(--sc);letter-spacing:.03em;cursor:pointer}
.lib-g .n{font:400 12px var(--ui);color:var(--muted)}
.lib-g[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lib-g[aria-pressed="true"] .n{color:inherit;opacity:.85}
.lib-chips{display:flex;flex-wrap:wrap;gap:5px;padding:10px;border-bottom:1px solid var(--line);background:var(--paper)}
.lib-chips.sub{padding:0 10px 10px;border-bottom:1px solid var(--line)}
.lib-chips.sub .lib-g{min-height:30px;font-size:13px}
.lib-chips .lib-g.sub-g[aria-pressed="false"]{background:transparent}
.lib-arcs{padding:12px 12px 4px;border-bottom:1px solid var(--line)}
.lib-lh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 12px 6px;border-bottom:1px solid var(--line)}
.lib-lh h3{margin:0;font:400 20px var(--display);color:var(--accent)}
.lib-lh span{font-size:14px;color:var(--muted)}
.nitem .nb{font-size:14px;color:var(--muted);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.le-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 14px}
.le-t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.le-crumb{font-size:14px;color:var(--muted)}
.le-head .acts-r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lib-entry h3.t{margin-top:0}
.le-fields{margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.le-fields dt{font:400 14px var(--sc);color:var(--muted)}
.le-fields dd{margin:2px 0 0;font-weight:600}
.le-cols{display:flex;flex-wrap:wrap;gap:20px 28px;margin-top:16px}
.le-main{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.le-side{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:14px}
.le-side:empty{display:none}
.le-side > .taper:first-child{display:none}
.le-h{margin:0 0 4px;font:400 20px var(--display);color:var(--accent)}
/* Prep Board */
.pboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start}
.pb-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.pb-next,.pb-pathc{grid-column:span 2}
@media (max-width:700px){.pb-next,.pb-pathc{grid-column:auto}}
.pb-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pb-h h3{margin:0;font:400 22px var(--display);color:var(--accent)}
.pb-n{font:400 14px var(--ui);color:var(--muted)}
.pb-title{margin:0;font:700 24px/1.2 var(--title)}
.pb-sub{margin:0;color:var(--muted);font-style:italic}
.pb-prog{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.pb-prog span{display:block;height:100%;background:var(--accent)}
.pb-check{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 14px}
.pb-check li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.pb-check li::before{content:"";width:14px;height:14px;border:1.5px solid var(--muted);border-radius:2px;flex:0 0 14px}
.pb-check li.done{color:var(--ink)}
.pb-check li.done::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--paper)}
.pb-path{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px}
.pb-path li::marker{color:var(--accent);font-weight:700}
.pb-row{display:flex;flex-direction:column;gap:1px;min-height:44px;justify-content:center;text-align:left;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}
.pb-row:hover{background:var(--surface2)}
.pb-row b{font:600 16px/1.25 var(--body)}
.pb-row small{color:var(--muted);font-size:14px}
.pb-spot{display:flex;flex-direction:column;gap:6px}
.pb-sp{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center}
.pb-sp > :first-child{grid-row:span 2}
.pb-sp small{color:var(--muted);font-size:14px}
.pb-sp.warn small{color:var(--blood);font-weight:600}
/* Scene Editor */
.ph-sess{width:auto;max-width:220px;min-height:44px}
.scn-foot{display:flex;justify-content:flex-end}
.scn-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.scn-plan{flex:0 1 420px}
.scn-state{color:var(--muted);font-style:italic;min-height:1.4em}
.scn-note{margin:0 0 12px;padding:10px 14px;border:1px dashed var(--gold);border-radius:var(--r);background:var(--surface);color:var(--muted)}
.scn-box,.scn-ed{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.scn-box h3{margin:0;font:400 22px var(--display);color:var(--accent)}
.scn-in{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-family:var(--body);font-size:17px}
textarea.scn-in{resize:vertical;line-height:1.5}
.scn{display:flex;flex-direction:column;gap:14px;max-width:820px}
.scn-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scn-eh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.scn-kicker{font:400 18px var(--display);color:var(--muted)}
.scn-acts{display:flex;flex-wrap:wrap;gap:6px}
.scn-acts .btn.icon:disabled{opacity:.35}
textarea.scn-box-t{resize:none;overflow:hidden;min-height:96px}
.scn>.btn{align-self:flex-start}
:root[data-skin="wood"] .scn-card{background:var(--surface2);border:0;box-shadow:var(--frame)}
.scn-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.scn-lrt small,.scn-who small{color:var(--muted);font-size:13px}
.scn-acts{display:flex;flex-wrap:wrap;gap:6px}
.scn-found{width:22px;height:22px;margin:0;accent-color:var(--accent)}
/* NPCs */
.ppl-tools{display:flex;flex-direction:column;gap:8px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;background:inherit}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font:500 14px var(--ui);color:var(--muted)}

/* treasury */
.treasury{background:var(--block);border:1px solid var(--line);padding:12px 14px;margin-bottom:32px;display:flex;flex-direction:column;gap:10px}
.purse{display:flex;flex-wrap:wrap;gap:8px}
.coin{display:flex;align-items:center;gap:6px;border:1px solid var(--gold);background:var(--paper);padding:3px 4px 3px 10px;border-radius:999px}

.coin input{width:72px;border:0;background:var(--surface);border-radius:999px;padding:3px 8px;text-align:right;font:600 15px var(--ui);font-variant-numeric:tabular-nums}

.loot-head{display:flex;justify-content:space-between;align-items:center}
.loot{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.loot-i{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);padding:8px 10px;cursor:pointer;font-family:var(--body);min-width:0}

.loot-i small{color:var(--muted);font:500 13px var(--sc)}
.li-d{font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* prep */
.prep{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.prep-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.plan{background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 14px rgba(40,20,5,.12);padding:18px 22px}
.plan-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:10px}
.plan-h h3{margin:0;font:700 28px/1.1 var(--display);color:var(--accent)}
.plan-acts{display:flex;gap:6px;flex-wrap:wrap}
.pl-s h4{font:700 19px var(--display);color:var(--accent);margin:14px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);background:var(--surface);border-radius:999px;padding:2px 10px 2px 3px;cursor:pointer;font:500 14px var(--ui)}
.chip:hover{background:var(--accent-soft)}
.chip .av{border-width:1px}
details.past summary,.threads details summary{cursor:pointer;font:700 15px var(--sc);color:var(--accent);letter-spacing:.06em;padding:6px 0}
.threads{position:static}
.threads h4{display:flex;align-items:baseline;gap:8px}
.threads h4 .mono{font-size:15px;color:var(--muted)}
.tq{display:flex;gap:6px}
.tq input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px}
.th{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:7px}
.th input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.th-t{border:0;background:none;text-align:left;padding:0;cursor:pointer;font:15px/1.4 var(--body);color:var(--ink);display:flex;flex-direction:column;min-width:0}
.th-t small{color:var(--muted);font:400 13px var(--ui)}
.th.done .th-t{text-decoration:line-through;color:var(--muted)}
.tools{background:var(--block);border:1px solid var(--line);border-top:5px solid var(--bar);padding:14px 16px}
.tools-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools-h h3{margin:0;font:700 22px var(--display);color:var(--accent)}
.tool{display:flex;flex-direction:column;gap:10px}
.tool-d{margin:0;color:var(--muted);font:400 15px var(--ui)}
.tool textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font:15px/1.45 var(--ui);resize:vertical}
.tool-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:default}
.names{columns:2;margin:0}
textarea.bk{width:100%;min-height:160px;font:12px var(--ui)}

}

.reader .reader-nav .back{margin-bottom:0}

.rc-status > span:last-child{font:15px/1.4 var(--body);padding-top:4px}
/* ---- round 2 ---- */
.muted{color:var(--muted)}

.tm-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bar);color:var(--hdr);border:1px solid var(--gold);border-radius:2px;padding:7px 12px;cursor:pointer;font:800 14px var(--sc);letter-spacing:.06em}

/* encounters */
.enc-party{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--side);padding:8px 12px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}

.enc-row input,.enc-row select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px;min-width:0}

.enc-bar .tick em{position:absolute;top:20px;left:0;transform:translateX(-50%);font:600 11px/1.15 var(--ui);font-style:normal;color:var(--muted);text-align:center;white-space:nowrap}
.encs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.enc-card{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--side);padding:10px 12px;cursor:pointer;font-family:var(--body)}
.enc-card:hover{background:var(--accent-soft)}
.enc-ct-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}

.enc-ms{font-size:14px;color:var(--ink)}
@media (max-width:640px){.enc-row{grid-template-columns:minmax(0,1fr) auto auto}.enc-xp{grid-column:1/3;text-align:left}.enc-row .btn.icon{grid-column:3;grid-row:2}}

/* tables */
.rt-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.rt{background:var(--paper);border:1px solid var(--line);padding:16px 20px;min-width:0}
.roll-zone{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;padding:12px;background:var(--block);border:1px dashed var(--gold)}

.roll-out{display:flex;gap:10px;align-items:baseline;font-size:18px;min-width:0;flex:1}

.rt-list{margin:0;padding-left:34px;columns:2;column-gap:28px}

/* spotlight */
.spot-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
table.spot{min-width:520px}
table.spot td,table.spot th{vertical-align:middle}

table.spot input{width:20px;height:20px;accent-color:var(--accent)}
table.spot tbody tr{cursor:default}
table.spot tbody tr:hover td{background:inherit}

/* arcs */
.arcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:26px}
.arc{background:var(--block);border-top:5px solid var(--bar);box-shadow:0 0 0 1px var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.arc.empty-arc{border-top-color:var(--line);align-items:flex-start}
.arc-h{display:flex;gap:10px;align-items:center}
.arc-h > div{display:flex;flex-direction:column;min-width:0}
.arc-q{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:italic 15px var(--body);color:var(--accent);text-decoration:underline;text-decoration-color:var(--gold)}
.arc-bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.arc-bar i{display:block;height:100%;background:var(--accent)}
.arc small{font:400 13px var(--ui)}
.beats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.beats li{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.35}
.beats li input{margin-top:3px;accent-color:var(--accent);flex:none}
.beats li.done span{color:var(--muted)}
body.player .beats li:not(.done){display:none}

/* what's new */
.whatsnew{background:var(--paper);border:1px solid var(--gold);border-left:5px solid var(--bar);padding:10px 14px;margin-bottom:22px;display:flex;flex-direction:column;gap:6px}
.whatsnew h3{margin:0;font:700 18px var(--display);color:var(--accent)}
.wn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wn-items{display:flex;gap:6px;flex-wrap:wrap}

/* timeline */
.timeline{position:relative;max-width:760px;padding-left:26px;border-left:3px solid var(--gold);margin-left:10px;display:flex;flex-direction:column;gap:4px}
.tl-date{font:700 16px var(--display);color:var(--accent);margin:10px 0 2px -26px;padding-left:26px;position:relative}
.tl-date::before{content:"";position:absolute;left:-9px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.tl-gap{font:italic 14px var(--body);color:var(--muted);padding:6px 0}
.tl-gap:empty{display:none}
.tl-item{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);padding:8px 12px;cursor:pointer;font-family:var(--body)}
.tl-item:hover{border-color:var(--accent)}
.tl-item small{display:block;color:var(--muted);font:500 13px var(--sc);letter-spacing:.04em}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}
.tl-item.k-events .tl-dot{background:var(--ok)}
.tl-today{margin:10px 0 6px -26px;padding:6px 0 6px 26px;border-top:2px dashed var(--accent);font:800 14px var(--sc);color:var(--accent);letter-spacing:.06em}

/* table mode */
.tablemode{position:fixed;inset:0;z-index:18;background:var(--bg);display:flex;flex-direction:column;font-size:19px}
.tm-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,var(--hdr2),var(--hdr));color:var(--hdr-ink);border-bottom:3px solid var(--gold);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}

.tm-title{font:900 24px var(--title);letter-spacing:.04em}

.tm-phone{display:none}

.stock{margin-top:14px;background:var(--block);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.stock-wrap{overflow-x:auto}

.sub-tabs{max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.dates{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.pl-lab{color:var(--accent)}
.pl-sub{font:700 16px var(--display);color:var(--accent);margin:8px 0 4px}
.th{position:relative}
.tm-top .btn.on{background:var(--bar);color:var(--hdr);border-color:var(--gold)}

}

.bs-pop-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--gold);background:var(--surface2)}

.bs-pop-h .bs-pop-line{font:500 15px/1.4 var(--body);color:var(--ink)}.bs-pop-line p{margin:0}

.bs-addto input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 9px;font:15px var(--ui)}

@media (min-width:641px){html.locked #bspop .bs-pop{right:auto;left:max(16px,env(safe-area-inset-left,0px))}}
.bs-about{color:var(--accent);font-weight:600}

.beats{margin:0 0 6px;padding-left:22px;display:flex;flex-direction:column;gap:4px}

.bs-peek{display:block;width:100%;text-align:left;margin-top:6px;border:0;border-left:3px solid var(--gold);background:var(--surface2);padding:5px 10px;cursor:pointer;font:14px/1.4 var(--ui);color:var(--muted)}

.bs-thread{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}

.bs-c.dm>div{white-space:pre-wrap;font:15px/1.45 var(--ui)}

.bs-c.cl .prose{margin:0}.bs-c.cl .prose p{margin:0 0 4px}

.bs-c .linkbtn{align-self:flex-start;font-size:13px}
.bs-xrow{display:flex;align-items:flex-start;gap:4px}
.bs-xrow .bs-xl{flex:1;min-width:0}
.bs-lc{flex:none;border:0;background:none;cursor:pointer;opacity:.35;font:13px var(--ui);padding:5px 4px;color:var(--muted)}

@media (hover:none){.bs-lc{opacity:.7}}
.bs-lthread{margin:2px 0 8px 26px;border-top:0;padding-top:0}
.bs-who{font:700 11px var(--sc);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.bs-m.cl .prose{margin:0}.bs-m.cl .prose p{margin:0 0 6px}
.bs-m.cl .prose > p:first-child::first-letter{font:inherit;color:inherit;float:none;margin:0}
.bs-idea.liked{border-left-color:var(--ok);box-shadow:0 0 0 1px var(--ok-soft)}
.bs-like{display:inline-flex;align-items:center;gap:4px;font:700 12px var(--sc);letter-spacing:.06em;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 6px;background:var(--surface);align-self:center}
.bs-like input{margin:0;accent-color:var(--ok)}
.bs-idea.liked .bs-like{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.bs-idel{margin-left:auto;border:0;background:none;color:var(--muted);width:auto;min-width:28px;padding:0 6px;align-self:center}

.bs-idel.armed{font:700 13px var(--sc)}
.bs-prune{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:-4px 0 10px}
.bs-xtip{margin:2px 0 6px;font:14px var(--ui);color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.bs-xh{font:700 17px var(--display);color:var(--accent);margin:10px 0 2px;border-bottom:1px solid var(--gold)}

.voice{font:14px/1.35 var(--ui);color:var(--ink)}

/* ---- style options ---- */

:root[data-skin="shadowfell"]{--bg:#121314;--paper:#191a1c;--surface:#1f2023;--surface2:#26282b;--block:#222327;--ink:#dcdde0;--muted:#a0a2a9;--line:#3a3c42;--stripe:#232529;--side:#1e2023;--accent:#a9bed3;--accent-ink:#101214;--accent-soft:#2a3038;--gold:#8d8f96;--bar:#5d6b7a;--blood:#e09494;--blood-soft:#352222;--ok:#a3bfa1;--ok-soft:#232d23;--warn:#d3bc82;--warn-soft:#322c1c;--hdr:#0b0b0c;--hdr2:#1d1e21;--hdr-ink:#d4d6db;color-scheme:dark}
:root[data-skin="feywild"]{--bg:#e6efe0;--paper:#f4f8ee;--surface:#fbfdf7;--surface2:#e2ecd8;--block:#f3f7ea;--ink:#1f2a1c;--muted:#56664d;--line:#c3d3b3;--stripe:#f2e1ea;--side:#ecf1e0;--accent:#8a2f6b;--accent-ink:#fbeef6;--accent-soft:#f1dbe8;--gold:#7e9a4e;--bar:#d77fb0;--blood:#a3243a;--blood-soft:#f5d7dc;--ok:#3c6e2f;--ok-soft:#dcebcf;--warn:#7d5a08;--warn-soft:#f2e5bf;--hdr:#1e3220;--hdr2:#2f4b2f;--hdr-ink:#f3e9c6;color-scheme:light}

:root[data-skin="forge"]{--bg:#e3ded6;--paper:#f1eee8;--surface:#f8f6f2;--surface2:#e2ddd3;--block:#efebe3;--ink:#22201c;--muted:#5d574d;--line:#c9c1b2;--stripe:#e5e0d4;--side:#eae6dc;--accent:#2f4f5f;--accent-ink:#f1ece0;--accent-soft:#d7e0e2;--gold:#a07a32;--bar:#b5852f;--blood:#9b2a1c;--blood-soft:#f1d6cf;--ok:#3d6630;--ok-soft:#dde8d0;--warn:#7d5508;--warn-soft:#f0e2bd;--hdr:#23272b;--hdr2:#3b4148;--hdr-ink:#e8d29d;color-scheme:light}
/* Wood & Wax skin: parchment pages on dark wood, wax red actions, gilt edges. At 1101px and wider the tabs become a side menu. */
:root[data-skin="wood"]{--bg:#efe0be;--paper:#f6ebd0;--surface:#f6ebd0;--surface2:#e4cfa3;--block:#f3e5c4;--ink:#2a1b10;--muted:#5e4630;--line:#cdb383;--stripe:#e8d6ae;--side:#eddcb8;--accent:#8e1f12;--accent-ink:#f6e8c6;--accent-soft:#eed3c2;--gold:#c9a24e;--bar:#c9a24e;--blood:#8e1f12;--blood-soft:#f0d2c6;--ok:#3d6630;--ok-soft:#dfe4c4;--warn:#7d5508;--warn-soft:#f0deb0;--hdr:#17100b;--hdr2:#2e2015;--hdr-ink:#ead9b5;--wood:#17100b;--wood2:#241811;--gilt-edge:#8a6a2c;--gilt-rule:#c9a86a;--frame:0 0 0 1px var(--gilt-edge),0 0 0 4px var(--wood2),0 0 0 5px var(--gold);--frame2:0 0 0 1px var(--gilt-edge),0 0 0 5px var(--wood2),0 0 0 6px var(--gold);color-scheme:light}
:root[data-skin="wood"]:not([data-fonts]){--title:"Cinzel Decorative","Cinzel",Georgia,serif;--drop:"Cinzel Decorative","Cinzel",Georgia,serif;--display:"IM Fell English SC",Georgia,serif;--sc:"IM Fell English SC",Georgia,serif;--body:"EB Garamond",Georgia,serif;--ui:"EB Garamond",Georgia,serif}
:root[data-skin="wood"] body{background:var(--wood);background-image:none}
:root[data-skin="wood"] #app{background:var(--bg);border:1px solid var(--gilt-edge);border-radius:4px;margin-block:18px 28px;box-shadow:0 2px 14px rgba(0,0,0,.45)}
.nav-brand,.nav-sess,.nav-h{display:none}
:root[data-skin="wood"] .notes.lib .nlist{background:var(--surface2);border:0;margin:5px;box-shadow:var(--frame)}
:root[data-skin="wood"] .notes.lib .lib-groups,:root[data-skin="wood"] .notes.lib .lib-chips{background:var(--surface2);border-bottom-color:var(--gilt-rule)}
:root[data-skin="wood"] .notes.lib .nitem,:root[data-skin="wood"] .notes.lib .lib-lh{border-bottom-color:var(--gilt-rule)}
:root[data-skin="wood"] .lib-entry{background:var(--bg);border:0;margin:6px;box-shadow:var(--frame2)}
:root[data-skin="wood"] .lib-entry h3.t{font:700 34px/1.15 var(--drop);color:var(--ink);border-bottom:0;padding-bottom:0}
:root[data-skin="wood"] .lib-entry .le-fields{background:var(--paper);border-color:var(--gilt-rule)}
:root[data-skin="wood"] .pb-card{background:var(--surface2);border:0;margin:5px;box-shadow:var(--frame)}
:root[data-skin="wood"] .pb-next{background:var(--bg)}
:root[data-skin="wood"] .pb-row{background:var(--paper);border-color:var(--gilt-rule)}
:root[data-skin="wood"] .pb-title{font-family:var(--drop)}
:root[data-skin="wood"] .scn-box{background:var(--surface2);border:0;margin:5px;box-shadow:var(--frame)}
:root[data-skin="wood"] .scn-in{background:var(--paper);border-color:#b08e52}
@media (max-width:640px){:root[data-skin="wood"] .lib-entry h3.t{font-size:28px}}
@media (max-width:640px){:root[data-skin="wood"] body{background:var(--bg)}:root[data-skin="wood"] #app{margin:0;border:0;border-radius:0;box-shadow:none}}
@media (min-width:1101px){
  /* --navw is the side menu width; 400px and 424px match the normal #pindock width and scrim padding */
  :root[data-skin="wood"]{--navw:228px}
  :root[data-skin="wood"][data-navrail]{--navw:60px}
  :root[data-skin="wood"] body{padding-left:var(--navw);transition:padding-left .18s ease}
  :root[data-skin="wood"] nav.tabs{position:fixed;left:0;top:0;bottom:0;width:var(--navw);z-index:6;flex-direction:column;gap:3px;overflow-y:auto;background:var(--wood2);border-right:2px solid var(--gold);padding:14px 10px;box-sizing:border-box;transition:width .18s ease}
  :root[data-skin="wood"] nav.tabs a,:root[data-skin="wood"] .nav-sess{display:flex;align-items:center;justify-content:flex-start;gap:12px;min-height:42px;padding:0 12px;margin:0;border:0;border-radius:3px;background:none;color:var(--hdr-ink);opacity:1;font:400 18px var(--sc);letter-spacing:.02em;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
  :root[data-skin="wood"] nav.tabs a:hover,:root[data-skin="wood"] .nav-sess:hover{background:rgba(201,162,78,.14)}
  :root[data-skin="wood"] nav.tabs a[aria-current="page"]{background:rgba(201,162,78,.2);color:#f6e8c6;box-shadow:inset 3px 0 0 var(--gold)}
  :root[data-skin="wood"] nav.tabs a .n{font:400 14px var(--body);opacity:.75;margin:0 0 0 auto}
  nav.tabs svg{flex:none}
  .nav-l{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .nav-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:0 0 4px 2px}
  .nav-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:4px;background:rgba(201,162,78,.14);color:var(--gold);cursor:pointer;flex:none}
  .nav-toggle:hover{background:rgba(201,162,78,.28)}
  .nav-toggle:focus-visible,nav.tabs a:focus-visible,.nav-sess:focus-visible,.nav-tools button:focus-visible,.nav-camp:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  :root[data-skin="wood"] .nav-sess{margin:4px 0 8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--gold);font-weight:700}
  :root[data-skin="wood"] .nav-sess:hover{background:var(--accent);filter:brightness(1.12)}
  .nav-camp .nav-camp-t{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nav-camp>svg{display:none}
  /* render() writes the side menu in the order shown, so keyboard and screen reader order match */
  :root[data-skin="wood"] .nav-brand{display:block;font:700 22px/1.2 var(--drop);color:var(--gold);padding:0 6px;white-space:nowrap}
  :root[data-skin="wood"] .nav-h{display:block;font:400 15px var(--sc);color:var(--gold);padding:14px 12px 4px}
  :root[data-skin="wood"] .brand small{display:none}
  :root[data-skin="wood"] #pindock{left:var(--navw)}
  :root[data-skin="wood"] body.docked{padding-left:calc(var(--navw) + 400px)}
  :root[data-skin="wood"] body.docked .scrim{padding-left:calc(var(--navw) + 424px)}
}

let GRAPH={key:""};
function graphLayout(nodes,edges,W,H){
  const key=nodes.map(n=>n.id).join(",")+"|"+edges.map(e=>e.a+e.b).join(",")+"|"+W;
  if(GRAPH.key===key)return GRAPH.pos;
  const N=nodes.length,pos=new Map(),idx=new Map(nodes.map((n,i)=>[n.id,i]));
  nodes.forEach((n,i)=>{const a=i/N*Math.PI*2;pos.set(n.id,{x:W/2+Math.cos(a)*W*.35,y:H/2+Math.sin(a)*H*.35,vx:0,vy:0})});
  const k=Math.sqrt(W*H/Math.max(N,1))*.75;
  for(let it=0;it<500;it++){
    const t=1-it/500;
    for(const a of nodes){const pa=pos.get(a.id);pa.vx=0;pa.vy=0}
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const pa=pos.get(nodes[i].id),pb=pos.get(nodes[j].id);let dx=pa.x-pb.x,dy=pa.y-pb.y,d=Math.hypot(dx,dy)||.01;const f=k*k/d;dx/=d;dy/=d;pa.vx+=dx*f;pa.vy+=dy*f;pb.vx-=dx*f;pb.vy-=dy*f}
    for(const e of edges){const pa=pos.get(e.a),pb=pos.get(e.b);if(!pa||!pb)continue;let dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy)||.01;const f=d*d/k;dx/=d;dy/=d;pa.vx+=dx*f;pa.vy+=dy*f;pb.vx-=dx*f;pb.vy-=dy*f}
    for(const n of nodes){const p=pos.get(n.id);p.vx+=(W/2-p.x)*.02*k/10;p.vy+=(H/2-p.y)*.02*k/10;const v=Math.hypot(p.vx,p.vy)||1,step=Math.min(v,k*t*.9);p.x+=p.vx/v*step;p.y+=p.vy/v*step;p.x=Math.max(50,Math.min(W-50,p.x));p.y=Math.max(40,Math.min(H-50,p.y))}
  }
  for(let pass=0;pass<80;pass++){let moved=false;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const pa=pos.get(nodes[i].id),pb=pos.get(nodes[j].id);let dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy)||.01;const min=Math.abs(dy)<40?130:92;
      if(d<min){const push=(min-d)/2;dx/=d;dy/=d;pa.x-=dx*push;pa.y-=dy*push;pb.x+=dx*push;pb.y+=dy*push;moved=true}}
    for(const n of nodes){const p=pos.get(n.id);p.x=Math.max(80,Math.min(W-80,p.x));p.y=Math.max(40,Math.min(H-50,p.y))}
    if(!moved)break}
  GRAPH={key,pos};void idx;return pos;
}
function relGraph(){
  const ids=new Set();S.links.forEach(l=>{if(rec("characters",l.a)&&rec("characters",l.b)){ids.add(l.a);ids.add(l.b)}});
  const nodes=[...ids].map(id=>rec("characters",id)).sort((a,b)=>a.name.localeCompare(b.name));
  const edges=S.links.filter(l=>ids.has(l.a)&&ids.has(l.b));
  if(!nodes.length)return `<div class="empty">No relationships yet. ${isDM()?"Use <b>Add relationship</b> to connect two characters.":""}</div>`;
  const W=1000,H=Math.max(560,Math.min(900,nodes.length*30)),pos=graphLayout(nodes,edges,W,H);
  const col=k=>`var(--rel-${REL_TONE[k]||"muted"})`;
  let svg=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Relationship map"><defs>${Object.keys(REL).map(k=>`<marker id="ar-${k}" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col(k)}"/></marker>`).join("")}<clipPath id="cc"><circle r="22" cx="0" cy="0"/></clipPath></defs>`;
  for(const e of edges){const a=pos.get(e.a),b=pos.get(e.b);const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    const x1=a.x+ux*26,y1=a.y+uy*26,x2=b.x-ux*28,y2=b.y-uy*28;const dirn=e.kind==="serves"||e.kind==="mentor";
    svg+=`<g class="edge" data-act="open" data-type="links" data-id="${e.id}"><title>${esc(rec("characters",e.a).name)} — ${esc(REL[e.kind]||"Linked")}${e.label?": "+esc(e.label):""} — ${esc(rec("characters",e.b).name)}</title><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col(e.kind)}" stroke-width="${e.kind==="enemy"?2.6:2}" ${e.kind==="enemy"||e.kind==="rival"?'stroke-dasharray="6 4"':""} ${dirn?`marker-end="url(#ar-${e.kind})"`:""}/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="14"/></g>`}
  for(const n of nodes){const p=pos.get(n.id);const pc=n.kind==="pc";
    svg+=`<g class="node" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})" data-act="open" data-type="characters" data-id="${n.id}" tabindex="0"><title>${esc(n.name)}</title><circle r="24" fill="var(--block)" stroke="${pc?"var(--bar)":"var(--accent)"}" stroke-width="${pc?3.5:2}"/>${n.img?`<image href="${esc(imgUrl(n.img))}" x="-22" y="-22" width="44" height="44" clip-path="url(#cc)" preserveAspectRatio="xMidYMid slice"/>`:`<text y="6" text-anchor="middle" class="ni">${esc(initials(n.name))}</text>`}<text y="42" text-anchor="middle" class="nl">${esc(n.name.length>22?n.name.slice(0,21)+"…":n.name)}</text></g>`}
  svg+=`</svg>`;
  return `<div class="graph-wrap">${svg}</div><div class="legend">${Object.keys(REL).filter(k=>edges.some(e=>e.kind===k)).map(k=>`<span><i style="background:${col(k)}"></i>${REL[k]}</span>`).join("")}<span><i class="ring pc"></i>Party member</span></div>`;
}

async function scnPut(n,draft){
  const old=S.scenes.filter(s=>num(s.session)===n);let ok=true;
  for(let i=0;i<draft.length;i++){const{id,updated:_u,dmOnly:_d,secret:_s,...f}=draft[i],cur=old.find(s=>s.id===id),data={...(cur?JSON.parse(JSON.stringify(cur)):{}),...f,session:n,order:i};
    delete data.id;delete data.updated;delete data.dmOnly;delete data.secret;
    if(cur&&scnSame(cur,data))continue;
    if(!await save("scenes",id,data))ok=false}
  if(ok)for(const o of old)if(!draft.some(d=>d.id===o.id))await remove("scenes",o.id);

    if(SCN.pid===pid){clearTimeout(SCN.timer);

      if(more)SCN.timer=setTimeout(scnFlush,wait)}
    else{SCN.pending[pid]=snap;

function nextGame(){
  const sc=S.settings.schedule;if(!sc||!sc.next)return null;
  let d=new Date(sc.next);if(isNaN(d))return null;
  const step=sc.repeat==="weekly"?7:sc.repeat==="biweekly"?14:0,now=Date.now();
  if(step)while(d.getTime()+4*3600e3<now)d=new Date(d.getTime()+step*864e5);

}
function nextGameText(){
  const d=nextGame();if(!d)return "";
  const now=new Date(),days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  if(d.getTime()+4*3600e3<now.getTime())return "";
  const when=days===0?"tonight":days===1?"tomorrow":days<0?"":`in ${days} days`;
  return `Next game ${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}, ${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}${when?` · ${when}`:""}`;
}

function vTimeline(c){

  items.sort((a,b)=>a.i-b.i||((a.x.session||0)-(b.x.session||0)));

    prev=it.i;
  }
  if(!todayDone){if(prev!==null&&tIdx>prev)h+=`<div class="tl-gap">${tIdx-prev} day${tIdx-prev>1?"s":""} later</div>`;h+=todayMark()}

/* Session Table: four columns for game night (path and party · current scene · dice and log · rules and travel). It is what Table mode opens. */
const ST={start:false,tool:"oracle",rolls:[],undo:[],miles:"",pace:"normal",prevHide:false,open:new Set(["read"]),q:"",pins:[],tag:"",rcat:"Conditions",improv:null,sheet:null,entry:null,gen:null,recap:false,hooksSent:false};

function stPlan(){const l=sessList(),n=rcSession();return l.includes(U.sess)?sessPlan(U.sess):l.includes(n)?sessPlan(n):thNext()}
// older or hand-edited scenes may be missing their lists, so fill them in before the Table reads them
const stScenes=p=>p?p.scenes.map(s=>({...s,clues:s.clues||[],ifs:s.ifs||[],who:s.who||[]})):[];
/* in-game time of day: minutes after midnight in settings/igtime; crossing midnight moves the date quietly */
const igMin=()=>{const m=num((S.settings.igtime||{}).min);return m==null?480:m};
const fmtMin=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return `${(h%12)||12}:${String(mm).padStart(2,"0")} ${h<12?"am":"pm"}`};
/* Time taps run one after another, so two quick taps both count. stMin holds the time just written until the queue is empty. */
const ST_MAX_ADD=60*1440;  // never jump more than 60 days in one tap
let stQ=Promise.resolve(),stPend=0,stMin=null;
function stQueue(fn){stPend++;return stQ=stQ.then(fn).catch(e=>console.error(e)).finally(()=>{if(!--stPend)stMin=null;try{renderTable()}catch(e){console.error(e)}})}
// take a notes line back out, but only while it's still the last line of that session's notes
async function stDropLine(l){if(!l)return;const lines=(rcNotesVal(l.session)||"").split("\n");if(!lines.length||!lines[lines.length-1].includes(l.text))return;
  lines.pop();U.rcNotes=lines.join("\n");markDirty(l.session);await saveLog(l.session)}
function stSay(t){let a=document.getElementById("sx-say");if(!a){a=document.createElement("div");a.id="sx-say";a.className="sr-only";a.setAttribute("aria-live","polite");document.body.append(a)}a.textContent=t}
function stTime(add,long,line){return stQueue(async()=>{
  add=Math.max(0,Math.min(num(add)||0,ST_MAX_ADD));const cur=stMin??igMin(),total=cur+add;let nx=total%1440,days=Math.floor(total/1440);
  if(long){nx=480;days=1}
  // the time saves first; if that fails nothing else changes and there's nothing to undo
  if(!await save("settings","igtime",{min:nx}))return;stMin=nx;
  const u={min:cur,days,line:null};
  if(days){await dayStep(days,!long);if(long&&LAST_TIME_LINE)u.line={...LAST_TIME_LINE}}
  if(line)u.line={session:await addSessionLine(line),text:line};
  ST.undo.push(u);if(ST.undo.length>20)ST.undo.shift();
  stSay("It is now "+fmtMin(nx))})}
// each undo entry remembers its own notes line (long or short rest), so undoing in any order takes back the right one
function stUndo(){return stQueue(async()=>{const u=ST.undo.pop();if(!u)return;
  if(!await save("settings","igtime",{min:u.min})){ST.undo.push(u);return}stMin=u.min;
  await stDropLine(u.line);
  if(u.days){LAST_TIME_LINE=null;await dayStep(-u.days,true)}
  stSay("Time set back to "+fmtMin(u.min))})}

  if(scnUnsaved(pid)){toast("Your scene edits haven't saved yet, so this change was skipped.");render();return}

  for(let i=0;i<arr.length;i++){const o=prev.find(x=>x.id===arr[i].id);if(o&&JSON.stringify(o)===JSON.stringify(arr[i]))continue;
    const{id,updated:_u,dmOnly:_d,secret:_s,...r}=arr[i];await save("scenes",id,{...r,session:n,order:o?num(o.order)||0:i})}
  project();renderTable()}
const stAtt=(n,x)=>((logFor(n)||{}).att||{})[x.id]||x.attitude||"";

// secret dice: d4-d100, Adv and Dis (two d20s), 2d6; the newest roll shows big with a short history
function stRoll(k){const r=s=>1+Math.floor(Math.random()*s);let o;

function stRecapData(n){const plan=stPlan(),sc=stScenes(plan),items=stLogItems(n).reverse();

    spot:S.characters.filter(x=>x.kind==="pc").map(p=>[p.name,stSpotN(n,p.id)]).filter(x=>x[1]),log:items.map(o=>o.x),tally:items.map(o=>o.x).filter(t=>/^\[Loot\]/i.test(t))}}
function stRecapHtml(n,close){const d=stRecapData(n),li=(a,e)=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="vempty">${e}</p>`;
  return `<div class="sx-wtabs"><span class="sx-kick">Drafted from tonight's play</span><span class="grow"></span>${close}</div><div class="sx-wb"><h2>Recap · Session ${n}</h2>
    <div class="sx-rc"><div><h3>Scenes played</h3>${li(d.played,"No scenes ticked done.")}<h3>Clues the party learned</h3>${li(d.clues,"None revealed.")}<h3>Spotlight tonight</h3><p>${d.spot.length?esc(d.spot.map(([a,b])=>`${a} ★${b}`).join(" · ")):"No moments marked."}</p></div>
      <div><h3>From the log</h3>${li(d.log.slice(-12),"Nothing logged.")}<h3>Loot</h3>${li(d.tally,"None tagged.")}</div></div>
    <div class="sx-hooks"><div class="sx-bhr"><h3>Hooks for next time</h3>${d.hooks.length?`<button type="button" class="btn sm" data-act="stHooks" ${ST.hooksSent?"disabled":""}>${ST.hooksSent?"Added to Threads":"Add them as threads"}</button>`:""}</div><small>Clues the party hasn't found yet, ready to become threads on the Prep Board</small>${li(d.hooks,"Every clue was found.")}</div>

  if(a==="stEqual"){stLayoutSave(null);return renderTable()}

  if(a==="stRcat"){ST.rcat=t.dataset.v;return renderTable()}

const HARPTOS_FEASTS=[[0,"Midwinter","The festival day between Hammer and Alturiak. Nobles renew alliances; commoners feast to break the winter."],
  [3,"Greengrass","The festival day between Tarsakh and Mirtul, celebrating spring: flowers, dancing and the first fresh food."],
  [6,"Midsummer","The festival day between Flamerule and Eleasis: music, feasting and romance. Every fourth year Shieldmeet follows it."],
  [8,"Highharvestide","The festival day between Eleint and Marpenoth: harvest feasts, and a common day to begin journeys."],
  [10,"The Feast of the Moon","The festival day between Uktar and Nightal, honoring ancestors and the dead."]];
async function addFestivals(){
  const c=cal();let n=0;
  for(const [m,title,desc] of HARPTOS_FEASTS){
    if(m>=c.months.length)continue;
    if(S.events.some(e=>e.title===title))continue;
    const fm=c.months.findIndex(mo=>mo.festival&&mo.name.toLowerCase()===title.toLowerCase());
    if(fm>=0){await save("events",uid(),{title,kind:"festival",yearly:true,y:c.today.y,m:fm,d:1,notes:desc,dmOnly:false});n++;continue}
    await save("events",uid(),{title,kind:"festival",yearly:true,y:c.today.y,m,d:c.months[m].days,notes:desc+"\n\nPlaced on the last day of "+c.months[m].name+" because this calendar has no festival days between months.",dmOnly:false});n++;
  }
  toast(n?`Added ${n} festivals`:"The festivals are already on the calendar");
}

/* ---------- shops ---------- */
const COIN_CP={pp:1000,gp:100,ep:50,sp:10,cp:1};
function parsePrice(s){const m=String(s||"").match(/([\d,.]+)\s*(pp|gp|ep|sp|cp)/i);if(!m)return null;return {n:parseFloat(m[1].replace(/,/g,"")),coin:m[2].toLowerCase(),cp:Math.round(parseFloat(m[1].replace(/,/g,""))*COIN_CP[m[2].toLowerCase()])}}
function stockRows(n){return String(n.stock||"").split("\n").map(l=>l.trim()).filter(Boolean).map((l,i)=>{const [name,price,qty]=l.split("|").map(x=>(x||"").trim());return {i,name:name||l,price:price||"",qty:qty===""||qty==null?null:num(qty)}})}
function stockBlock(n){
  const rows=stockRows(n);if(!rows.length&&!isDM())return "";
  return `<div class="stock"><div class="loot-head"><b>For sale</b><span class="dm-only"></span></div>
    ${rows.length?`<table class="stock-t"><thead><tr><th>Item</th><th>Price</th><th>Stock</th><th class="dm-only"></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${linkify(esc(r.name),"")}</td><td class="mono">${esc(r.price)}</td><td class="mono">${r.qty==null?"∞":r.qty}</td><td class="dm-only">${r.qty===0?`<span class="muted">Sold out</span>`:`<button class="btn sm" data-act="stockSell" data-id="${n.id}" data-i="${r.i}">Sell to party</button>`}</td></tr>`).join("")}</tbody></table>`:`<p class="vempty">No stock yet. Edit the note to add items, one per line as <b>Item | price | quantity</b>.</p>`}</div>`;
}
async function stockSell(id,i){
  const n=rec("notes",id);if(!n)return;const rows=stockRows(n),r=rows.find(x=>x.i===i);if(!r)return;
  const pr=parsePrice(r.price);const purse={pp:0,gp:0,ep:0,sp:0,cp:0,...(S.settings.purse||{})};let changed=false;
  if(pr){
    const total=Object.entries(COIN_CP).reduce((a,[k,v])=>a+(num(purse[k])||0)*v,0);
    if(total<pr.cp){toast(`The party can't afford that (${r.price}).`);return}
    if((num(purse[pr.coin])||0)>=pr.n&&Number.isInteger(pr.n))purse[pr.coin]=(num(purse[pr.coin])||0)-pr.n;
    else{let left=total-pr.cp;purse.pp=0;purse.ep=0;purse.gp=Math.floor(left/100);left-=purse.gp*100;purse.sp=Math.floor(left/10);purse.cp=left-purse.sp*10;changed=true}
    await save("settings","purse",purse);
  }
  await save("loot",uid(),{name:r.name,holder:"party",qty:1,value:r.price,notes:`Bought at ${n.title}.`,dmOnly:false});
  if(r.qty!=null){const lines=String(n.stock).split("\n").map(l=>l.trim()).filter(Boolean);lines[i]=[r.name,r.price,String(Math.max(0,r.qty-1))].join(" | ");const{id:_,...keep}=n;await save("notes",id,{...keep,stock:lines.join("\n")})}
  toast(`Sold ${r.name}${pr?` for ${r.price}`:""}${changed?" (coins converted to make change)":""}. Added to Party Treasury.`);
}

/* ---------- trash and version history (stored DM-only, loaded on demand) ---------- */
const NO_HISTORY=new Set(["logs","chats","meta","preps"]);
const HIST_SEEN=new Map();
async function recordHistory(col,id,prev){
  if(NO_HISTORY.has(col)||!prev)return;
  const key=col+"__"+id,last=HIST_SEEN.get(key)||0;if(Date.now()-last<5*60e3)return;HIST_SEEN.set(key,Date.now());
  const data=JSON.parse(JSON.stringify(prev));delete data.id;
  if(JSON.stringify(data).length>200000)return;
  try{await db.collection(SECRET+"/history").doc(key+"__"+Date.now()).set({key,col,eid:id,at:Date.now(),title:titleOf(col,prev)||"",data})}catch(e){console.error("History write failed",e)}
}
async function recordTrash(col,id,prev){
  if(!prev||col==="chats"||col==="meta"||col==="logs")return;
  const data=JSON.parse(JSON.stringify(prev));delete data.id;
  try{await db.collection(SECRET+"/trash").doc(col+"__"+id).set({col,eid:id,at:Date.now(),title:titleOf(col,prev)||"",data})}catch(e){console.error("Trash write failed",e);toast("Couldn't move that to Trash, so it can't be restored later")}
}

}

/* Quick stat block maker: built-in rules of thumb by CR, nudged by role. No outside service. */
const GEN_ROLES={brute:"Brute",skirmisher:"Skirmisher",caster:"Spellcaster",defender:"Defender"};
const GEN_TYPES=["humanoid","beast","undead","fiend","monstrosity","construct","elemental","fey","dragon","aberration","giant","celestial","plant","ooze"];
const GEN_DMG=["slashing","piercing","bludgeoning","fire","cold","lightning","thunder","acid","poison","necrotic","radiant","psychic","force"];
const crNum=cr=>cr==="1/8"?.125:cr==="1/4"?.25:cr==="1/2"?.5:(num(cr)||0);
function genMon(name,o,isPerson){  // isPerson: the stat block is for a named NPC
  const cr=CRS.includes(o.cr)?o.cr:"1",n=crNum(cr),half=Math.floor(n/2),R=GEN_ROLES[o.role]?o.role:"brute",type=GEN_TYPES.includes(o.type)?o.type:"humanoid",dmg=GEN_DMG.includes(o.dmg)?o.dmg:"slashing";
  const low=["0","1/8","1/4","1/2"].indexOf(cr);
  let ac=12+half,hp=low>=0?[3,7,13,22][low]:Math.round(20*n),dpr=low>=0?[1,3,5,7][low]:Math.round(7*n);
  const adj={brute:[-1,1.25,1.15],skirmisher:[1,.85,1],caster:[-1,.8,1.1],defender:[2,1.2,.8]}[R];
  ac=Math.min(22,Math.max(10,ac+adj[0]));hp=Math.max(2,Math.round(hp*adj[1]));dpr=Math.max(1,Math.round(dpr*adj[2]));
  const dc=12+half,prof=n<1?2:2+Math.floor((n-1)/4),pm=Math.min(7,2+Math.floor(n/4)),atk=pm+prof;  // to-hit matches the ability scores below
  const mindless=["beast","ooze","plant"].includes(type);
  const prim=R==="brute"||R==="defender"?"str":R==="skirmisher"?"dex":["fiend","fey","celestial","dragon"].includes(type)?"cha":["undead","aberration","construct"].includes(type)?"int":"wis";
  const ab={str:10,dex:12,con:10+2*Math.max(1,pm-1),int:mindless?3:10,wis:10,cha:mindless?5:10};ab[prim]=10+2*pm;
  const conM=Math.floor((ab.con-10)/2),large=["giant","dragon"].includes(type)||(R==="brute"&&n>=5),die=large?5.5:4.5;
  const hd=Math.max(1,Math.round(hp/(die+conM)));hp=Math.max(1,Math.floor(hd*die)+hd*conM);
  // a named NPC reads as "Mira moves", a kind of creature as "the goblin moves"
  const nm=String(name||"creature").trim()||"creature",proper=!!isPerson&&/^[A-Z]/.test(nm)&&!/^(the|a|an)\s/i.test(nm);

async function heroAct(a,t){if(a!=="heroLvl")U.lvArm=false;

function calcResult(c){
  const t=parseDice(c.dmg);if(!t)return null;const avg=avgTerms(t),dice=diceOnlyAvg(t),[mn,mx]=minMax(t);
  const resF=c.res==="resist"?0.5:c.res==="vuln"?2:c.res==="immune"?0:1;
  if(c.mode==="save"){const dc=+c.dc||0,sb=+c.save||0;let fail=Math.min(1,Math.max(0,(dc-1-sb)/20));const succ=1-fail;const per=(fail*avg+succ*(c.half?avg/2:0))*resF;const n=Math.max(1,+c.targets||1);
    return {mode:"save",fail,avg:avg*resF,half:c.half?avg/2*resF:0,per,total:per*n,n,mn:mn*resF,mx:mx*resF}}
  const ac=+c.ac||0,b=+c.bonus||0;const critMin=c.crit19?19:20;
  let hit=Math.min(19,Math.max(1,21-(ac-b)))/20;let cr=(21-critMin)/20;hit=Math.max(hit,cr);
  if(c.adv==="adv"){hit=1-(1-hit)**2;cr=1-(1-cr)**2}else if(c.adv==="dis"){hit=hit**2;cr=cr**2}
  const critAvg=avg+dice;const per=((hit-cr)*avg+cr*critAvg)*resF;const n=Math.max(1,+c.n||1);
  return {mode:"attack",hit,cr,avg:avg*resF,critAvg:critAvg*resF,per,total:per*n,n,mn:mn*resF,mx:mx*resF}}

function parseSheet(md){

  const sec={};let cur="_";t.split("\n").forEach(l=>{const h=l.match(/^#{1,3}\s+(.+)/);if(h){cur=h[1].trim().toLowerCase();sec[cur]="";return}sec[cur]=(sec[cur]||"")+l+"\n"});
  const get=k=>Object.entries(sec).find(([n])=>n.startsWith(k))?.[1]||"";
  const abil={};const ab=get("ability");let m;const re=/\*\*(STR|DEX|CON|INT|WIS|CHA)\*\*\s*(\d+)\s*\(([+\-−]\d+)\)/g;while((m=re.exec(ab)))abil[m[1]]={score:+m[2],mod:+m[3].replace("−","-")};
  if(Object.keys(abil).length<6)return null;
  const saveLine=(ab.match(/\*\*Saving throws:\*\*\s*([^\n]*)/)||[])[1]||"";const saveProf=new Set(Object.entries(ABBR).filter(([k,v])=>new RegExp(v,"i").test(saveLine)).map(([k])=>k));

  const profText=get("proficiencies");const langs=(profText.match(/\*\*Languages:\*\*\s*([^\n]*)/)||[])[1]||"";const profs=profText.replace(/\*\*Languages:\*\*[^\n]*/,"").trim();
  const feats=get("features").split("\n").map(l=>l.match(/^-\s+\*\*(.+?)\*\*\s*(?:\(([^)]*)\))?\.?\s*(.*)$/)).filter(Boolean).map(x=>({name:x[1],src:x[2]||"",desc:x[3]||""}));

  if(spellsRaw&&!/^\(none\)/.test(spellsRaw)){spellsRaw.split(";").forEach(g=>{g=g.trim();const gm=g.match(/^(.*)\(([^()]*)\)\s*$/);const groupLvl=gm&&/cantrip|^\d+$/.test(gm[2].trim())&&g.split(",").length>1&&!/\(/.test(gm[1])?gm[2].trim():null;
    (groupLvl?gm[1]:g).split(",").map(s=>s.trim()).filter(Boolean).forEach(s=>{const im=s.match(/^(.+?)\s*\((?:level\s*)?(cantrip|\d)\)$/i);const name=im?im[1]:s,lvl=im?im[2]:groupLvl||"?";const key=/cantrip/i.test(lvl)?"Cantrips":lvl==="?"?"Other":"Level "+lvl;(spells[key]=spells[key]||[]).push(name)})})}
  const invT=get("inventory");const curr=(invT.match(/\*\*Currency:\*\*\s*([^\n]*)/)||[])[1]||"";const inv=invT.replace(/\*\*Currency:\*\*[^\n]*/,"").trim().split(/,\s*(?![^()]*\))/).map(s=>s.trim()).filter(Boolean).map(s=>({name:s.replace(/\s*\((equipped|attuned|equipped, attuned)\)/gi,"").trim(),eq:/equipped/i.test(s),att:/attuned/i.test(s)}));
  const attacks=get("attacks").trim();
  const bl=basics.split("\n").map(s=>s.trim()).filter(Boolean);const speed=(basics.match(/\*\*Speed\*\*\s*([^·\n]*)/)||[])[1]||"";
  return {abil,saveProf,pb,skills,profs,langs,feats,spells,inv,curr,attacks,basics:bl,speed:speed.trim(),alert:feats.some(f=>/^Alert$/i.test(f.name)),src:(t.match(/^\*From ([^.]*)/m)||[])[1]||""};
}

/* rules on hover */
const RULES={
  Blinded:"Can't see; automatically fails checks that need sight. Attacks against it have Advantage; its attacks have Disadvantage.",
  Charmed:"Can't attack or target the charmer with harmful effects. The charmer has Advantage on social checks against it.",
  Deafened:"Can't hear; automatically fails checks that need hearing.",
  Exhaustion:"Each level: −2 to every D20 Test and −5 ft. Speed. A Long Rest removes one level; level 6 is death.",
  Frightened:"Disadvantage on ability checks and attacks while the source is in sight. Can't willingly move closer to it.",
  Grappled:"Speed 0. Disadvantage on attacks against anyone but the grappler. The grappler can drag it (moving costs extra).",
  Incapacitated:"Can't take actions, Bonus Actions or Reactions. Concentration breaks; can't speak. Disadvantage on Initiative.",
  Invisible:"Can't be seen without magic. Advantage on Initiative. Attacks against it have Disadvantage; its attacks have Advantage.",
  Paralyzed:"Incapacitated and Speed 0. Fails Str and Dex saves. Attacks against it have Advantage; hits from within 5 ft. are crits.",
  Petrified:"Turned to stone and Incapacitated. Fails Str and Dex saves, resists all damage, immune to poison. Attacks against it have Advantage.",
  Poisoned:"Disadvantage on attack rolls and ability checks.",
  Prone:"Can only crawl or spend half its Speed to stand. Disadvantage on attacks. Attacks within 5 ft. have Advantage; farther ones have Disadvantage.",
  Restrained:"Speed 0. Disadvantage on attacks and Dex saves. Attacks against it have Advantage.",
  Stunned:"Incapacitated. Fails Str and Dex saves. Attacks against it have Advantage.",
  Unconscious:"Incapacitated and Prone; drops what it holds. Fails Str and Dex saves. Attacks have Advantage; hits from within 5 ft. are crits.",
  Bloodied:"At half its Hit Points or fewer.",
  Concentrating:"Taking damage needs a Con save (DC 10 or half the damage, max 30) to keep the spell. Ends if Incapacitated.",
  Concentration:"Taking damage needs a Con save (DC 10 or half the damage, max 30) to keep the spell. Ends if Incapacitated."};
const RULE_RE=new RegExp("\\b("+Object.keys(RULES).join("|")+")\\b","g");
function rulifyIn(root){if(!root)return;root.querySelectorAll(".prose,.statblock").forEach(scope=>{if(scope.closest("[contenteditable],.rte,form"))return;
  const w=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue&&RULE_RE.test(n.nodeValue)&&(RULE_RE.lastIndex=0,true)&&!(n.parentElement&&n.parentElement.closest("a,button,textarea,input,.rl,.rule,h1,h2,h3,[contenteditable]"))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;RULE_RE.lastIndex=0;let m,last=0;const f=document.createDocumentFragment();while((m=RULE_RE.exec(t))){f.appendChild(document.createTextNode(t.slice(last,m.index)));const s=document.createElement("span");s.className="rule";s.dataset.rule=m[1];s.textContent=m[0];s.tabIndex=0;f.appendChild(s);last=m.index+m[0].length}f.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(f,n)})})}
let RULE_TIP=null;
function showRule(el){const r=RULES[el.dataset.rule||el.dataset.cond];if(!r)return;if(!RULE_TIP){RULE_TIP=document.createElement("div");RULE_TIP.id="ruletip";RULE_TIP.setAttribute("role","tooltip");document.body.appendChild(RULE_TIP)}
  RULE_TIP.innerHTML=`<b>${esc(el.dataset.rule||el.dataset.cond)}</b> ${esc(r)}`;RULE_TIP.hidden=false;const b=el.getBoundingClientRect();const w=Math.min(300,innerWidth-24);RULE_TIP.style.width=w+"px";
  let left=Math.max(12,Math.min(innerWidth-w-12,b.left+b.width/2-w/2));RULE_TIP.style.left=left+"px";const h=RULE_TIP.offsetHeight;RULE_TIP.style.top=(b.top>h+14?b.top-h-8:b.bottom+8)+"px"}
function hideRule(){if(RULE_TIP)RULE_TIP.hidden=true}
document.addEventListener("mouseover",e=>{const el=e.target.closest(".rule,.cond");if(el)showRule(el);else if(!e.target.closest("#ruletip"))hideRule()});

/* loot log */
const COIN_RE=/(\d[\d,]*)\s*(pp|gp|ep|sp|cp)\b/gi;
async function logLoot(text){const n=rcSession();let m,coins={};COIN_RE.lastIndex=0;while((m=COIN_RE.exec(text)))coins[m[2].toLowerCase()]=(coins[m[2].toLowerCase()]||0)+num(m[1].replace(/,/g,""));
  const rest=text.replace(COIN_RE,"").replace(/^[\s,;+and]+|[\s,;+and]+$/gi,"").trim();
  if(Object.keys(coins).length){const purse={pp:0,gp:0,ep:0,sp:0,cp:0,...(S.settings.purse||{})};for(const k in coins)purse[k]=(num(purse[k])||0)+coins[k];await save("settings","purse",purse)}
  if(rest){const qm=rest.match(/^(\d+)\s*[x×]?\s+(.+)$/i);await save("loot",uid(),{name:qm?qm[2]:rest,qty:qm?num(qm[1]):1,holder:"party",notes:`Found in session ${n}.`,dmOnly:false})}
  const l=logFor(n)||{};const{id:_i,dmOnly:_d,secret:_s,...keep}=l;const lootLog=[...(Array.isArray(keep.lootLog)?keep.lootLog:[]),{at:Date.now(),text}];
  await save("logs","s"+n,{...keep,session:n,notes:keep.notes??rcNotesVal(n)??"",open:keep.open||"",spotlight:keep.spotlight||[],lootLog});
  toast(Object.keys(coins).length&&rest?"Added to the treasury and loot":Object.keys(coins).length?"Added to the treasury":"Added to party loot")}

/* spell lookup */
function spellDoc(){return rec("meta","spells")||{}}
function spellKey(n){return String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
let SPELLPOP=null;
async function showSpell(el){const name=el.dataset.spell;if(!SPELLPOP){SPELLPOP=document.createElement("div");SPELLPOP.id="spellpop";document.body.appendChild(SPELLPOP)}
  const place=()=>{const b=el.getBoundingClientRect();const w=Math.min(340,innerWidth-24);SPELLPOP.style.width=w+"px";SPELLPOP.style.left=Math.max(12,Math.min(innerWidth-w-12,b.left))+"px";const h=SPELLPOP.offsetHeight;SPELLPOP.style.top=Math.max(12,(b.bottom+h+10<innerHeight?b.bottom+6:b.top-h-6))+"px"};
  const k=spellKey(name);const cached=spellDoc()[k];
  SPELLPOP.innerHTML=`<div class="sp-h"><b>${esc(name)}</b><button type="button" class="btn icon" data-spclose aria-label="Close">✕</button></div><div class="sp-b">${cached?spellBody(cached):'<p class="vempty">No saved summary for this spell.</p>'}</div>`;SPELLPOP.hidden=false;place();
}
function spellBody(t){return `<div class="sp-lines">${String(t).split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([A-Za-z &]+):\s*(.*)$/);return m?`<div><b>${esc(m[1])}.</b> ${esc(m[2])}</div>`:`<div>${esc(l)}</div>`}).join("")}</div><small class="sp-note">Saved summary.</small>`}
document.addEventListener("click",e=>{const s=e.target.closest("[data-spell]");if(s){e.preventDefault();e.stopPropagation();showSpell(s);return}if(e.target.closest("[data-spclose]")||(SPELLPOP&&!SPELLPOP.hidden&&!e.target.closest("#spellpop"))){if(SPELLPOP)SPELLPOP.hidden=true}},true);

/* timers */
let TIMERS=[];try{TIMERS=JSON.parse(localStorage.getItem("dmdesk-timers")||"[]")}catch(e){}
function timersSave(){try{localStorage.setItem("dmdesk-timers",JSON.stringify(TIMERS))}catch(e){}}
function timerLeft(t){return t.kind==="rounds"?t.left:Math.max(0,Math.round((t.end-Date.now())/1000))}
function fmtLeft(t){if(t.kind==="rounds")return `${t.left} round${t.left===1?"":"s"}`;const s=timerLeft(t);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`:`${m}:${String(ss).padStart(2,"0")}`}
function addTimer(label,unit,n){n=Math.max(1,num(n)||1);const t={id:uid(),label:label||"Timer",kind:unit==="rounds"?"rounds":"real",fired:false};if(t.kind==="rounds")t.left=n;else t.end=Date.now()+n*(unit==="hour"?3600:60)*1000;TIMERS.push(t);timersSave();if(TM)renderTable();toast(`${t.label}: ${fmtLeft(t)}`)}
document.addEventListener("submit",e=>{const f=e.target.closest("[data-tmrform]");if(!f)return;e.preventDefault();e.stopPropagation();addTimer(document.getElementById("tmr-l").value.trim(),document.getElementById("tmr-u").value,document.getElementById("tmr-n").value)},true);
document.addEventListener("click",e=>{const p=e.target.closest("[data-tmrpre]");if(p){e.stopPropagation();const[l,u,n]=p.dataset.tmrpre.split("|");addTimer(l,u,n);return}
  const x=e.target.closest("[data-tmrx]");if(x){e.stopPropagation();TIMERS=TIMERS.filter(t=>t.id!==x.dataset.tmrx);timersSave();if(TM)renderTable();return}
  if(e.target.closest("[data-tmrround]")){e.stopPropagation();TIMERS.forEach(t=>{if(t.kind==="rounds"&&t.left>0){t.left--;if(t.left===0&&!t.fired){t.fired=true;toast(`${t.label} has run out`)}}});timersSave();if(TM)renderTable()}},true);
setInterval(()=>{let changed=false;TIMERS.forEach(t=>{if(t.kind==="real"){const el=document.querySelector(`.tmr-left[data-tid="${t.id}"]`);if(el)el.textContent=timerLeft(t)<=0?"Done":fmtLeft(t);if(timerLeft(t)<=0&&!t.fired){t.fired=true;changed=true;toast(`${t.label} has run out`);el&&el.closest("li")?.classList.add("done")}}});if(changed)timersSave()},1000);

/* last time on */
/* "last time" = the newest recap from before the session you're about to run (the next unplayed plan), or simply the newest recap */
function lastRecap(){const recaps=S.notes.filter(x=>x.category==="session").sort((a,b)=>(b.session||0)-(a.session||0));const up=thNext();const n=up?up.session:Infinity;return recaps.find(x=>(x.session||0)<n)||recaps[0]||null}
function lastTimeText(){const r=lastRecap();if(!r)return "";const t=plain(r.body||"");const cut=t.search(/\n\s*(As the scene fades|As the scene opens)/i);return (cut>0?t.slice(0,cut):t).trim()}

/* wrap-up */
function wrapUp(){const n=rcSession();const notes=noteLines(rcNotesVal(n)).length;const plan=sessList().includes(n)?sessPlan(n):null;const rev=revealItems(plan).filter(x=>x.done).length;const l=logFor(n);const loot=(l&&l.lootLog||[]).length;const ms=clockMs();
  const sched=S.settings.schedule||{};
  showSheet(`<div class="sheet" role="dialog" aria-label="Wrap up the session"><h2>Wrap up session ${n}</h2>
    <ul class="wrap-sum"><li><b>${ms?fmtClock(ms):"–"}</b> played</li><li><b>${notes}</b> note line${notes===1?"":"s"}</li><li><b>${rev}</b> reveal${rev===1?"":"s"}</li><li><b>${loot}</b> loot entr${loot===1?"y":"ies"}</li></ul>
    <section class="wrap-s"><h3>1. Recap</h3><p class="tool-d">Write up session ${n} as a recap note.</p><button type="button" class="btn primary" data-act="newRecap">New session recap</button></section>
    <section class="wrap-s"><h3>2. Calendar</h3><p class="tool-d">Today in the world: <b>${esc(fmtDate(cal(),cal().today))}</b>.</p><div class="wrap-row"><button type="button" class="btn sm" data-act="day" data-n="1">+1 day</button><button type="button" class="btn sm" data-act="day" data-n="week">+1 ${esc(cal().weekName||"week")}</button></div></section>
    <section class="wrap-s"><h3>3. Next game</h3><div class="wrap-row"><input type="datetime-local" id="wrap-next" value="${esc(sched.next||"")}" aria-label="Next game"><button type="button" class="btn sm" data-wrap="next">Save</button></div></section>
    ${plan&&plan.status!=="played"?`<section class="wrap-s"><h3>4. Scenes</h3><button type="button" class="btn sm" data-wrap="played" data-id="${plan.id}">Mark session ${n} as played</button></section>`:""}
    <div class="foot"><span class="grow"></span><button type="button" class="btn" data-act="close">Done</button></div></div>`,true)}
document.addEventListener("click",async e=>{const w=e.target.closest("[data-wrap]");if(!w){if(e.target.closest("[data-act=wrapUp]")){e.stopPropagation();if(CLOCK.running){CLOCK.acc=clockMs();CLOCK.running=false;CLOCK.start=null;clockSave()}wrapUp()}return}
  e.stopPropagation();const a=w.dataset.wrap;
  if(a==="next"){const v=document.getElementById("wrap-next").value;await save("settings","schedule",{...(S.settings.schedule||{}),next:v});toast(v?"Next game saved":"Next game cleared")}
  else if(a==="played"){await stScenePatch(w.dataset.id,sc=>sc.forEach(s=>{s.played=true}));w.disabled=true;w.textContent="Marked as played"}},true);
