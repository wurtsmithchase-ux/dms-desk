<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>
.ms-eye{display:none!important}
.beat-cl{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.beat-cl li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;line-height:1.4}
.beat-cl input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.beat-cl li.done span{color:var(--muted);text-decoration:line-through}
.beat-add{display:flex;gap:8px;align-items:center}.beat-add input{flex:1;min-width:0}
.cl-rows{display:flex;flex-direction:column;gap:6px}
.cl-row{display:flex;gap:6px;align-items:center}.cl-row .cl-text{flex:1;min-width:0}
.cl-row .cl-done{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.cl-add{align-self:flex-start;margin-top:8px}
</style>
</head><body>
<title>DM's Desk</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f1812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DM's Desk"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,500;0,700;1,400&family=Spectral+SC:wght@600;700&family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a leather-bound header over a parchment desk; party members as monster-style stat blocks, quests as sidebar notes, tables in rulebook stripes */
:root{
  --bg:#efe4c9; --paper:#f8efd9; --surface:#fdf6e6; --surface2:#f2e7cb; --block:#fdf1dc;
  --ink:#2a1d14; --muted:#6e5a44; --line:#d6c19a; --stripe:#e0e5c1; --side:#e9ecd2;
  --accent:#7a200d; --accent-ink:#f9ecc9; --accent-soft:#f1dcc6; --gold:#b8913f; --bar:#e69a28;
  --blood:#9b1c12; --blood-soft:#f3d4cb; --ok:#3f6b2a; --ok-soft:#dfe8c8; --warn:#8a5a00; --warn-soft:#f3e2b7;
  --hdr:#2b1510; --hdr2:#40201a; --hdr-ink:#f0dcae;
  --title:"Cinzel","Trajan Pro",Georgia,serif; --display:"Spectral SC","Cinzel",Georgia,serif; --drop:"Cinzel Decorative","Cinzel",Georgia,serif;
  --body:"Spectral","Book Antiqua",Georgia,serif; --ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif; --sc:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --mono:"Alegreya Sans",system-ui,sans-serif; --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16110d; --paper:#1d1611; --surface:#241b15; --surface2:#2c2219; --block:#2a1f17;
  --ink:#eadcc0; --muted:#b3a183; --line:#4b3a2a; --stripe:#2b2f21; --side:#262a1d;
  --accent:#e4876c; --accent-ink:#1d0f0a; --accent-soft:#3b2119; --gold:#d6b36a; --bar:#c27a1c;
  --blood:#f07a64; --blood-soft:#3d1c16; --ok:#a5c47f; --ok-soft:#24301a; --warn:#e3b553; --warn-soft:#352812;
  --hdr:#0f0907; --hdr2:#1e100c; --hdr-ink:#e9cf94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110d; --paper:#1d1611; --surface:#241b15; --surface2:#2c2219; --block:#2a1f17;
  --ink:#eadcc0; --muted:#b3a183; --line:#4b3a2a; --stripe:#2b2f21; --side:#262a1d;
  --accent:#e4876c; --accent-ink:#1d0f0a; --accent-soft:#3b2119; --gold:#d6b36a; --bar:#c27a1c;
  --blood:#f07a64; --blood-soft:#3d1c16; --ok:#a5c47f; --ok-soft:#24301a; --warn:#e3b553; --warn-soft:#352812;
  --hdr:#0f0907; --hdr2:#1e100c; --hdr-ink:#e9cf94; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,var(--paper),transparent 60%),radial-gradient(ellipse at 90% 100%,var(--surface2),transparent 55%);background-attachment:fixed;color:var(--ink);font:17px/1.55 var(--body);margin:0}
button,input,select,textarea{font:inherit;font-family:var(--ui);color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--hdr2),var(--hdr));color:var(--hdr-ink);border-bottom:3px solid var(--gold);box-shadow:0 2px 0 var(--hdr)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.brand small{font:700 12px var(--sc);letter-spacing:.24em;color:var(--gold)}
.brand h1{font:900 32px/1.05 var(--title);margin:2px 0 0;letter-spacing:.04em;text-wrap:balance}
.brand h1 button{all:unset;cursor:pointer;overflow-wrap:anywhere}
.brand h1 button:hover{color:#fff3d1}
.brand h1 button:focus-visible{outline:2px solid var(--gold)}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid var(--gold);border-radius:2px;padding:4px 6px 4px 12px;background:rgba(0,0,0,.25)}
.clock .d{font:600 16px var(--title);white-space:nowrap;letter-spacing:.02em}
.clock .w{color:var(--gold);font:500 14px var(--sc);white-space:nowrap;letter-spacing:.04em}
.clock .btn{background:transparent;color:var(--hdr-ink);border-color:rgba(214,179,106,.5)}
.clock .btn:hover{border-color:var(--gold);background:rgba(214,179,106,.15)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 16px 8px;text-decoration:none;color:var(--hdr-ink);opacity:.7;font:700 15px var(--sc);letter-spacing:.1em;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
nav.tabs a:hover{opacity:1}
nav.tabs a[aria-current="page"]{opacity:1;color:#fff3d1;border-bottom-color:var(--bar)}
nav.tabs a .n{font:500 12px var(--ui);margin-left:5px;opacity:.8}

main{padding-block:26px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.bar h2{font:700 30px/1.05 var(--display);color:var(--accent);margin:0 auto 0 0;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;color:var(--muted);font:700 14px var(--sc);letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:var(--r);cursor:pointer;font:700 14px var(--sc);letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--blood)}
.btn.danger.armed{background:var(--blood);color:var(--surface);border-color:var(--blood)}
.btn.sm{padding:1px 9px;font-size:13px}
.icon{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;font-family:var(--ui)}
input.search,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;min-width:0}
.fmtbar{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:var(--surface2);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.fmt{border:1px solid transparent;background:none;color:var(--ink);padding:3px 10px;border-radius:var(--r);cursor:pointer;font:700 14px var(--sc);letter-spacing:.04em;min-height:32px}
.fmt:hover{background:var(--accent-soft);color:var(--accent)}
.fmt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fmt b,.fmt i{font-family:var(--body);font-size:16px}
.rte{border:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:10px 12px;min-height:140px;max-height:60vh;overflow:auto;font:16px/1.5 var(--body);outline:none;overflow-wrap:anywhere}
.rte.tall{min-height:320px}
.rte:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rte:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.rte p{margin:0 0 10px}
.rte h4{font:700 19px var(--display);color:var(--accent);margin:12px 0 4px;border-bottom:1px solid var(--gold)}
.rte ul{margin:0 0 10px;padding-left:22px}
.rte b,.rte strong{color:var(--accent)}
input.search{width:230px;max-width:100%}
.label{font:700 13px var(--sc);letter-spacing:.12em;color:var(--accent)}
.empty{border:1px dashed var(--gold);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);font-style:italic;background:var(--paper)}
.mono{font-family:var(--ui);font-variant-numeric:lining-nums tabular-nums}
.pill{display:inline-block;font:700 12px var(--sc);letter-spacing:.08em;padding:1px 8px;border-radius:2px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);vertical-align:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--blood-soft);color:var(--blood);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;border-radius:var(--r);margin-bottom:16px}
.section-h{font:700 20px var(--display);color:var(--accent);margin:0 0 10px;border-bottom:1px solid var(--gold);padding-bottom:2px}

/* Party: stat blocks */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:32px}
.pc{background:var(--block);border-top:5px solid var(--bar);border-bottom:5px solid var(--bar);box-shadow:0 0 0 1px var(--line),0 3px 8px rgba(40,20,5,.15);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc h3{margin:0;font:700 22px/1.15 var(--display);color:var(--accent);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.pc h3:hover{text-decoration:underline;text-decoration-thickness:1px}
.pc .sub{font-style:italic;color:var(--ink);font-size:15px;line-height:1.3}
.taper{height:5px;background:var(--accent);clip-path:polygon(0 50%,0 0,100% 50%,0 100%);margin:2px 0}
.prose::after{content:"";display:table;clear:both} /* the text box holds its own floated drop cap, so a divider after short text sits below it, not beside it */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.stat b{display:block;font:500 21px/1.15 var(--ui);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.stat span{font:800 12px var(--sc);letter-spacing:.08em;color:var(--accent)}
.hp{display:flex;align-items:center;gap:6px}
.hpbar{flex:1;height:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.hpbar i.mid{background:var(--warn)} .hpbar i.low{background:var(--blood)}
.pcnote{font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcnote b{color:var(--accent);font-style:italic}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-family:var(--ui);font-size:16px}
th,td{text-align:left;padding:6px 10px;vertical-align:top}
th{font:800 14px var(--sc);letter-spacing:.06em;color:var(--ink);border-bottom:1px solid var(--ink)}
tbody tr:nth-child(odd) td{background:var(--stripe)}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--accent-soft)}
td b{font-family:var(--body)}
td .clip{display:block;max-width:320px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Notes: a page of the tome */
.notes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.nlist{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);max-height:72vh;overflow:auto}
.nitem{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.nitem:hover{background:var(--surface2)}
.nitem[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.nitem b{font:600 16px/1.25 var(--body);overflow-wrap:anywhere}
.nitem small{color:var(--muted);font:500 13px var(--sc);letter-spacing:.04em}
.reader{background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 14px rgba(40,20,5,.12);padding:26px 32px;min-width:0}
.reader h3.t{font:700 34px/1.1 var(--display);color:var(--accent);margin:6px 0 2px;text-wrap:balance;padding-bottom:4px;border-bottom:2px solid var(--gold)}
/* Library groups, list and entry page */
.lib-q{flex:1 1 220px;max-width:380px}
.lib-groups{display:flex;flex-wrap:wrap;gap:5px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;background:var(--paper)}
.lib-g{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:500 14px var(--sc);letter-spacing:.03em;cursor:pointer}
.lib-g .n{font:400 12px var(--ui);color:var(--muted)}
.lib-g[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lib-g[aria-pressed="true"] .n{color:inherit;opacity:.85}
.lib-lh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 12px 6px;border-bottom:1px solid var(--line)}
.lib-lh h3{margin:0;font:400 20px var(--display);color:var(--accent)}
.lib-lh span{font-size:14px;color:var(--muted)}
.nitem .nb{font-size:14px;color:var(--muted);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.le-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 14px}
.le-t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.le-crumb{font-size:14px;color:var(--muted)}
.le-head .acts-r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lib-entry h3.t{margin-top:0}
.le-fields{margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.le-fields dt{font:400 14px var(--sc);color:var(--muted)}
.le-fields dd{margin:2px 0 0;font-weight:600}
.le-cols{display:flex;flex-wrap:wrap;gap:20px 28px;margin-top:16px}
.le-main{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.le-side{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:14px}
.le-side:empty{display:none}
.le-side > .taper:first-child{display:none}
.le-h{margin:0 0 4px;font:400 20px var(--display);color:var(--accent)}
/* Prep Board */
.pboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start}
.pb-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.pb-next,.pb-pathc{grid-column:span 2}
@media (max-width:700px){.pb-next,.pb-pathc{grid-column:auto}}
.pb-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pb-h h3{margin:0;font:400 22px var(--display);color:var(--accent)}
.pb-n{font:400 14px var(--ui);color:var(--muted)}
.pb-title{margin:0;font:700 24px/1.2 var(--title)}
.pb-sub{margin:0;color:var(--muted);font-style:italic}
.pb-prog{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.pb-prog span{display:block;height:100%;background:var(--accent)}
.pb-check{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 14px}
.pb-check li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.pb-check li::before{content:"";width:14px;height:14px;border:1.5px solid var(--muted);border-radius:2px;flex:0 0 14px}
.pb-check li.done{color:var(--ink)}
.pb-check li.done::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--paper)}
.pb-path{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px}
.pb-path li::marker{color:var(--accent);font-weight:700}
.pb-row{display:flex;flex-direction:column;gap:1px;min-height:44px;justify-content:center;text-align:left;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}
.pb-row:hover{background:var(--surface2)}
.pb-row b{font:600 16px/1.25 var(--body)}
.pb-row small{color:var(--muted);font-size:14px}
.pb-spot{display:flex;flex-direction:column;gap:6px}
.pb-sp{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center}
.pb-sp > :first-child{grid-row:span 2}
.pb-sp small{color:var(--muted);font-size:14px}
.pb-sp.warn small{color:var(--blood);font-weight:600}
.clks.pb-clks{grid-template-columns:minmax(0,1fr)}
/* Scene Editor */
.scn-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.scn-plan{flex:0 1 420px}
.scn-state{color:var(--muted);font-style:italic;min-height:1.4em}
.scn-note{margin:0 0 12px;padding:10px 14px;border:1px dashed var(--gold);border-radius:var(--r);background:var(--surface);color:var(--muted)}
.scn{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.scn{grid-template-columns:minmax(0,1fr)}}
.scn-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.scn-box,.scn-ed{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.scn-ed{gap:14px;padding:18px 22px 22px}
.scn-box h3{margin:0;font:400 22px var(--display);color:var(--accent)}
.scn-sub{margin:10px 0 0;font:400 17px var(--display);color:var(--muted)}
.scn-in{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-family:var(--body);font-size:17px}
textarea.scn-in{resize:vertical;line-height:1.5}
.scn-title{font:700 22px var(--title)}
.scn-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.scn-pr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center}
.scn-pb{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:600 16px/1.25 var(--body);min-width:0}
.scn-pb:hover{background:var(--surface2)}
.scn-pb[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scn-pt{overflow-wrap:anywhere}
.scn-num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font:700 13px var(--ui);background:var(--surface2);color:var(--ink)}
.scn-pb[aria-current="true"] .scn-num{background:var(--accent-ink);color:var(--accent)}
.scn-pr .btn.icon:disabled{opacity:.35}
.scn-lib{display:flex;flex-direction:column;gap:6px}
.scn-lr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}

.pill.dmp{background:var(--hdr);color:var(--hdr-ink);border-color:var(--gold)}
.rels{display:flex;flex-direction:column;gap:2px}
.rel-i{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:5px 2px;cursor:pointer;font-family:var(--body);width:100%;border-bottom:1px solid var(--line)}
.rel-i:hover{background:var(--accent-soft)}
.rel-i span{display:flex;flex-direction:column;min-width:0}
.rel-i small{color:var(--muted);font:400 14px var(--ui)}
.tone{font:700 13px var(--sc);letter-spacing:.04em}
.t-ok{color:var(--rel-ok)} .t-bad{color:var(--rel-bad)} .t-acc{color:var(--rel-acc)} .t-gold{color:var(--rel-gold)} .t-warn{color:var(--rel-warn)} .t-muted{color:var(--rel-muted)}
.carry{margin:0;padding-left:20px}

/* faction block */
.facblock{background:var(--side);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:10px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin:10px 0}
.facblock .full{grid-column:1/-1}
@media (max-width:520px){.facblock{grid-template-columns:minmax(0,1fr)}}

/* world */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.mapcard{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper);padding:0;cursor:pointer;text-align:left;font-family:var(--body);overflow:hidden;box-shadow:0 3px 8px rgba(40,20,5,.12)}
.mapcard img,.mapph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.mapph{display:grid;place-items:center;color:var(--muted);font-style:italic}
.mapph.big{aspect-ratio:16/9}
.mc-t{padding:8px 12px;display:flex;flex-direction:column}
.mc-t small{color:var(--muted);font:500 13px var(--sc)}
.sheet.wide{width:min(1100px,100%)}
.map-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:4px}
.map-head h2{border:0;padding:0}
.map-head .grow{flex:1}
.hint-p{margin:0;color:var(--muted);font:400 14px var(--ui)}
.map-view{overflow:auto;border:1px solid var(--line);background:var(--surface2);max-height:72vh;overscroll-behavior:contain}
.map-inner{position:relative;min-width:100%}
.map-inner img{display:block;width:100%;height:auto;user-select:none}
.map-inner.editing{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pin-dot{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid var(--accent-ink);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pin-l{order:-1;font:700 12px var(--ui);background:var(--hdr);color:var(--hdr-ink);padding:1px 6px;border-radius:2px;margin-bottom:4px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.pin:hover .pin-dot,.pin:focus-visible .pin-dot{background:var(--bar)}
.graph-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
.graph{display:block;width:100%;min-width:640px;height:auto}
.graph .node{cursor:pointer}
.graph .node:hover circle,.graph .node:focus circle{stroke:var(--bar);stroke-width:4}
.graph .ni{font:700 15px var(--title);fill:var(--accent)}
.graph .nl{font:600 13px var(--ui);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.graph .edge{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font:500 14px var(--ui);color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.ring{width:14px;height:14px;border-radius:50%;border:3px solid var(--bar);background:none}
.rel-list{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.rel-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 4px;cursor:pointer;font-family:var(--body)}
.rel-row:nth-child(odd){background:var(--stripe)}
.rel-row:hover{background:var(--accent-soft)}
.rel-row small{color:var(--muted);font:400 14px var(--ui)}
@media (max-width:640px){.rel-row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.rel-row small{grid-column:1/-1}}

/* treasury */
.treasury{background:var(--block);border:1px solid var(--line);padding:12px 14px;margin-bottom:32px;display:flex;flex-direction:column;gap:10px}
.purse{display:flex;flex-wrap:wrap;gap:8px}
.coin{display:flex;align-items:center;gap:6px;border:1px solid var(--gold);background:var(--paper);padding:3px 4px 3px 10px;border-radius:999px}
.coin span{font:800 13px var(--sc);color:var(--accent)}
.coin input{width:72px;border:0;background:var(--surface);border-radius:999px;padding:3px 8px;text-align:right;font:600 15px var(--ui);font-variant-numeric:tabular-nums}
.coin b{font:600 15px var(--ui);padding-right:8px}
.loot-head{display:flex;justify-content:space-between;align-items:center}
.loot{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.loot-i{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);padding:8px 10px;cursor:pointer;font-family:var(--body);min-width:0}
.loot-i:hover{border-color:var(--accent)}
.loot-i small{color:var(--muted);font:500 13px var(--sc)}
.li-d{font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* prep */
.prep{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.prep-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.plan{background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 14px rgba(40,20,5,.12);padding:18px 22px}
.plan-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:10px}
.plan-h h3{margin:0;font:700 28px/1.1 var(--display);color:var(--accent)}
.plan-acts{display:flex;gap:6px;flex-wrap:wrap}
.pl-s h4{font:700 19px var(--display);color:var(--accent);margin:14px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);background:var(--surface);border-radius:999px;padding:2px 10px 2px 3px;cursor:pointer;font:500 14px var(--ui)}
.chip:hover{background:var(--accent-soft)}
.chip .av{border-width:1px}
details.past summary,.threads details summary{cursor:pointer;font:700 15px var(--sc);color:var(--accent);letter-spacing:.06em;padding:6px 0}
.threads{position:static}
.threads h4{display:flex;align-items:baseline;gap:8px}
.threads h4 .mono{font-size:15px;color:var(--muted)}
.tq{display:flex;gap:6px}
.tq input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px}
.th{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:7px}
.th input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.th-t{border:0;background:none;text-align:left;padding:0;cursor:pointer;font:15px/1.4 var(--body);color:var(--ink);display:flex;flex-direction:column;min-width:0}
.th-t small{color:var(--muted);font:400 13px var(--ui)}
.th.done .th-t{text-decoration:line-through;color:var(--muted)}
.tools{background:var(--block);border:1px solid var(--line);border-top:5px solid var(--bar);padding:14px 16px}
.tools-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools-h h3{margin:0;font:700 22px var(--display);color:var(--accent)}
.tool{display:flex;flex-direction:column;gap:10px}
.tool-d{margin:0;color:var(--muted);font:400 15px var(--ui)}
.tool textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font:15px/1.45 var(--ui);resize:vertical}
.tool-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:default}
.names{columns:2;margin:0}
textarea.bk{width:100%;min-height:160px;font:12px var(--ui)}
@media (max-width:860px){.prep{grid-template-columns:minmax(0,1fr)}.threads{position:static;max-height:none}}
@media (max-width:640px){
  nav.tabs a{font-size:11px;letter-spacing:.02em;padding-inline:0}
  nav.tabs a .full{display:none}
  .plan{padding:14px}
  .tools-h .seg{width:100%}.tools-h .seg button{flex:1;font-size:12px;padding-inline:4px}
  .map-view{max-height:60vh}
  .sheet.wide{padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
}
@media (min-width:641px){nav.tabs a .short{display:none}}
.navback{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:none;min-height:30px}
.reader-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.reader .reader-nav .back{margin-bottom:0}
@media (min-width:641px){.reader-nav:not(:has(.navback)){display:none}}
.rc-status > span:last-child{font:15px/1.4 var(--body);padding-top:4px}
/* ---- round 2 ---- */
.muted{color:var(--muted)}
.nextgame{font:600 14px var(--ui);color:var(--hdr-ink);border:1px dashed rgba(214,179,106,.6);padding:5px 10px;border-radius:2px;white-space:nowrap}
.nextgame:empty{display:none}
.tm-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bar);color:var(--hdr);border:1px solid var(--gold);border-radius:2px;padding:7px 12px;cursor:pointer;font:800 14px var(--sc);letter-spacing:.06em}
.tm-btn:hover{filter:brightness(1.08)}
.sub-tabs{margin-bottom:16px}
.sub-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.plain-ta{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font:15px/1.45 var(--ui);resize:vertical;min-height:110px}
.plain-ta.tall{min-height:300px}

/* encounters */
.enc-party{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--side);padding:8px 12px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.enc-party input{width:60px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:4px 8px;margin-left:4px}
.enc-rows{display:flex;flex-direction:column;gap:6px}
.enc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto 90px auto;gap:8px;align-items:center}
.enc-row input,.enc-row select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px;min-width:0}
.enc-ct input{width:56px}
.enc-cr,.enc-ct{font:700 13px var(--sc);color:var(--accent);display:flex;gap:4px;align-items:center}
.enc-xp{text-align:right;color:var(--muted);font-size:14px}
.chip small{color:var(--muted);font-size:12px}
.enc-sum{background:var(--paper);border:1px solid var(--gold);padding:12px 14px 30px}
.enc-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.enc-head b{font-size:20px}
.enc-bar{position:relative;height:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:visible;margin:0 30px 0 6px}
.enc-bar i{display:block;height:100%;border-radius:6px;background:var(--muted)}
.enc-bar i.d-low{background:var(--ok)} .enc-bar i.d-moderate{background:var(--warn)} .enc-bar i.d-high,.enc-bar i.d-deadly{background:var(--blood)}
.enc-bar .tick{position:absolute;top:-4px;height:20px;border-left:2px solid var(--ink)}
.enc-bar .tick em{position:absolute;top:20px;left:0;transform:translateX(-50%);font:600 11px/1.15 var(--ui);font-style:normal;color:var(--muted);text-align:center;white-space:nowrap}
.encs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.enc-card{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--side);padding:10px 12px;cursor:pointer;font-family:var(--body)}
.enc-card:hover{background:var(--accent-soft)}
.enc-ct-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.enc-ct-h b{font:700 17px var(--display)}
.enc-ms{font-size:14px;color:var(--ink)}
@media (max-width:640px){.enc-row{grid-template-columns:minmax(0,1fr) auto auto}.enc-xp{grid-column:1/3;text-align:left}.enc-row .btn.icon{grid-column:3;grid-row:2}}

/* tables */
.rt-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.rt{background:var(--paper);border:1px solid var(--line);padding:16px 20px;min-width:0}
.roll-zone{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;padding:12px;background:var(--block);border:1px dashed var(--gold)}
.roll-btn{font-size:17px;padding:10px 18px}
.roll-out{display:flex;gap:10px;align-items:baseline;font-size:18px;min-width:0;flex:1}
.roll-n{font:700 30px var(--title);color:var(--accent);min-width:36px}
.rt-list{margin:0;padding-left:34px;columns:2;column-gap:28px}
.rt-list li{padding:2px 0;break-inside:avoid}
.rt-list li.hit{background:var(--warn-soft);font-weight:600}
@media (max-width:860px){.rt-wrap{grid-template-columns:minmax(0,1fr)}.rt-list{columns:1}}

/* spotlight */
.spot-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
table.spot{min-width:520px}
table.spot td,table.spot th{vertical-align:middle}
table.spot td.c{text-align:center}
table.spot input{width:20px;height:20px;accent-color:var(--accent)}
table.spot tbody tr{cursor:default}
table.spot tbody tr:hover td{background:inherit}

/* arcs */
.arcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:26px}
.arc{background:var(--block);border-top:5px solid var(--bar);box-shadow:0 0 0 1px var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.arc.empty-arc{border-top-color:var(--line);align-items:flex-start}
.arc-h{display:flex;gap:10px;align-items:center}
.arc-h > div{display:flex;flex-direction:column;min-width:0}
.arc-q{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:italic 15px var(--body);color:var(--accent);text-decoration:underline;text-decoration-color:var(--gold)}
.arc-bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.arc-bar i{display:block;height:100%;background:var(--accent)}
.arc small{font:400 13px var(--ui)}
.beats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.beats li{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.35}
.beats li input{margin-top:3px;accent-color:var(--accent);flex:none}
.beats li.done span{color:var(--muted)}
body.player .beats li:not(.done){display:none}

/* what's new */
.whatsnew{background:var(--paper);border:1px solid var(--gold);border-left:5px solid var(--bar);padding:10px 14px;margin-bottom:22px;display:flex;flex-direction:column;gap:6px}
.whatsnew h3{margin:0;font:700 18px var(--display);color:var(--accent)}
.wn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wn-items{display:flex;gap:6px;flex-wrap:wrap}

/* timeline */
.timeline{position:relative;max-width:760px;padding-left:26px;border-left:3px solid var(--gold);margin-left:10px;display:flex;flex-direction:column;gap:4px}
.tl-date{font:700 16px var(--display);color:var(--accent);margin:10px 0 2px -26px;padding-left:26px;position:relative}
.tl-date::before{content:"";position:absolute;left:-9px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.tl-gap{font:italic 14px var(--body);color:var(--muted);padding:6px 0}
.tl-gap:empty{display:none}
.tl-item{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);padding:8px 12px;cursor:pointer;font-family:var(--body)}
.tl-item:hover{border-color:var(--accent)}
.tl-item small{display:block;color:var(--muted);font:500 13px var(--sc);letter-spacing:.04em}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}
.tl-item.k-events .tl-dot{background:var(--ok)}
.tl-today{margin:10px 0 6px -26px;padding:6px 0 6px 26px;border-top:2px dashed var(--accent);font:800 14px var(--sc);color:var(--accent);letter-spacing:.06em}

/* table mode */
.tablemode{position:fixed;inset:0;z-index:18;background:var(--bg);display:flex;flex-direction:column;font-size:19px}
.tm-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,var(--hdr2),var(--hdr));color:var(--hdr-ink);border-bottom:3px solid var(--gold);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.tm-top .btn{background:transparent;color:var(--hdr-ink);border-color:rgba(214,179,106,.6)}
.tm-top .btn.primary{background:var(--bar);color:var(--hdr);border-color:var(--gold)}
.tm-title{font:900 24px var(--title);letter-spacing:.04em}
.tm-date{font:600 16px var(--title);color:var(--gold)}
.tm-top .grow{flex:1}
.tm-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tm-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;max-width:1500px;margin:0 auto;align-items:start}
.tm-main,.tm-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.tm-plan-h h2{margin:0;font:700 36px/1.1 var(--display);color:var(--accent)}
.tm-s{background:var(--paper);border:1px solid var(--line);padding:12px 16px}
.tm-s h3{margin:0 0 6px;font:700 22px var(--display);color:var(--accent);border-bottom:1px solid var(--gold)}
.tm-s .prose{font-size:19px;max-width:none}
.tm-cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.tm-npc{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--block);padding:10px;cursor:pointer;font-family:var(--body)}
.tm-npc:hover{border-color:var(--accent)}
.tm-npc span{display:flex;flex-direction:column;min-width:0}
.tm-npc b{font-size:19px}
.tm-npc small{color:var(--muted);font:500 14px var(--ui)}
.tm-npc-n{font-size:15px;margin-top:2px}
.tm-npc-s{font-size:14px;color:var(--blood);margin-top:4px}
#tm-notes{width:100%;min-height:220px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;font:17px/1.45 var(--ui);resize:vertical}
.tm-rolls{display:flex;flex-direction:column;gap:6px}
.tm-roll{display:flex;gap:8px;align-items:baseline;font-size:16px}
.tm-roll .btn{flex:none}
.tm-coins{margin:0;font-size:17px}
@media (max-width:900px){.tm-grid{grid-template-columns:minmax(0,1fr)}.tablemode{font-size:17px}.tm-plan-h h2{font-size:28px}}

/* ask the desk */

.ask-log{margin:0;padding-left:20px;font:14px/1.45 var(--ui)}
.ask-log:empty{display:none}
.tm-phone{display:none}
@media (max-width:640px){header .tm-btn{display:none}.tm-phone{display:inline-flex;justify-content:center}.nextgame{flex:1 1 100%;font-size:13px;text-align:center}}
/* round 3 */
.clks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.clks.compact{grid-template-columns:minmax(0,1fr);gap:8px}
.clk{display:flex;gap:12px;align-items:flex-start;background:var(--block);border:1px solid var(--line);border-top:4px solid var(--ink);padding:10px 12px}
.clk.full{border-top-color:var(--blood);background:var(--blood-soft)}
.clk.compact{padding:6px 8px;border-top-width:2px;align-items:center}
.clk-svg{flex:none}
.clk-b{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.clk-b b{font:700 17px/1.2 var(--display)}
.clk.compact .clk-b b{font-size:15px}
.clk-b small{color:var(--muted);font:500 13px var(--sc)}
.clk-t{font-size:14px}
.clk-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.clk.compact .clk-acts .btn.icon{width:26px;height:26px}
.off{background:var(--paper);border:1px solid var(--gold);border-left:5px solid var(--bar);padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.off h3{margin:0;font:700 20px var(--display);color:var(--accent)}

/* board layout from the design: top strip (2fr 1fr 1fr), then three stacking columns (1.2fr 1fr 1fr). Sized by the board's own width, since the side menu takes some of the screen */
.pboard{display:flex;flex-direction:column;gap:18px;container-type:inline-size}
.pb-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.pb-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.pb-col{min-width:0;display:flex;flex-direction:column;gap:18px}
.pboard .pb-next,.pboard .pb-pathc{grid-column:auto}
.pb-top .pb-next{justify-content:center}.pb-top .pb-world{justify-content:space-between}
@container (max-width:1050px){
  .pb-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pboard .pb-top .pb-next{grid-column:1/-1}
  .pb-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pb-col1{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
@container (max-width:620px){.pb-top,.pb-cols,.pb-col1{grid-template-columns:minmax(0,1fr)}.pb-col1{grid-column:auto}}
/* clocks on the board: one line each (ring, name, + and −), like the design, not boxed cards */
.pb-clks{gap:0}
.pb-clks .clk{background:none;border:0;border-top:1px solid var(--line);padding:6px 0;align-items:center}
.pb-clks .clk:first-child{border-top:0;padding-top:0}
.pb-clks .clk-b{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center}
.pb-clks .clk-acts{grid-column:2;grid-row:1/span 2;margin:0;flex-wrap:nowrap}
/* active quests as a ruled list, as in the design */
.pboard .pb-qs .pb-row{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:4px 2px}
.pboard .pb-qs .pb-row:first-of-type{border-top:0}
.pboard .pb-qs .pb-row:hover{background:var(--surface)}
.lib-more{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
:root[data-fonts="storybook"]{--title:"IM Fell English SC",Georgia,serif;--display:"IM Fell English SC",Georgia,serif;--drop:"IM Fell English SC",Georgia,serif;--body:"IM Fell English",Georgia,serif}
:root[data-fonts="elvish"]{--title:"Uncial Antiqua",Georgia,serif;--display:"Alegreya SC",Georgia,serif;--drop:"Uncial Antiqua",Georgia,serif;--body:"Alegreya",Georgia,serif}
:root[data-fonts="gothic"]{--title:"UnifrakturCook",Georgia,serif;--display:"Pirata One",Georgia,serif;--drop:"UnifrakturCook",Georgia,serif;--body:"EB Garamond",Georgia,serif}
:root[data-fonts="clean"]{--title:"Marcellus SC",Georgia,serif;--display:"Marcellus",Georgia,serif;--drop:"Marcellus SC",Georgia,serif;--body:"Source Serif 4",Georgia,serif}
:root[data-fonts="easy"]{--title:"Atkinson Hyperlegible",system-ui,sans-serif;--display:"Atkinson Hyperlegible",system-ui,sans-serif;--drop:"Atkinson Hyperlegible",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;--ui:"Atkinson Hyperlegible",system-ui,sans-serif;--sc:"Atkinson Hyperlegible",system-ui,sans-serif;--mono:"Atkinson Hyperlegible",system-ui,sans-serif}

body{zoom:var(--zoom,1)}
:root[data-plain] body{background-image:none}

.style-btn svg{width:18px;height:18px}
@media (max-width:640px){.style-btn{padding:0;width:44px;height:44px;justify-content:center;flex:0 0 44px}.style-btn svg{width:20px;height:20px}}
.st-sec{margin:0 0 18px}
.st-sec h3{margin:0 0 8px;font:700 18px var(--display);color:var(--accent)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st-card{display:flex;flex-direction:column;gap:0;padding:0;border:2px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;background:none;text-align:left;font:inherit;color:inherit}
.st-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.st-card .sw-top{height:22px;display:flex;align-items:center;padding:0 8px;font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase}
.st-card .sw-body{padding:8px 9px 9px;display:flex;flex-direction:column;gap:5px;min-height:62px}
.st-card .sw-h{font:700 15px Georgia,serif}
.st-card .sw-line{height:5px;border-radius:3px;opacity:.55}
.st-card .sw-dots{display:flex;gap:4px;margin-top:auto}
.st-card .sw-dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.st-card .sw-name{display:block;padding:5px 9px 7px;font:600 14px var(--ui);background:var(--surface);color:var(--ink);border-top:1px solid var(--line)}
.st-card .sw-name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.st-font{padding:10px 12px;gap:2px;background:var(--surface)}
.st-font .ft{font-size:20px;line-height:1.2;color:var(--accent)}
.st-font .fb{font-size:15px;line-height:1.35;color:var(--ink)}
.st-font .fn{font:600 12px var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.st-seg{display:flex;flex-wrap:wrap;gap:6px}
.st-seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 14px;cursor:pointer;font:600 15px var(--ui)}
.st-seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#texture{position:fixed;inset:0;pointer-events:none;z-index:2147483000}
.tex-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.tex-sw{display:block;height:64px;background-color:var(--paper)}
.st-lab{font:600 14px var(--ui);color:var(--muted);align-self:center;margin-right:4px}
@media print{#texture{display:none}}
.arcs-after{margin-top:30px}
.vsheet>summary{cursor:pointer;list-style:none}.vsheet>summary::-webkit-details-marker{display:none}.vsheet>summary h3::after{content:" ▸";color:var(--muted);font-size:.8em}.vsheet[open]>summary h3::after{content:" ▾"}
/* ---- dice ---- */
.rl{color:var(--accent);border-bottom:1px dashed currentColor;cursor:pointer;font-weight:600;white-space:nowrap}
.rl:hover{background:var(--accent-soft)}
.rl-all{cursor:pointer}
.rl-all:hover{color:var(--accent);text-decoration:underline dotted}
#diceFab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:var(--hdr);color:var(--hdr-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#diceFab:hover,#diceFab.on{background:var(--accent);color:var(--accent-ink)}
#dicetray{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:26;width:360px;max-width:calc(100vw - 32px);max-height:min(640px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--gold);border-top:4px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:var(--ui)}
.dtray-h{display:flex;gap:8px;align-items:center;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.dtray-h .dtabs{flex:1}
.dtray-b>*{flex:none}
.dtray-b{overflow:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.dseg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dseg button{flex:1;border:0;background:var(--surface);color:var(--ink);padding:6px 6px;font:600 13px var(--ui);cursor:pointer;min-width:0}
.dseg button+button{border-left:1px solid var(--line)}
.dseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:9px 0;font:700 15px var(--ui);cursor:pointer}
.dbtn:hover{border-color:var(--accent);color:var(--accent)}
.dexpr{display:flex;gap:6px}
.dexpr input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 10px;font:600 16px var(--ui)}
.dhint{font-size:13px;color:var(--muted);min-height:16px}
.dlab{font:700 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dlog-h{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.dlog{display:flex;flex-direction:column;gap:7px}
.rcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);padding:7px 9px}
.rc-h{display:flex;gap:6px;align-items:center;margin-bottom:3px}
.rc-h b{flex:1;font:700 14px var(--ui);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-h button{border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:var(--r);padding:1px 7px;font:700 12px var(--ui);cursor:pointer}
.ri{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 0;border-top:1px dotted var(--line)}
.ri:first-of-type{border-top:0}
.ri-tag{font:600 12px var(--ui);color:var(--muted)}
.ri-tag em{font-style:normal;color:var(--accent)}
.ri-d{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-width:0}
.ri-d small{color:var(--muted);font-size:11px;margin-left:4px}
.df{font-style:normal;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font:700 12px var(--ui);color:var(--ink)}
.df.drop{opacity:.4;text-decoration:line-through}
.df.n20{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.df.n1{background:var(--blood-soft);border-color:var(--blood);color:var(--blood)}
.dplus{color:var(--muted);font-size:11px}
.ri-t{font:800 22px var(--display);color:var(--ink);min-width:34px;text-align:right}
.ri.crit .ri-t{color:var(--ok)} .ri.fumble .ri-t{color:var(--blood)}
.ri-flag{grid-column:1/-1;font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ri.crit .ri-flag{color:var(--ok)} .ri.fumble .ri-flag{color:var(--blood)}
.ri-sum .ri-t{color:var(--accent)}
#rollstack{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:26;display:flex;flex-direction:column;gap:8px;width:320px;max-width:calc(100vw - 32px);pointer-events:none}
.rstack-i{position:relative;pointer-events:auto;box-shadow:0 8px 22px rgba(0,0,0,.3);animation:rsin .2s ease-out}
.rstack-i .rcard{background:var(--paper);border:1px solid var(--gold);border-left:4px solid var(--accent);padding-right:30px}
.rs-x{position:absolute;top:5px;right:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.rstack-i.out{opacity:0;transform:translateY(8px);transition:.25s}
@keyframes rsin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dcalc-f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dcalc-f .field input{width:100%}
.dchips{display:flex;flex-wrap:wrap;gap:5px}
.chip.sm{font-size:12px;padding:3px 8px}
.dchk{display:flex;gap:7px;align-items:center;font:500 14px var(--ui)}
.dres{background:var(--block);border:1px solid var(--gold);padding:10px 12px}
.dres-big{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.dres-big b{font:800 34px var(--display);color:var(--accent)}
.dres-big span{font-size:14px;color:var(--muted)}
.dres-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.dres-grid div{display:flex;flex-direction:column}
.dres-grid b{font:700 17px var(--ui)}
.dres-grid span{font-size:12px;color:var(--muted)}
html.locked #diceFab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
html.locked #dicetray,html.locked #rollstack{bottom:calc(146px + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){
  #diceFab{bottom:calc(76px + env(safe-area-inset-bottom,0px));width:48px;height:48px;right:12px}
  #dicetray{left:0;right:0;width:auto;max-width:none;bottom:calc(62px + env(safe-area-inset-bottom,0px));max-height:72vh;border-left:0;border-right:0}
  #rollstack{right:12px;left:12px;width:auto;bottom:calc(132px + env(safe-area-inset-bottom,0px))}
  html.locked #diceFab{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
  html.locked #dicetray{bottom:calc(192px + env(safe-area-inset-bottom,0px));max-height:55vh}
  html.locked #rollstack{bottom:calc(192px + env(safe-area-inset-bottom,0px))}
}
/* ---- interactive sheet ---- */
.hpw{display:flex;flex-direction:column;align-items:center;gap:4px}
.hpw-top{display:flex;align-items:baseline;gap:4px}
.hpw-top b{font:600 22px var(--ui);color:var(--ink)}
.hpw-top span{color:var(--muted);font:500 14px var(--ui)}
.hpw-temp{font:600 12px var(--ui);font-style:normal;color:var(--ok)}
.hpw-bar{width:100%;max-width:160px;height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hpw-bar i{display:block;height:100%;background:var(--ok)}
.hpw-bar i.mid{background:var(--warn)} .hpw-bar i.low{background:var(--blood)}
.hpw-f{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.hpw-f input{width:74px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:3px 6px;font:500 14px var(--ui)}
.stats.hp-int{grid-template-columns:1fr 2fr 1fr;align-items:start}
.conds{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0 2px}
.conds-l{font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.cond{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:2px 9px;font:600 12px var(--ui);cursor:pointer}
.cond.on{background:var(--blood);border-color:var(--blood);color:#fff}
.vh-cond{display:inline-flex;gap:4px;flex-wrap:wrap}
.csheet{margin:4px 0 6px;border:1px solid var(--line);background:var(--block)}
.cs-tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--accent);scrollbar-width:none}
.cs-tabs button{flex:1 0 auto;border:0;background:none;padding:8px 12px;font:700 13px var(--sc);letter-spacing:.04em;color:var(--muted);cursor:pointer;white-space:nowrap}
.cs-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.cs-body{padding:12px}
.cs-ab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cs-abx{display:flex;flex-direction:column;gap:4px}
.cs-roll{cursor:pointer;font-family:var(--ui)}
.cs-abm{display:flex;flex-direction:column;align-items:center;border:2px solid var(--gold);background:var(--paper);border-radius:8px;padding:5px 2px 4px;color:var(--ink)}
.cs-abm span{font:800 11px var(--ui);letter-spacing:.08em;color:var(--accent)}
.cs-abm b{font:700 22px/1.1 var(--display)}
.cs-abm small{font:600 12px var(--ui);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 7px;background:var(--surface)}
.cs-abm:hover,.cs-save:hover,.cs-skb:hover,.cs-qb.cs-roll:hover{border-color:var(--accent);background:var(--accent-soft)}
.cs-save{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:3px 0;font:600 12px var(--ui);color:var(--muted)}
.cs-save.on{color:var(--accent);border-color:var(--accent);font-weight:800}
.cs-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin-top:8px}
.cs-pass span{font-size:10px;text-align:center;line-height:1.2}
.cs-qb{flex:1;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:4px 2px}
.cs-qb span{font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cs-qb b{font:700 18px var(--ui);color:var(--ink)}
.cs-h{margin:14px 0 6px;font:700 15px var(--display);color:var(--accent);border-bottom:1px solid var(--gold)}
.cs-sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px}
.cs-skb{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:4px 8px;color:var(--ink);text-align:left}
.cs-skb span{font:500 14px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-skb small{font:600 10px var(--ui);color:var(--muted)}
.cs-skb b{font:700 15px var(--ui);min-width:26px;text-align:right}
.cs-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.cs-skb.proficient .cs-dot{background:var(--accent);border-color:var(--accent)}
.cs-skb.expertise .cs-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--accent)}
.cs-skb.proficient b,.cs-skb.expertise b{color:var(--accent)}
.cs-txt{margin:2px 0 4px;font:400 14px/1.45 var(--ui);color:var(--ink)}
.cs-basics{font-size:15px}
.cs-feats{display:flex;flex-direction:column;gap:4px}
.cs-feat{border:1px solid var(--line);background:var(--paper);border-radius:var(--r)}
.cs-feat summary{cursor:pointer;padding:6px 10px;display:flex;gap:8px;align-items:baseline;list-style:none}
.cs-feat summary::-webkit-details-marker{display:none}
.cs-feat summary::before{content:"▸";color:var(--muted);font-size:12px}
.cs-feat[open] summary::before{content:"▾"}
.cs-feat summary b{font:700 14px var(--ui)}
.cs-feat summary small{font:500 12px var(--ui);color:var(--muted)}
.cs-feat .prose{padding:0 12px 8px 26px;font-size:15px}
.cs-spells{display:flex;flex-wrap:wrap;gap:5px}
.cs-spell{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:3px 10px;font:500 13px var(--ui)}
.cs-inv{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px}
.cs-inv li{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:4px 8px;font:500 14px var(--ui)}
.cs-inv li span{flex:1;min-width:0}
.cs-inv li.eq{border-left:3px solid var(--accent)}
.cs-inv em{font:600 11px var(--ui);font-style:normal;color:var(--accent)}
.cs-inv em.att{color:var(--ok)}
.cs-cur{margin-top:8px}
.cs-src{padding:6px 12px;border-top:1px solid var(--line);font:500 12px var(--ui);color:var(--muted)}
.csheet .prose > p:first-child::first-letter,.csheet .vprose > p:first-child::first-letter{float:none;font:inherit;color:inherit;margin:0;padding:0;line-height:inherit;initial-letter:normal}
.stats.two{grid-template-columns:repeat(2,1fr)}
.pc-pass{margin:6px 0 2px;text-align:center}.pc-pass-h{font:700 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}.pc-pass-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pc-pass-g div{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 0}.pc-pass-g b{font:600 17px var(--ui);color:var(--ink)}.pc-pass-g span{font:600 10px var(--ui);color:var(--muted);letter-spacing:.02em}
.linkish{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.ccond{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.ccond span{background:var(--blood);color:#fff;border-radius:10px;padding:0 7px;font:600 11px var(--ui)}
@media (max-width:640px){.cs-ab{grid-template-columns:repeat(3,minmax(0,1fr))}.stats.hp-int{grid-template-columns:1fr 1fr}.stats.hp-int .stat-hp{grid-column:1/-1;order:-1}}
/* ---- round 6 ---- */
#pindock{position:fixed;left:0;top:0;bottom:0;width:400px;z-index:16;background:var(--paper);border-right:3px solid var(--gold);box-shadow:4px 0 18px rgba(0,0,0,.18);display:flex;flex-direction:column}
#pindock[hidden]{display:none}
body.docked{padding-left:400px}

/* moons: phase 0 = new, 0.5 = full */
const MOON_ICONS=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"],MOON_NAMES=["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"];

/* ================= data layer: public + DM-only stores ================= */
const COLS=["characters","notes","quests","events","threads","plans","links","loot","maps","logs","encounters","tables","clocks","chats","meta","monsters","todos"];

/* In-memory stand-in with the same shape as the db capability, used when saving isn't available */
function merge(col){

  for(const [id,d] of r.pub)if(!r.dm.has(id))out.push({...d,id,dmOnly:false});
  for(const [id,d] of r.dm)out.push({...d,id,dmOnly:true});

}
function project(){

let renderQ=false;
/* don't redraw the page under someone who's typing in it; catch up once they leave the field */
function typingInApp(){const a=document.activeElement;return !!a&&document.getElementById("app").contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!/^(checkbox|radio|file|button|submit|hidden)$/.test(a.type)))}
let renderPending=false;

document.addEventListener("focusout",e=>{if(!renderPending||!(document.getElementById("app").contains(e.target)||document.getElementById("tablemode").contains(e.target)))return;setTimeout(()=>{if(renderPending&&!typingInApp()&&!typingInTable()){renderPending=false;render()}},300)});
/* opening: hold the page until every collection has arrived once, so it draws one time instead of flickering through partial states */
const BOOT={ready:false,need:Infinity,seen:new Set(),caps:false};
function bootSeen(k){if(BOOT.ready)return;BOOT.seen.add(k);bootCheck()}
function bootCheck(){if(!BOOT.ready&&BOOT.caps&&BOOT.seen.size>=BOOT.need){BOOT.ready=true;queueRender()}}

setTimeout(bootForce,6000);
function subscribe(){
  const dm=ROLE==="dm";
  BOOT.need=COLS.length*(dm?3:1)+1;
  COLS.forEach(col=>{
    const on=(kind,path)=>db.collection(path).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));RAW[col][kind]=m;merge(col);S.loaded=true;bootSeen(kind+"|"+col);queueRender()},()=>bootSeen(kind+"|"+col));

async function save(col,id,data,opts){
  if(col==="settings"){data.updated=Date.now();try{await db.collection("settings").doc(id).set(data);return true}catch(e){toast(saveErr(e));return false}}
  const {secret,dmOnly:want,id:_i,...pub}=data;pub.updated=(opts&&opts.keepDate&&pub.updated)||Date.now();
  const dmOnly=ALWAYS_DM.has(col)||RAW[col].dm.has(id)||!!want;

  const isNew=!r.pub.has(id)&&!r.dm.has(id);
  if(!isNew){const prevRec=ALL[col].find(x=>x.id===id);if(prevRec)recordHistory(col,id,prevRec)}
  if(!dmOnly&&!pub.revealed&&["characters","notes","quests","events","maps"].includes(col)&&(r.dm.has(id)||(isNew&&!(col==="notes"&&pub.category==="session")&&!(col==="characters"&&pub.kind==="pc"))))pub.revealed={session:rcSession(),at:Date.now()};

    if(dmOnly){await db.collection(SECRET+"/"+col).doc(id).set(pub);if(r.pub.has(id))await db.collection(col).doc(id).delete()}
    else{await db.collection(col).doc(id).set(pub);if(r.dm.has(id))await db.collection(SECRET+"/"+col).doc(id).delete()}

}
function saveErr(e){return e&&e.code==="quota_exceeded"?"Storage is full. Delete some old entries.":e&&e.code==="invalid_argument"?"You can view this campaign but not change it.":"Couldn't save. Try again."}

const TYPE_ALIAS={npc:"characters",npcs:"characters",character:"characters",pc:"characters",pcs:"characters",note:"notes",quest:"quests",thread:"threads",event:"events",monster:"monsters",place:"notes",places:"notes",location:"notes",locations:"notes",item:"notes",items:"notes",faction:"notes",factions:"notes"};

const imgUrl=id=>!id?"":String(id).startsWith("data:")?id:"/_blob/"+id;
const initials=n=>String(n||"?").split(/\s+/).filter(w=>/^[A-Z]/i.test(w)&&!/^(the|of)$/i.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";

/* ================= auto-links between entries ================= */
const STOP=new Set(["The","Oracle","Lord","Lady","Sir","Brother","Sister","Captain","Commander","General","King","Queen","Old","Young","Great","Shadow","Session","Church","Council","Hand","Band","Royal","Grove","Guild","Half","Deep","Heart","Sun","Red","Mortal","Divine"]);
let LX={ver:-1};
function linkIndex(){
  if(LX.ver===dataVer)return LX;
  const terms=[],seen=new Set(),byKey=new Map();
  const add=(name,type,id)=>{name=String(name||"").trim();if(name.length<3||seen.has(name))return;seen.add(name);terms.push({name,type,id});const k=type+":"+id;if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(name)};
  const firstWords=new Map();
  S.characters.forEach(c=>{const w=(c.name||"").replace(/^The\s+/,"").split(/\s+/)[0];if(w)firstWords.set(w,(firstWords.get(w)||0)+1)});
  S.characters.forEach(c=>{const n=c.name||"";add(n,"characters",c.id);const noThe=n.replace(/^The\s+/,"");if(noThe!==n)add(noThe,"characters",c.id);
    const parts=noThe.split(/\s+/);if(parts.length>1){const w=parts[0];if(w.length>=4&&/^[A-Z]/.test(w)&&!STOP.has(w)&&firstWords.get(w)===1)add(w,"characters",c.id)}});
  S.notes.filter(n=>n.category!=="session").forEach(n=>{add(n.title,"notes",n.id);const t=(n.title||"").replace(/^The\s+/,"");if(t!==n.title)add(t,"notes",n.id)});
  S.quests.forEach(q=>add(q.title,"quests",q.id));
  S.maps.forEach(m=>add(m.title,"maps",m.id));
  S.monsters.forEach(m=>add(m.name,"monsters",m.id));
  terms.sort((a,b)=>b.name.length-a.name.length);
  const map=new Map(terms.map(t=>[esc(t.name),t]));
  const re=terms.length?new RegExp("(?<![\\w&])("+terms.map(t=>esc(t.name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\w])","g"):null;

}
function linkify(html,selfKey){
  const {re,map}=linkIndex();if(!re)return html;

let GRAPH={key:""};
function graphLayout(nodes,edges,W,H){
  const key=nodes.map(n=>n.id).join(",")+"|"+edges.map(e=>e.a+e.b).join(",")+"|"+W;
  if(GRAPH.key===key)return GRAPH.pos;
  const N=nodes.length,pos=new Map(),idx=new Map(nodes.map((n,i)=>[n.id,i]));
  nodes.forEach((n,i)=>{const a=i/N*Math.PI*2;pos.set(n.id,{x:W/2+Math.cos(a)*W*.35,y:H/2+Math.sin(a)*H*.35,vx:0,vy:0})});
  const k=Math.sqrt(W*H/Math.max(N,1))*.75;
  for(let it=0;it<500;it++){
    const t=1-it/500;
    for(const a of nodes){const pa=pos.get(a.id);pa.vx=0;pa.vy=0}
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const pa=pos.get(nodes[i].id),pb=pos.get(nodes[j].id);let dx=pa.x-pb.x,dy=pa.y-pb.y,d=Math.hypot(dx,dy)||.01;const f=k*k/d;dx/=d;dy/=d;pa.vx+=dx*f;pa.vy+=dy*f;pb.vx-=dx*f;pb.vy-=dy*f}
    for(const e of edges){const pa=pos.get(e.a),pb=pos.get(e.b);if(!pa||!pb)continue;let dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy)||.01;const f=d*d/k;dx/=d;dy/=d;pa.vx+=dx*f;pa.vy+=dy*f;pb.vx-=dx*f;pb.vy-=dy*f}
    for(const n of nodes){const p=pos.get(n.id);p.vx+=(W/2-p.x)*.02*k/10;p.vy+=(H/2-p.y)*.02*k/10;const v=Math.hypot(p.vx,p.vy)||1,step=Math.min(v,k*t*.9);p.x+=p.vx/v*step;p.y+=p.vy/v*step;p.x=Math.max(50,Math.min(W-50,p.x));p.y=Math.max(40,Math.min(H-50,p.y))}
  }
  for(let pass=0;pass<80;pass++){let moved=false;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const pa=pos.get(nodes[i].id),pb=pos.get(nodes[j].id);let dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy)||.01;const min=Math.abs(dy)<40?130:92;
      if(d<min){const push=(min-d)/2;dx/=d;dy/=d;pa.x-=dx*push;pa.y-=dy*push;pb.x+=dx*push;pb.y+=dy*push;moved=true}}
    for(const n of nodes){const p=pos.get(n.id);p.x=Math.max(80,Math.min(W-80,p.x));p.y=Math.max(40,Math.min(H-50,p.y))}
    if(!moved)break}
  GRAPH={key,pos};void idx;return pos;
}
function relGraph(){
  const ids=new Set();S.links.forEach(l=>{if(rec("characters",l.a)&&rec("characters",l.b)){ids.add(l.a);ids.add(l.b)}});
  const nodes=[...ids].map(id=>rec("characters",id)).sort((a,b)=>a.name.localeCompare(b.name));
  const edges=S.links.filter(l=>ids.has(l.a)&&ids.has(l.b));
  if(!nodes.length)return `<div class="empty">No relationships yet. ${isDM()?"Use <b>Add relationship</b> to connect two characters.":""}</div>`;
  const W=1000,H=Math.max(560,Math.min(900,nodes.length*30)),pos=graphLayout(nodes,edges,W,H);
  const col=k=>`var(--rel-${REL_TONE[k]||"muted"})`;
  let svg=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Relationship map"><defs>${Object.keys(REL).map(k=>`<marker id="ar-${k}" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col(k)}"/></marker>`).join("")}<clipPath id="cc"><circle r="22" cx="0" cy="0"/></clipPath></defs>`;
  for(const e of edges){const a=pos.get(e.a),b=pos.get(e.b);const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    const x1=a.x+ux*26,y1=a.y+uy*26,x2=b.x-ux*28,y2=b.y-uy*28;const dirn=e.kind==="serves"||e.kind==="mentor";
    svg+=`<g class="edge" data-act="open" data-type="links" data-id="${e.id}"><title>${esc(rec("characters",e.a).name)} — ${esc(REL[e.kind]||"Linked")}${e.label?": "+esc(e.label):""} — ${esc(rec("characters",e.b).name)}</title><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col(e.kind)}" stroke-width="${e.kind==="enemy"?2.6:2}" ${e.kind==="enemy"||e.kind==="rival"?'stroke-dasharray="6 4"':""} ${dirn?`marker-end="url(#ar-${e.kind})"`:""}/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="14"/></g>`}
  for(const n of nodes){const p=pos.get(n.id);const pc=n.kind==="pc";
    svg+=`<g class="node" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})" data-act="open" data-type="characters" data-id="${n.id}" tabindex="0"><title>${esc(n.name)}</title><circle r="24" fill="var(--block)" stroke="${pc?"var(--bar)":"var(--accent)"}" stroke-width="${pc?3.5:2}"/>${n.img?`<image href="${esc(imgUrl(n.img))}" x="-22" y="-22" width="44" height="44" clip-path="url(#cc)" preserveAspectRatio="xMidYMid slice"/>`:`<text y="6" text-anchor="middle" class="ni">${esc(initials(n.name))}</text>`}<text y="42" text-anchor="middle" class="nl">${esc(n.name.length>22?n.name.slice(0,21)+"…":n.name)}</text></g>`}
  svg+=`</svg>`;
  return `<div class="graph-wrap">${svg}</div><div class="legend">${Object.keys(REL).filter(k=>edges.some(e=>e.kind===k)).map(k=>`<span><i style="background:${col(k)}"></i>${REL[k]}</span>`).join("")}<span><i class="ring pc"></i>Party member</span></div>`;
}
