const CRS=["0","1/8","1/4","1/2",...Array.from({length:30},(_,i)=>String(i+1))];
const CR_XP={"0":10,"1/8":25,"1/4":50,"1/2":100,"1":200,"2":450,"3":700,"4":1100,"5":1800,"6":2300,"7":2900,"8":3900,"9":5000,"10":5900,"11":7200,"12":8400,"13":10000,"14":11500,"15":13000,"16":15000,"17":18000,"18":20000,"19":22000,"20":25000,"21":33000,"22":41000,"23":50000,"24":62000,"25":75000,"26":90000,"27":105000,"28":120000,"29":135000,"30":155000};
/* 2024 DMG: XP budget per character [Low, Moderate, High] */
const BUDGET=[null,[50,75,100],[100,150,200],[150,225,400],[250,375,500],[500,750,1100],[600,1000,1400],[750,1300,1700],[1000,1700,2100],[1300,2000,2600],[1600,2300,3100],[1900,2900,4100],[2200,3700,4700],[2600,4200,5400],[2900,4900,6200],[3300,5400,7800],[3800,6100,9800],[4500,7200,11700],[5000,8700,14200],[5500,10700,17200],[6400,13200,22000]];
const fmtN=n=>Number(n||0).toLocaleString("en-US");
function partyLevels(){const pcs=S.characters.filter(x=>x.kind==="pc"&&x.status!=="dead");return pcs.map(p=>Math.max(1,Math.min(20,num(p.level)||6)))}
function encMath(e){
  const lv=(e.party&&e.party.length?e.party:partyLevels());const levels=lv.length?lv:[6,6,6,6];
  const b=[0,1,2].map(k=>levels.reduce((a,l)=>a+BUDGET[Math.max(1,Math.min(20,l))][k],0));
  const xp=(e.monsters||[]).reduce((a,m)=>a+(CR_XP[m.cr]||0)*(num(m.count)||0),0);
  const diff=xp===0?"none":xp<b[0]?"trivial":xp<b[1]?"low":xp<b[2]?"moderate":xp<=b[2]*1.15?"high":"deadly";
  return {xp,b,diff,size:levels.length,avg:Math.round(levels.reduce((a,l)=>a+l,0)/levels.length*10)/10};
}
const DIFF={none:["No monsters yet","muted"],trivial:["Below Low","muted"],low:["Low","ok"],moderate:["Moderate","warn"],high:["High","bad"],deadly:["Above High","bad"]};
const encLine=e=>{const m=encMath(e);return `**${e.title||"Encounter"}** (${DIFF[m.diff][0]}, ${fmtN(m.xp)} XP): ${(e.monsters||[]).filter(x=>x.name).map(x=>`${x.count||1}× ${x.name}`).join(", ")}`};
let ENC=null;
function openEncounter(id){
  const r=id?rec("encounters",id):null;
  ENC=r?JSON.parse(JSON.stringify({id:r.id,title:r.title,monsters:r.monsters||[],notes:r.notes||"",partyOverride:r.partyOverride||null,results:r.results||[]})):{id:null,results:[],title:"",monsters:[{name:"",cr:"1",count:1}],notes:"",partyOverride:null};
  encSheet(true);
}
function encParty(){if(ENC.partyOverride){const {size,level}=ENC.partyOverride;return Array.from({length:Math.max(1,num(size)||1)},()=>Math.max(1,Math.min(20,num(level)||1)))}return partyLevels()}
function encSheet(focus){
  const known=[...new Map([...S.monsters.map(m=>({name:m.name,cr:m.cr||"1"})),...S.encounters.flatMap(e=>e.monsters||[])].filter(m=>m.name).map(m=>[m.name.toLowerCase(),m])).values()].slice(0,20);
  const pl=encParty(),ov=ENC.partyOverride;
  showSheet(`<div class="sheet wide enc" role="dialog" aria-label="Encounter builder"><h2>${ENC.id?"Edit encounter":"New encounter"}</h2>
    <div class="fields"><label class="field"><span class="label">Encounter name</span><input id="enc-title" value="${esc(ENC.title)}" placeholder="e.g. Ogre Chieftain, stage 2"></label></div>
    <div class="enc-party"><span class="label">Party</span>
      ${ov?`<label>Players <input id="enc-ps" inputmode="numeric" value="${esc(ov.size)}"></label><label>Level <input id="enc-pl" inputmode="numeric" value="${esc(ov.level)}"></label><button type="button" class="btn sm" data-act="encPartyAuto">Use the party</button>`
        :`<span>${pl.length} characters · levels ${esc([...new Set(pl)].join(", ")||"–")}</span><button type="button" class="btn sm" data-act="encPartyEdit">Change</button>`}</div>
    <div class="enc-rows" id="enc-rows">${ENC.monsters.map((m,i)=>`<div class="enc-row"><input data-enc="${i}" data-f="name" id="enc-n-${i}" value="${esc(m.name)}" placeholder="Monster" aria-label="Monster name"><label class="enc-cr">CR <select data-enc="${i}" data-f="cr" aria-label="Challenge rating">${CRS.map(c=>`<option ${String(m.cr)===c?"selected":""}>${c}</option>`).join("")}</select></label><label class="enc-ct">× <input data-enc="${i}" data-f="count" id="enc-c-${i}" inputmode="numeric" value="${esc(m.count)}" aria-label="How many"></label><span class="enc-xp mono" id="enc-x-${i}">${fmtN((CR_XP[m.cr]||0)*(num(m.count)||0))} XP</span><button type="button" class="btn icon" data-act="encDel" data-i="${i}" aria-label="Remove">×</button></div>`).join("")}</div>
    <div class="tool-acts"><button type="button" class="btn sm" data-act="encAdd">Add monster</button>${known.map(m=>`<button type="button" class="chip" data-act="encQuick" data-name="${esc(m.name)}" data-cr="${esc(m.cr)}">+ ${esc(m.name)} <small>CR ${esc(m.cr)}</small></button>`).join("")}</div>
    <div id="enc-sum">${encSummary()}</div>
    <div class="enc-res"><span class="label">Results</span>${(ENC.results||[]).length?`<ul class="res-list">${ENC.results.map((r,i)=>`<li><b>Session ${esc(r.session||"?")}</b>${r.rounds?` · ${esc(r.rounds)} rounds`:""} · ${esc(r.outcome||"")}${r.loot?` · <i>Loot:</i> ${esc(r.loot)}`:""} <button type="button" class="btn icon" data-act="encResDel" data-i="${i}" aria-label="Remove result">×</button></li>`).join("")}</ul>`:`<p class="vempty">Not fought yet.</p>`}
      <div class="res-add"><input id="res-s" inputmode="numeric" placeholder="Session" value="${esc(rcSession())}" aria-label="Session"><input id="res-r" inputmode="numeric" placeholder="Rounds" aria-label="Rounds"><input id="res-o" placeholder="How it went, near-deaths" aria-label="Outcome"><input id="res-l" placeholder="Loot" aria-label="Loot"><button type="button" class="btn sm" data-act="encResAdd">Log result</button></div></div>
    <div class="fields"><div class="field"><span class="label">Tactics & notes</span><textarea id="enc-notes" rows="4" class="plain-ta" placeholder="Terrain, phases, what the monsters want">${esc(ENC.notes)}</textarea></div></div>
    <p class="hint-p">Difficulty uses the 2024 Dungeon Master's Guide XP budgets. Treat it as a guide: action economy, terrain and phases matter too.</p>
    <div class="foot"><span class="grow">${ENC.id?`<button type="button" class="btn danger" data-act="del" data-type="encounters" data-id="${ENC.id}">Delete</button>`:""}</span><button type="button" class="btn" data-act="close">Close</button><button type="button" class="btn" data-act="encToPlan">Add to session plan</button><button type="button" class="btn primary" data-act="encSave">Save encounter</button></div></div>`,!focus);
}
function encSummary(){
  const m=encMath({monsters:ENC.monsters,party:encParty()});const max=Math.max(m.b[2]*1.3,m.xp*1.05,1);
  const pct=v=>Math.min(100,v/max*100).toFixed(1);
  return `<div class="enc-sum"><div class="enc-head"><span class="pill ${DIFF[m.diff][1]}">${DIFF[m.diff][0]}</span><b class="mono">${fmtN(m.xp)} XP</b><span class="muted">for ${m.size} characters</span></div>
    <div class="enc-bar"><i style="width:${pct(m.xp)}%" class="d-${m.diff}"></i>${m.b.map((v,k)=>`<span class="tick" style="left:${pct(v)}%"><em>${["Low","Moderate","High"][k]}<br>${fmtN(v)}</em></span>`).join("")}</div></div>`;
}
async function encSave(addToPlan){
  ENC.title=(document.getElementById("enc-title")?.value||"").trim()||"Untitled encounter";ENC.notes=document.getElementById("enc-notes")?.value||"";
  const id=ENC.id||uid();const data={title:ENC.title,monsters:ENC.monsters.filter(m=>m.name||num(m.count)),notes:ENC.notes,partyOverride:ENC.partyOverride||null,results:ENC.results||[]};
  await save("encounters",id,data);ENC.id=id;
  if(addToPlan){
    const plans=S.plans.slice().sort((a,b)=>(b.session||0)-(a.session||0));const cur=plans.find(p=>p.id===U.planSel)||thNext();
    const line="- "+encLine({...data});
    if(cur){const{id:pid,...keep}=cur;await save("plans",pid,{...keep,encounters:((keep.encounters||"").trim()?keep.encounters.trim()+"\n":"")+line});toast(`Added to ${cur.title||"the session plan"}`)}
    else{const n=nextSession(),pid=uid();await save("plans",pid,{title:`Session ${n}`,session:n,status:"planned",encounters:line});U.planSel=pid;toast(`Started a plan for session ${n}`)}
  }else toast("Encounter saved");
  closeSheet();
}
function vEncounters(){
  const list=S.encounters.slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
  return `<div class="sub-bar"><p class="tool-d">Build fights against your party's 2024 XP budget, then drop them into a session plan.</p><button class="btn primary" data-act="encNew">New encounter</button></div>
  ${list.length?`<div class="encs">${list.map(e=>{const m=encMath(e);return `<button class="enc-card" data-act="encOpen" data-id="${e.id}"><span class="enc-ct-h"><b>${esc(e.title||"Encounter")}</b><span class="pill ${DIFF[m.diff][1]}">${DIFF[m.diff][0]}</span></span><small class="mono">${fmtN(m.xp)} XP</small><span class="enc-ms">${esc((e.monsters||[]).filter(x=>x.name).map(x=>`${x.count||1}× ${x.name} (CR ${x.cr})`).join(", "))}</span></button>`}).join("")}</div>`
  :`<div class="empty">No encounters yet. Try the Ogre Chieftain fight: add him and the six goblins, and the builder shows how hard each stage is for your party.</div>`}`;
}

/* ---------- random tables ---------- */
let ROLLS={};
const tableEntries=t=>String(t.entries||"").split("\n").map(x=>x.trim()).filter(Boolean);
function rollTable(id){const t=rec("tables",id);if(!t)return null;const es=tableEntries(t);if(!es.length){toast("This table has no entries yet.");return null}
  const i=Math.floor(Math.random()*es.length);(ROLLS[id]=ROLLS[id]||[]).unshift({i,n:i+1,text:es[i]});ROLLS[id]=ROLLS[id].slice(0,6);return ROLLS[id][0]}
function vTables(){
  const list=S.tables.slice().sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  const cur=list.find(t=>t.id===U.tableSel)||list[0];
  let main="";
  if(cur){const es=tableEntries(cur),last=(ROLLS[cur.id]||[])[0];
    main=`<article class="rt"><div class="plan-h"><div><span class="label">d${es.length||"?"}</span><h3>${esc(cur.title||"Table")}</h3>${cur.desc?`<p class="tool-d">${esc(cur.desc)}</p>`:""}</div><div class="plan-acts"><button class="btn sm" data-act="edit" data-type="tables" data-id="${cur.id}">Edit</button></div></div>
      <div class="roll-zone"><button class="btn primary roll-btn" data-act="tableRoll" data-id="${cur.id}" ${es.length?"":"disabled"}>Roll d${es.length||"?"}</button>${last?`<div class="roll-out"><span class="roll-n mono">${last.n}</span><span>${linkify(esc(last.text),"")}</span></div>`:`<p class="vempty">Roll to pick an entry.</p>`}</div>
      ${(ROLLS[cur.id]||[]).length>1?`<p class="tool-d">Earlier: ${(ROLLS[cur.id]||[]).slice(1).map(r=>`${r.n}`).join(", ")}</p>`:""}
      ${es.length?`<ol class="rt-list">${es.map((x,i)=>`<li class="${last&&last.i===i?"hit":""}">${linkify(esc(x),"")}</li>`).join("")}</ol>`:`<p class="vempty">No entries yet. Use Edit to type them, one per line.</p>`}
    </article>`}
  return `<div class="sub-bar"><p class="tool-d">Your own roll tables: rumors, encounters, NPC quirks, loot. One tap rolls.</p><button class="btn primary" data-act="new" data-type="tables">New table</button></div>
  ${list.length?`<div class="rt-wrap"><div class="nlist rt-nav">${list.map(t=>`<button class="nitem" data-act="tablePick" data-id="${t.id}" aria-current="${cur&&t.id===cur.id}"><b>${esc(t.title||"Table")}</b><small>d${tableEntries(t).length}</small></button>`).join("")}</div>${main}</div>`
  :`<div class="empty">No tables yet. Start one like "Tavern rumors" or "Forest encounters".</div>`}`;
}
/* ---------- spotlight ---------- */
function spotSessions(){
  const set=new Set([...S.notes.filter(n=>n.category==="session").map(n=>n.session||0),...S.logs.map(l=>l.session||0),rcSession()].filter(Boolean));
  return [...set].sort((a,b)=>a-b).slice(-8);
}
function vSpotlight(){
  const pcs=S.characters.filter(x=>x.kind==="pc").sort((a,b)=>a.name.localeCompare(b.name));
  const ss=spotSessions(),last=ss[ss.length-1]||0;
  const has=(pc,s)=>(logFor(s)?.spotlight||[]).includes(pc);
  const since=pc=>{const lit=ss.filter(s=>has(pc,s));if(!lit.length)return null;return last-lit[lit.length-1]};
  if(!pcs.length)return `<div class="empty">Add party members to track the spotlight.</div>`;
  return `<div class="sub-bar"><p class="tool-d">After each session, tick who had a big moment. Anyone without one for two sessions or more is flagged.</p></div>
  <div class="spot-wrap"><table class="spot"><thead><tr><th>Character</th>${ss.map(s=>`<th class="mono">S${s}</th>`).join("")}<th>Last moment</th></tr></thead><tbody>
  ${pcs.map(p=>{const d=since(p.id),warn=d===null||d>=2;return `<tr><td><span class="namecell">${avatar(p,26)}<b>${esc(p.name)}</b></span></td>${ss.map(s=>`<td class="c"><input type="checkbox" data-spot="${p.id}|${s}" ${has(p.id,s)?"checked":""} aria-label="${esc(p.name)} had the spotlight in session ${s}"></td>`).join("")}<td>${d===null?`<span class="pill warn">Not yet</span>`:d===0?`<span class="pill ok">This session</span>`:`<span class="pill ${warn?"warn":""}">${d} session${d>1?"s":""} ago</span>`}</td></tr>`}).join("")}
  </tbody></table></div>`;
}
async function toggleSpot(pc,s,on){
  const l=logFor(s)||{};const {id:_i,dmOnly:_d,secret:_s,...keep}=l;const set=new Set(keep.spotlight||[]);on?set.add(pc):set.delete(pc);
  await save("logs","s"+s,{...keep,session:s,notes:keep.notes||"",open:keep.open||"",spotlight:[...set]});
}

/* ---------- personal arcs ---------- */
const beatList=q=>String(q.beats||"").split("\n").map(x=>x.trim()).filter(Boolean).map(x=>({done:/^\[x\]\s*/i.test(x),text:x.replace(/^\[[x ]\]\s*/i,"")}));
function arcsBlock(){
  const pcs=S.characters.filter(x=>x.kind==="pc").sort((a,b)=>a.name.localeCompare(b.name));
  const arcs=pcs.map(p=>({p,qs:S.quests.filter(q=>q.pc===p.id)}));
  if(!arcs.some(a=>a.qs.length)&&!isDM())return "";
  return `<h3 class="section-h">Personal arcs</h3><div class="arcs">${arcs.map(({p,qs})=>{
    if(!qs.length)return isDM()?`<div class="arc empty-arc"><div class="arc-h">${avatar(p,34)}<b>${esc(p.name)}</b></div><p class="vempty">No arc linked.</p><button class="btn sm" data-act="arcNew" data-id="${p.id}">Link a quest</button></div>`:"";
    return qs.map(q=>{const bs=beatList(q),done=bs.filter(b=>b.done).length,next=bs.find(b=>!b.done);
      return `<div class="arc"><div class="arc-h">${avatar(p,34)}<div><b>${esc(p.name)}</b><button class="arc-q" data-act="view" data-type="quests" data-id="${q.id}">${esc(q.title)}</button></div></div>
        ${bs.length?`<div class="arc-bar" title="${done} of ${bs.length} beats"><i style="width:${(done/bs.length*100).toFixed(0)}%"></i></div><small class="muted">${done} of ${bs.length} revealed${next?` · next: ${esc(next.text)}`:" · complete"}</small>
        <ul class="beats">${bs.map((b,i)=>`<li class="${b.done?"done":""}"><input type="checkbox" class="dm-only" data-beat="${q.id}|${i}" ${b.done?"checked":""} aria-label="Revealed"><span>${linkify(esc(b.text),"quests:"+q.id)}</span></li>`).join("")}</ul>`
        :`<p class="vempty">No story beats yet.${isDM()?" Edit the quest to list them.":""}</p>`}</div>`}).join("")}).join("")}</div>`;
}
/* table mode: active quests at a glance, with the next story beat to tick off */
function tmQuests(){
  const act=S.quests.filter(q=>q.status==="active").sort((a,b)=>(!!a.pc-!!b.pc)||(a.title||"").localeCompare(b.title||""));
  const rum=S.quests.filter(q=>(q.status||"rumor")==="rumor").length;
  if(!act.length&&!rum)return "";
  return `<section class="tm-s"><h3>Quests</h3>${act.length?`<div class="tm-qs">${act.map(q=>{const bs=beatList(q),done=bs.filter(b=>b.done).length,ni=bs.findIndex(b=>!b.done),pc=q.pc&&rec("characters",q.pc);
    return `<div class="tm-q"><button class="tm-qt" data-act="view" data-type="quests" data-id="${q.id}">${esc(q.title||"Untitled quest")}</button>${pc?`<span class="pill acc">${esc(pc.name)}'s arc</span>`:""}
      ${q.giver||q.location?`<small class="muted">${esc([q.giver&&"From "+q.giver,q.location].filter(Boolean).join(" · "))}</small>`:""}
      ${bs.length?(ni>=0?`<label class="tm-beat"><input type="checkbox" data-beat="${q.id}|${ni}" aria-label="Mark revealed"><span><b>Next:</b> ${linkify(esc(bs[ni].text),"quests:"+q.id)}</span></label><small class="muted">${done} of ${bs.length} beats revealed</small>`:`<small class="muted">All ${bs.length} beats revealed</small>`):""}</div>`}).join("")}</div>`:`<p class="vempty">No active quests.</p>`}
    ${rum?`<small class="muted">${rum} rumor${rum===1?"":"s"} on the Quests tab</small>`:""}</section>`}
async function toggleBeat(qid,i,on){
  const q=rec("quests",qid);if(!q)return;const bs=beatList(q);if(!bs[i])return;bs[i].done=on;
  const{id,...keep}=q;await save("quests",id,{...keep,beats:bs.map(b=>(b.done?"[x] ":"")+b.text).join("\n")});
}

/* ---------- reveal log ---------- */
function whatsNew(){
  const items=[];["characters","notes","quests","events","maps","loot"].forEach(col=>S[col].forEach(x=>{if(!x.dmOnly&&x.revealed&&x.revealed.session)items.push({col,x,s:x.revealed.session})}));
  if(!items.length)return "";
  const sessions=[...new Set(items.map(i=>i.s))].sort((a,b)=>b-a).slice(0,2);
  return `<section class="whatsnew"><h3>What's new</h3>${sessions.map(s=>`<div class="wn-row"><span class="label">Session ${s}</span><span class="wn-items">${items.filter(i=>i.s===s).map(({col,x})=>`<button class="chip" data-act="open" data-type="${col}" data-id="${x.id}">${col==="characters"?avatar(x,20):""}${esc(titleOf(col,x)||"Untitled")}</button>`).join("")}</span></div>`).join("")}</section>`;
}

/* ---------- schedule ---------- */
function nextGame(){
  const sc=S.settings.schedule;if(!sc||!sc.next)return null;
  let d=new Date(sc.next);if(isNaN(d))return null;
  const step=sc.repeat==="weekly"?7:sc.repeat==="biweekly"?14:0,now=Date.now();
  if(step)while(d.getTime()+4*3600e3<now)d=new Date(d.getTime()+step*864e5);
  return d;
}
function nextGameText(){
  const d=nextGame();if(!d)return "";
  const now=new Date(),days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  if(d.getTime()+4*3600e3<now.getTime())return "";
  const when=days===0?"tonight":days===1?"tomorrow":days<0?"":`in ${days} days`;
  return `Next game ${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}, ${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}${when?` · ${when}`:""}`;
}

/* ---------- timeline ---------- */
function realDatesText(ds){if(!Array.isArray(ds)||!ds.length)return "";const d=ds.map(x=>new Date(x+"T12:00"));const sameYear=d.every(x=>x.getFullYear()===d[0].getFullYear());return d.map(x=>x.toLocaleDateString("en-US",{month:"short",day:"numeric"})).join(", ")+(sameYear?", "+d[0].getFullYear():"")}
function vTimeline(c){
  const tIdx=toIdx(c,c.today),items=[];
  S.events.forEach(e=>items.push({i:toIdx(c,{y:e.y??c.today.y,m:e.m,d:e.d}),col:"events",x:e,label:e.title,kind:(EVKIND[e.kind]||"Event")+(e.realDates&&e.realDates.length?" · played "+realDatesText(e.realDates):"")}));
  S.notes.filter(n=>n.ig&&n.ig.m!=null).forEach(n=>items.push({i:toIdx(c,n.ig),col:"notes",x:n,label:n.title,kind:NOTE_CATS[n.category]||"Note",real:n.played}));
  items.sort((a,b)=>a.i-b.i||((a.x.session||0)-(b.x.session||0)));
  if(!items.length)return `<div class="empty">Nothing on the timeline yet. Events and notes with an in-game date show up here.</div>`;
  let h="",prev=null,todayDone=false;
  const todayMark=()=>`<div class="tl-today"><span>Today · ${esc(fmtDate(c,c.today))}</span></div>`;
  for(const it of items){
    if(!todayDone&&it.i>tIdx){if(prev!==null&&tIdx-prev>0)h+=`<div class="tl-gap">${tIdx-prev} day${tIdx-prev>1?"s":""} later</div>`;h+=todayMark();todayDone=true;prev=tIdx}
    if(prev!==null&&it.i!==prev){const g=it.i-prev;h+=`<div class="tl-gap">${g>0?`${fmtN(g)} day${g>1?"s":""} later`:""}</div>`}
    if(it.i!==prev)h+=`<div class="tl-date">${esc(fmtDate(c,fromIdx(c,it.i)))}</div>`;
    h+=`<button class="tl-item k-${it.col}" data-act="open" data-type="${it.col}" data-id="${it.x.id}"><span class="tl-dot"></span><span><b>${esc(it.label||"Untitled")}</b> ${dmBadge(it.x)}<small>${esc(it.kind)}${it.real?" · played "+esc(new Date(it.real+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})):""}</small></span></button>`;
    prev=it.i;
  }
  if(!todayDone){if(prev!==null&&tIdx>prev)h+=`<div class="tl-gap">${tIdx-prev} day${tIdx-prev>1?"s":""} later</div>`;h+=todayMark()}
  return `<div class="timeline">${h}</div>`;
}

/* ---------- table mode ---------- */

function roll20Html(title,body){

async function copyRoll20(title,body){
  const html=roll20Html(title,body),txt=(title?title+"\n\n":"")+plain(body||"");
  try{
    if(window.ClipboardItem&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})])}
    else await navigator.clipboard.writeText(txt);

const HARPTOS_FEASTS=[[0,"Midwinter","The festival day between Hammer and Alturiak. Nobles renew alliances; commoners feast to break the winter."],
  [3,"Greengrass","The festival day between Tarsakh and Mirtul, celebrating spring: flowers, dancing and the first fresh food."],
  [6,"Midsummer","The festival day between Flamerule and Eleasis: music, feasting and romance. Every fourth year Shieldmeet follows it."],
  [8,"Highharvestide","The festival day between Eleint and Marpenoth: harvest feasts, and a common day to begin journeys."],
  [10,"The Feast of the Moon","The festival day between Uktar and Nightal, honoring ancestors and the dead."]];
async function addFestivals(){
  const c=cal();let n=0;
  for(const [m,title,desc] of HARPTOS_FEASTS){
    if(m>=c.months.length)continue;
    if(S.events.some(e=>e.title===title))continue;
    const fm=c.months.findIndex(mo=>mo.festival&&mo.name.toLowerCase()===title.toLowerCase());
    if(fm>=0){await save("events",uid(),{title,kind:"festival",yearly:true,y:c.today.y,m:fm,d:1,notes:desc,dmOnly:false});n++;continue}
    await save("events",uid(),{title,kind:"festival",yearly:true,y:c.today.y,m,d:c.months[m].days,notes:desc+"\n\nPlaced on the last day of "+c.months[m].name+" because this calendar has no festival days between months.",dmOnly:false});n++;
  }
  toast(n?`Added ${n} festivals`:"The festivals are already on the calendar");
}

/* ---------- faction clocks ---------- */
function clockSvg(seg,filled,size){
  seg=Math.max(2,Math.min(12,num(seg)||4));filled=Math.max(0,Math.min(seg,num(filled)||0));const r=size/2-3,cx=size/2,cy=size/2;let p="";
  for(let i=0;i<seg;i++){const a0=-Math.PI/2+i*2*Math.PI/seg,a1=a0+2*Math.PI/seg;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    p+=`<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${i<filled?"var(--accent)":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.5"/>`}
  return `<svg class="clock-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${filled} of ${seg}">${p}</svg>`;
}
function clockCard(k,compact){
  const seg=num(k.segments)||6,f=Math.min(seg,num(k.filled)||0),full=f>=seg;
  return `<div class="clk ${full?"full":""} ${compact?"compact":""}">${clockSvg(seg,f,compact?44:72)}<div class="clk-b"><b>${esc(k.title||"Clock")}</b><small>${esc(k.faction||"")}${k.faction?" · ":""}${f} of ${seg}${full?` · <span class="t-bad">triggered</span>`:""} ${dmBadge(k)}</small>
    ${!compact&&k.trigger?`<span class="clk-t"><b>When it fills:</b> ${linkify(esc(k.trigger),"")}</span>`:""}
    <span class="clk-acts dm-only"><button class="btn icon" data-act="clkTick" data-id="${k.id}" data-n="-1" aria-label="Remove a segment">−</button><button class="btn icon" data-act="clkTick" data-id="${k.id}" data-n="1" aria-label="Fill a segment">+</button>${compact?"":`<button class="btn sm" data-act="edit" data-type="clocks" data-id="${k.id}">Edit</button>`}</span></div></div>`;
}
async function tickClock(id,n){const k=rec("clocks",id);if(!k)return;const seg=num(k.segments)||6;const f=Math.max(0,Math.min(seg,(num(k.filled)||0)+n));if(f===(num(k.filled)||0))return;const{id:_,...keep}=k;await save("clocks",id,{...keep,filled:f});if(f>=seg&&n>0)toast(`“${k.title}” has filled`)}
function vClocks(){
  const list=S.clocks.slice().sort((a,b)=>((num(b.filled)||0)/(num(b.segments)||1))-((num(a.filled)||0)/(num(a.segments)||1)));
  return `<div class="sub-bar"><p class="tool-d">Progress clocks for what's happening offscreen. Fill segments as time passes or the party ignores a threat; when a clock fills, its consequence happens.</p><div class="tool-acts"><button class="btn primary" data-act="new" data-type="clocks">New clock</button></div></div>
  ${list.length?`<div class="clks">${list.map(k=>clockCard(k)).join("")}</div>`:`<div class="empty">No clocks yet. Try "Rival gang finds the silver amulet" with 6 segments.</div>`}`;
}

/* ---------- shops ---------- */
const COIN_CP={pp:1000,gp:100,ep:50,sp:10,cp:1};
function parsePrice(s){const m=String(s||"").match(/([\d,.]+)\s*(pp|gp|ep|sp|cp)/i);if(!m)return null;return {n:parseFloat(m[1].replace(/,/g,"")),coin:m[2].toLowerCase(),cp:Math.round(parseFloat(m[1].replace(/,/g,""))*COIN_CP[m[2].toLowerCase()])}}
function stockRows(n){return String(n.stock||"").split("\n").map(l=>l.trim()).filter(Boolean).map((l,i)=>{const [name,price,qty]=l.split("|").map(x=>(x||"").trim());return {i,name:name||l,price:price||"",qty:qty===""||qty==null?null:num(qty)}})}
function stockBlock(n){
  const rows=stockRows(n);if(!rows.length&&!isDM())return "";
  return `<div class="stock"><div class="loot-head"><b>For sale</b><span class="dm-only"></span></div>
    ${rows.length?`<table class="stock-t"><thead><tr><th>Item</th><th>Price</th><th>Stock</th><th class="dm-only"></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${linkify(esc(r.name),"")}</td><td class="mono">${esc(r.price)}</td><td class="mono">${r.qty==null?"∞":r.qty}</td><td class="dm-only">${r.qty===0?`<span class="muted">Sold out</span>`:`<button class="btn sm" data-act="stockSell" data-id="${n.id}" data-i="${r.i}">Sell to party</button>`}</td></tr>`).join("")}</tbody></table>`:`<p class="vempty">No stock yet. Edit the note to add items, one per line as <b>Item | price | quantity</b>.</p>`}</div>`;
}
async function stockSell(id,i){
  const n=rec("notes",id);if(!n)return;const rows=stockRows(n),r=rows.find(x=>x.i===i);if(!r)return;
  const pr=parsePrice(r.price);const purse={pp:0,gp:0,ep:0,sp:0,cp:0,...(S.settings.purse||{})};let changed=false;
  if(pr){
    const total=Object.entries(COIN_CP).reduce((a,[k,v])=>a+(num(purse[k])||0)*v,0);
    if(total<pr.cp){toast(`The party can't afford that (${r.price}).`);return}
    if((num(purse[pr.coin])||0)>=pr.n&&Number.isInteger(pr.n))purse[pr.coin]=(num(purse[pr.coin])||0)-pr.n;
    else{let left=total-pr.cp;purse.pp=0;purse.ep=0;purse.gp=Math.floor(left/100);left-=purse.gp*100;purse.sp=Math.floor(left/10);purse.cp=left-purse.sp*10;changed=true}
    await save("settings","purse",purse);
  }
  await save("loot",uid(),{name:r.name,holder:"party",qty:1,value:r.price,notes:`Bought at ${n.title}.`,dmOnly:false});
  if(r.qty!=null){const lines=String(n.stock).split("\n").map(l=>l.trim()).filter(Boolean);lines[i]=[r.name,r.price,String(Math.max(0,r.qty-1))].join(" | ");const{id:_,...keep}=n;await save("notes",id,{...keep,stock:lines.join("\n")})}
  toast(`Sold ${r.name}${pr?` for ${r.price}`:""}${changed?" (coins converted to make change)":""}. Added to Party Treasury.`);
}

/* ---------- small db helpers that work with the real store and the stand-in ---------- */
async function listDocs(path,field,value){

/* ---------- trash and version history (stored DM-only, loaded on demand) ---------- */
const NO_HISTORY=new Set(["logs","chats","meta"]);
const HIST_SEEN=new Map();
async function recordHistory(col,id,prev){
  if(NO_HISTORY.has(col)||!prev)return;
  const key=col+"__"+id,last=HIST_SEEN.get(key)||0;if(Date.now()-last<5*60e3)return;HIST_SEEN.set(key,Date.now());
  const data=JSON.parse(JSON.stringify(prev));delete data.id;
  if(JSON.stringify(data).length>200000)return;
  try{await db.collection(SECRET+"/history").doc(key+"__"+Date.now()).set({key,col,eid:id,at:Date.now(),title:titleOf(col,prev)||"",data})}catch(e){console.error("History write failed",e)}
}
async function recordTrash(col,id,prev){
  if(!prev||col==="chats"||col==="meta"||col==="logs")return;
  const data=JSON.parse(JSON.stringify(prev));delete data.id;
  try{await db.collection(SECRET+"/trash").doc(col+"__"+id).set({col,eid:id,at:Date.now(),title:titleOf(col,prev)||"",data})}catch(e){console.error("Trash write failed",e);toast("Couldn't move that to Trash, so it can't be restored later")}
}
async function purgeOld(){
  const now=Date.now();
  for(const [path,days] of [["trash",30],["history",90]]){const docs=await listDocs(SECRET+"/"+path);for(const d of docs)if(now-(d.at||0)>days*864e5){try{await db.collection(SECRET+"/"+path).doc(d.id).delete()}catch(_){}}}
}

/* ---------- places inside places ---------- */
const PLACE_CATS=new Set(["location","shop","lore"]);
const placeOpts=selfId=>Object.fromEntries([["","— Not inside another place —"],...S.notes.filter(n=>PLACE_CATS.has(n.category)&&n.id!==selfId).sort((a,b)=>(a.title||"").localeCompare(b.title||"")).map(n=>[n.id,n.title||"Untitled"])]);
function placeChain(n){const out=[];let cur=n,guard=0;while(cur&&cur.parent&&guard++<10){const p=rec("notes",cur.parent);if(!p||out.includes(p))break;out.unshift(p);cur=p}return out}
const placeKids=id=>S.notes.filter(n=>n.parent===id).sort((a,b)=>(a.title||"").localeCompare(b.title||""));
function placeFolk(n){const t=(n.title||"").toLowerCase();if(t.length<4)return [];return S.characters.filter(c=>(c.location||"").toLowerCase().includes(t))}
function placeBlock(n){
  const chain=placeChain(n),kids=placeKids(n.id),folk=placeFolk(n);
  if(!chain.length&&!kids.length&&!folk.length)return "";
  return `<div class="place-box">${chain.length?`<div class="crumbs">${chain.map(p=>`<a class="xref" href="#" data-act="open" data-type="notes" data-id="${p.id}">${esc(p.title)}</a>`).join(" › ")} › <b>${esc(n.title)}</b></div>`:""}
    ${kids.length?`<div class="prop"><b>Inside.</b> ${kids.map(k=>`<a class="xref" href="#" data-act="open" data-type="notes" data-id="${k.id}">${esc(k.title)}</a>`).join(", ")}</div>`:""}
    ${folk.length?`<div class="prop"><b>People here.</b> ${folk.map(c=>`<a class="xref" href="#" data-act="open" data-type="characters" data-id="${c.id}">${esc(c.name)}</a>`).join(", ")}</div>`:""}</div>`;
}
function vPlaces(){
  const places=S.notes.filter(n=>PLACE_CATS.has(n.category)&&n.category!=="lore"||S.notes.some(k=>k.parent===n.id));
  const roots=places.filter(n=>!n.parent||!rec("notes",n.parent)).sort((a,b)=>placeKids(b.id).length-placeKids(a.id).length||(a.title||"").localeCompare(b.title||""));
  const node=(n,depth)=>{const kids=placeKids(n.id),folk=placeFolk(n);return `<li><button class="pl-n" data-act="open" data-type="notes" data-id="${n.id}"><b>${esc(n.title||"Untitled")}</b><small>${NOTE_CATS[n.category]||""}${folk.length?` · ${folk.length} ${folk.length===1?"person":"people"}`:""}</small></button>${kids.length&&depth<6?`<ul>${kids.map(k=>node(k,depth+1)).join("")}</ul>`:""}</li>`};
  return `<div class="sub-bar"><p class="tool-d">Places nested inside each other. Set a note's <b>Inside</b> field to file it under a bigger place.</p></div>${roots.length?`<ul class="ptree">${roots.map(r=>node(r,0)).join("")}</ul>`:`<div class="empty">No locations yet.</div>`}`;
}

/* ---------- bestiary (homebrew stat blocks) ---------- */
const ABIL=["str","dex","con","int","wis","cha"];
const mod=v=>{const n=num(v);if(n==null)return "";const m=Math.floor((n-10)/2);return (m>=0?"+":"")+m};
const blockLines=t=>String(t||"").split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const m=l.match(/^([^.:]{1,60}[.:])\s+(.*)$/);return m?`<p><b><i>${esc(m[1])}</i></b> ${linkify(esc(m[2]),"")}</p>`:`<p>${linkify(esc(l),"")}</p>`}).join("");
function statBlock(m){
  const sec=(h,t)=>t?`<h4 class="sb-h">${h}</h4>${blockLines(t)}`:"";
  const line=(l,v)=>v?`<div class="sb-l"><b>${l}</b> ${esc(v)}</div>`:"";
  return `<div class="statblock"><h3>${esc(m.name||"Monster")}</h3><div class="sb-meta">${esc(m.meta||"")}</div><div class="taper"></div>
    ${line("Armor Class",[m.ac,m.acNote].filter(Boolean).join(" "))}${line("Hit Points",[m.hp,m.hpNote?`(${m.hpNote})`:""].filter(Boolean).join(" "))}${line("Speed",m.speed)}
    <div class="taper"></div><div class="sb-ab">${ABIL.map(a=>`<div><b>${a.toUpperCase()}</b><span>${esc(m[a]??"–")} ${m[a]!=null&&m[a]!==""?`(${mod(m[a])})`:""}</span></div>`).join("")}</div><div class="taper"></div>
    ${line("Saving Throws",m.saves)}${line("Skills",m.skills)}${line("Resistances & Immunities",m.resist)}${line("Senses",m.senses)}${line("Languages",m.languages)}${line("Challenge",m.cr?`${m.cr} (${fmtN(CR_XP[m.cr]||0)} XP)`:"")}
    ${m.traits?`<div class="taper"></div>${blockLines(m.traits)}`:""}${sec("Actions",m.actions)}${sec("Bonus Actions",m.bonus)}${sec("Reactions",m.reactions)}${sec("Legendary Actions",m.legendary)}${sec("Phases & notes",m.notes)}</div>`;
}
/* Quick stat block maker: built-in rules of thumb by CR, nudged by role. No outside service. */
const GEN_ROLES={brute:"Brute",skirmisher:"Skirmisher",caster:"Spellcaster",defender:"Defender"};
const GEN_TYPES=["humanoid","beast","undead","fiend","monstrosity","construct","elemental","fey","dragon","aberration","giant","celestial","plant","ooze"];
const GEN_DMG=["slashing","piercing","bludgeoning","fire","cold","lightning","thunder","acid","poison","necrotic","radiant","psychic","force"];
const crNum=cr=>cr==="1/8"?.125:cr==="1/4"?.25:cr==="1/2"?.5:(num(cr)||0);
function genMon(name,o,isPerson){  // isPerson: the stat block is for a named NPC
  const cr=CRS.includes(o.cr)?o.cr:"1",n=crNum(cr),half=Math.floor(n/2),R=GEN_ROLES[o.role]?o.role:"brute",type=GEN_TYPES.includes(o.type)?o.type:"humanoid",dmg=GEN_DMG.includes(o.dmg)?o.dmg:"slashing";
  const low=["0","1/8","1/4","1/2"].indexOf(cr);
  let ac=12+half,hp=low>=0?[3,7,13,22][low]:Math.round(20*n),dpr=low>=0?[1,3,5,7][low]:Math.round(7*n);
  const adj={brute:[-1,1.25,1.15],skirmisher:[1,.85,1],caster:[-1,.8,1.1],defender:[2,1.2,.8]}[R];
  ac=Math.min(22,Math.max(10,ac+adj[0]));hp=Math.max(2,Math.round(hp*adj[1]));dpr=Math.max(1,Math.round(dpr*adj[2]));
  const dc=12+half,prof=n<1?2:2+Math.floor((n-1)/4),pm=Math.min(7,2+Math.floor(n/4)),atk=pm+prof;  // to-hit matches the ability scores below
  const mindless=["beast","ooze","plant"].includes(type);
  const prim=R==="brute"||R==="defender"?"str":R==="skirmisher"?"dex":["fiend","fey","celestial","dragon"].includes(type)?"cha":["undead","aberration","construct"].includes(type)?"int":"wis";
  const ab={str:10,dex:12,con:10+2*Math.max(1,pm-1),int:mindless?3:10,wis:10,cha:mindless?5:10};ab[prim]=10+2*pm;
  const conM=Math.floor((ab.con-10)/2),large=["giant","dragon"].includes(type)||(R==="brute"&&n>=5),die=large?5.5:4.5;
  const hd=Math.max(1,Math.round(hp/(die+conM)));hp=Math.max(1,Math.floor(hd*die)+hd*conM);
  // a named NPC reads as "Mira moves", a kind of creature as "the goblin moves"
  const nm=String(name||"creature").trim()||"creature",proper=!!isPerson&&/^[A-Z]/.test(nm)&&!/^(the|a|an)\s/i.test(nm);
  const who=proper?nm:"the "+nm.replace(/^(the|a|an)\s+/i,"").toLowerCase(),Who=who.charAt(0).toUpperCase()+who.slice(1);
  const count=n>=11?3:n>=3?2:1,per=dpr/count,dd=R==="skirmisher"?3.5:R==="caster"?5.5:4.5,dn=R==="skirmisher"?"d6":R==="caster"?"d10":"d8";
  const nd=Math.max(1,Math.round((per-pm)/dd)),avg=Math.max(1,Math.floor(nd*dd)+pm);
  const phys={slashing:"Slash",piercing:"Stab",bludgeoning:"Slam"}[dmg],aName=phys||`${CAP(dmg)} Lash`;
  const actions=[];
  if(count>1)actions.push(`Multiattack. ${Who} makes ${count===2?"two":"three"} ${R==="caster"?"Spell Bolt":aName} attacks.`);
  if(R==="caster"){
    actions.push(`Spell Bolt. Ranged Attack Roll: +${atk}, range 120 ft. Hit: ${avg} (${nd}${dn} + ${pm}) ${dmg} damage.`);
    const bn=Math.max(1,Math.round(dpr*.75/3.5));actions.push(`${phys?"Shard":CAP(dmg)} Burst (Recharge 5–6). Dexterity Saving Throw: DC ${dc}, each creature in a 15-foot cube within 60 feet. Failure: ${Math.floor(bn*3.5)} (${bn}d6) ${dmg} damage. Success: Half damage.`)}
  else actions.push(`${aName}. Melee Attack Roll: +${atk}, reach ${large?10:5} ft. Hit: ${avg} (${nd}${dn} + ${pm}) ${dmg} damage.`);
  const traits=[],bonus=[],reactions=[];
  if(R==="brute")traits.push(`Brutal Charge. If ${who} moves at least 20 feet straight toward a target right before hitting it, the target takes an extra ${Math.max(2,Math.round(per/2))} ${dmg} damage.`);
  if(R==="skirmisher")bonus.push(`Nimble Escape. ${Who} takes the Disengage or Hide action.`);
  if(R==="defender")reactions.push(`Parry. ${Who} adds 2 to its AC against one melee attack that would hit it. It must see the attacker.`);
  if(R==="caster")bonus.push(`Misty Step. ${Who} teleports up to 30 feet to a space it can see.`);
  if(type==="undead")traits.push(`Undead Nature. ${Who} doesn't need air, food, drink or sleep.`);
  const wisM=Math.floor((ab.wis-10)/2),dark=["undead","fiend","dragon","aberration","monstrosity","giant","elemental"].includes(type);
  const P=prim.toUpperCase().replace(/^(.)(.*)$/,(m,a,b)=>a+b.toLowerCase());
  return {name:name||"Creature",cr,meta:`${large?"Large":"Medium"} ${type}, ${["beast","ooze","plant","construct"].includes(type)?"unaligned":"neutral"}`,
    ac:String(ac),hp:String(hp),hpNote:`${hd}d${large?10:8}${hd*conM?` ${hd*conM>0?"+":"−"} ${Math.abs(hd*conM)}`:""}`,speed:R==="skirmisher"?"40 ft.":type==="dragon"?"30 ft., fly 60 ft.":"30 ft.",
    ...ab,saves:n>=5?`${P} +${pm+prof}`:"",skills:`Perception +${wisM+prof}`,senses:`${dark?"darkvision 60 ft., ":""}passive Perception ${10+wisM+prof}`,languages:mindless?"—":"Common",
    traits:traits.join("\n"),actions:actions.join("\n"),bonus:bonus.join("\n"),reactions:reactions.join("\n")}}
const GEN={cr:"1",role:"brute",type:"humanoid",dmg:"slashing"};

  const left=`<div class="nlist"><div class="ppl-tools"><input class="search" id="pplq" data-in="pplQ" type="search" placeholder="Search NPCs and foes" aria-label="Search NPCs and foes" value="${esc(U.pplQ||"")}">${kinds}

    <div class="lib-lh"><h3>${{all:"NPCs & Enemies",npc:"NPCs",foe:"Foes"}[kind]}</h3><span>${list.length}</span></div>${list.length?list.map(row).join(""):`<div class="empty">${U.pplQ?"Nothing matches that search.":"No one here yet. Add someone by name."}</div>`}</div>`;

      ${dm?`<div class="ppl-att"><span class="label">Starting attitude</span><div class="seg">${[["friendly","Friendly"],["neutral","Neutral"],["hostile","Hostile"]].map(([k,l])=>`<button type="button" data-act="pplAtt" data-v="${k}" aria-pressed="${x.attitude===k}">${l}</button>`).join("")}</div></div>`:""}

// one helper for small field changes; project() right after so a quick second tap reads the new values
async function patchRec(col,id,patch){const r=rec(col,id);if(!r)return false;const{id:_,...keep}=r;const ok=await save(col,id,{...keep,...patch});project();return ok}
async function pplAct(a,t){const sel=U.pplSel,x=sel&&rec(sel.col,sel.id);
  if(a==="pplSel"){U.pplSel={col:t.dataset.col,id:t.dataset.id};U.genArm=null;U.noteReading=true;render();if(isPhone())window.scrollTo({top:0});return}
  if(a==="pplKind"){U.pplKind=t.dataset.v;U.noteReading=false;render();return}
  if(a==="pplTab"){U.pplTab=t.dataset.v;U.genArm=null;render();return}
  if(!x)return;
  if(a==="pplAtt"){await patchRec("characters",x.id,{attitude:x.attitude===t.dataset.v?"":t.dataset.v});return}
  if(a==="pplUnlink"){await patchRec("characters",x.id,{mon:""});return}
  if(a==="genSave"){const id=uid(),g=genMon(x.name,GEN,sel.col==="characters");await save("monsters",id,g);if(sel.col==="characters")await patchRec("characters",x.id,{mon:id});else U.pplSel={col:"monsters",id};U.pplTab="block";toast(`Saved a CR ${g.cr} stat block for ${g.name}`);project();render();return}
  if(a==="genApply"){if(U.genArm!==x.id){U.genArm=x.id;render();return}U.genArm=null;const{name:_,...g}=genMon(x.name,GEN,false);
    // clear the fields the maker doesn't fill so old values don't sit next to new numbers; keep legendary actions and notes
    await patchRec("monsters",x.id,{acNote:"",resist:"",...g});U.pplTab="block";toast("Numbers and abilities replaced");render()}}

  if(t.dataset&&t.dataset.gen){GEN[t.dataset.gen]=t.value;U.genArm=null;if(TM)renderTable();else render();return}

/* Party: player characters with their sheet and story, whole-party level, and the party's languages */

const heroLevelSet=()=>[...new Set(pcList().map(p=>num(p.level)||0))].sort((a,b)=>a-b);  // 0 means no level set
function vHeroes(){

/* making text rollable */
const SKILLS=["Acrobatics","Animal Handling","Arcana","Athletics","Deception","History","Insight","Intimidation","Investigation","Medicine","Nature","Perception","Performance","Persuasion","Religion","Sleight of Hand","Stealth","Survival","Strength","Dexterity","Constitution","Intelligence","Wisdom","Charisma","Initiative","Str","Dex","Con","Int","Wis","Cha"];

  const out=[];const add=(i,len,spec)=>{if(out.some(o=>i<o.i+o.len&&o.i<i+len))return;out.push({i,len,spec})};let m;

  const pm=/\(([+\-−]\d+)\)/g;while((m=pm.exec(text)))add(m.index+1,m[1].length,{kind:"check",bonus:m[1].replace(MINUS,"-")});
  SKILL_RE.lastIndex=0;while((m=SKILL_RE.exec(text)))add(m.index+m[0].length-m[2].length,m[2].length,{kind:"check",bonus:m[2].replace(MINUS,"-"),label:m[1]});

const RL_SKIP="a,button,textarea,input,select,option,script,style,[contenteditable],.rl,.rl-all,code,h1,h2";

/* average damage */
function calcResult(c){
  const t=parseDice(c.dmg);if(!t)return null;const avg=avgTerms(t),dice=diceOnlyAvg(t),[mn,mx]=minMax(t);
  const resF=c.res==="resist"?0.5:c.res==="vuln"?2:c.res==="immune"?0:1;
  if(c.mode==="save"){const dc=+c.dc||0,sb=+c.save||0;let fail=Math.min(1,Math.max(0,(dc-1-sb)/20));const succ=1-fail;const per=(fail*avg+succ*(c.half?avg/2:0))*resF;const n=Math.max(1,+c.targets||1);
    return {mode:"save",fail,avg:avg*resF,half:c.half?avg/2*resF:0,per,total:per*n,n,mn:mn*resF,mx:mx*resF}}
  const ac=+c.ac||0,b=+c.bonus||0;const critMin=c.crit19?19:20;
  let hit=Math.min(19,Math.max(1,21-(ac-b)))/20;let cr=(21-critMin)/20;hit=Math.max(hit,cr);
  if(c.adv==="adv"){hit=1-(1-hit)**2;cr=1-(1-cr)**2}else if(c.adv==="dis"){hit=hit**2;cr=cr**2}
  const critAvg=avg+dice;const per=((hit-cr)*avg+cr*critAvg)*resF;const n=Math.max(1,+c.n||1);
  return {mode:"attack",hit,cr,avg:avg*resF,critAvg:critAvg*resF,per,total:per*n,n,mn:mn*resF,mx:mx*resF}}

let SHEETTAB="main";
const CONDS=["Blinded","Charmed","Deafened","Frightened","Grappled","Incapacitated","Invisible","Paralyzed","Petrified","Poisoned","Prone","Restrained","Stunned","Unconscious","Concentrating","Exhaustion"];
const ABBR={STR:"Strength",DEX:"Dexterity",CON:"Constitution",INT:"Intelligence",WIS:"Wisdom",CHA:"Charisma"};
const SKILL_AB={"Acrobatics":"DEX","Animal Handling":"WIS","Arcana":"INT","Athletics":"STR","Deception":"CHA","History":"INT","Insight":"WIS","Intimidation":"CHA","Investigation":"INT","Medicine":"WIS","Nature":"INT","Perception":"WIS","Performance":"CHA","Persuasion":"CHA","Religion":"INT","Sleight of Hand":"DEX","Stealth":"DEX","Survival":"WIS"};
function parseSheet(md){
  const t=String(md||"").replace(/\r/g,"");if(!t.trim())return null;
  const sec={};let cur="_";t.split("\n").forEach(l=>{const h=l.match(/^##\s+(.+)/);if(h){cur=h[1].trim().toLowerCase();sec[cur]="";return}sec[cur]=(sec[cur]||"")+l+"\n"});
  const get=k=>Object.entries(sec).find(([n])=>n.startsWith(k))?.[1]||"";
  const abil={};const ab=get("ability");let m;const re=/\*\*(STR|DEX|CON|INT|WIS|CHA)\*\*\s*(\d+)\s*\(([+\-−]\d+)\)/g;while((m=re.exec(ab)))abil[m[1]]={score:+m[2],mod:+m[3].replace("−","-")};
  if(Object.keys(abil).length<6)return null;
  const saveLine=(ab.match(/\*\*Saving throws:\*\*\s*([^\n]*)/)||[])[1]||"";const saveProf=new Set(Object.entries(ABBR).filter(([k,v])=>new RegExp(v,"i").test(saveLine)).map(([k])=>k));
  const basics=get("basics");const pb=+((t.match(/proficiency bonus \+(\d+)/i)||[])[1]||2);
  const skills=get("skills").split(/·|\n/).map(s=>s.trim()).map(s=>s.match(/^(.+?)\s([+\-−]\d+)(?:\s*\((\w+)\))?$/)).filter(Boolean).map(x=>({name:x[1],bonus:+x[2].replace("−","-"),prof:x[3]||""}));
  const profText=get("proficiencies");const langs=(profText.match(/\*\*Languages:\*\*\s*([^\n]*)/)||[])[1]||"";const profs=profText.replace(/\*\*Languages:\*\*[^\n]*/,"").trim();
  const feats=get("features").split("\n").map(l=>l.match(/^-\s+\*\*(.+?)\*\*\s*(?:\(([^)]*)\))?\.?\s*(.*)$/)).filter(Boolean).map(x=>({name:x[1],src:x[2]||"",desc:x[3]||""}));
  const spellsRaw=get("spells").trim();const spells={};
  if(spellsRaw&&!/^\(none\)/.test(spellsRaw)){spellsRaw.split(";").forEach(g=>{g=g.trim();const gm=g.match(/^(.*)\(([^()]*)\)\s*$/);const groupLvl=gm&&/cantrip|^\d+$/.test(gm[2].trim())&&g.split(",").length>1&&!/\(/.test(gm[1])?gm[2].trim():null;
    (groupLvl?gm[1]:g).split(",").map(s=>s.trim()).filter(Boolean).forEach(s=>{const im=s.match(/^(.+?)\s*\((?:level\s*)?(cantrip|\d)\)$/i);const name=im?im[1]:s,lvl=im?im[2]:groupLvl||"?";const key=/cantrip/i.test(lvl)?"Cantrips":lvl==="?"?"Other":"Level "+lvl;(spells[key]=spells[key]||[]).push(name)})})}
  const invT=get("inventory");const curr=(invT.match(/\*\*Currency:\*\*\s*([^\n]*)/)||[])[1]||"";const inv=invT.replace(/\*\*Currency:\*\*[^\n]*/,"").trim().split(/,\s*(?![^()]*\))/).map(s=>s.trim()).filter(Boolean).map(s=>({name:s.replace(/\s*\((equipped|attuned|equipped, attuned)\)/gi,"").trim(),eq:/equipped/i.test(s),att:/attuned/i.test(s)}));
  const attacks=get("attacks").trim();
  const bl=basics.split("\n").map(s=>s.trim()).filter(Boolean);const speed=(basics.match(/\*\*Speed\*\*\s*([^·\n]*)/)||[])[1]||"";
  return {abil,saveProf,pb,skills,profs,langs,feats,spells,inv,curr,attacks,basics:bl,speed:speed.trim(),alert:feats.some(f=>/^Alert$/i.test(f.name)),src:(t.match(/^\*From ([^.]*)/m)||[])[1]||""};
}
const sgn=v=>(v>=0?"+":"")+v;

      <div class="cs-quick"><button type="button" class="cs-roll cs-qb" data-sroll="1d20${sgn(init)}" data-slabel="${esc(nm)}: Initiative"><span>Initiative</span><b>${sgn(init)}</b></button><div class="cs-qb"><span>Proficiency</span><b>+${S2.pb}</b></div>${S2.speed?`<div class="cs-qb"><span>Speed</span><b>${esc(S2.speed.replace(/\s*\(.*$/,""))}</b></div>`:""}${["Perception","Insight","Investigation"].map(n=>{const sk=S2.skills.find(s=>s.name===n);const v=sk?10+sk.bonus:10+S2.abil[SKILL_AB[n]].mod;return `<div class="cs-qb cs-pass"><span>Passive ${n}</span><b>${v}</b></div>`}).join("")}</div>

      ${S2.attacks?`<h4 class="cs-h">Attacks</h4><p class="cs-txt">${esc(S2.attacks)}</p>`:""}
      ${S2.profs||S2.langs?`<h4 class="cs-h">Proficiencies & languages</h4>${S2.profs?`<p class="cs-txt">${esc(S2.profs)}</p>`:""}${S2.langs?`<p class="cs-txt"><b>Languages.</b> ${esc(S2.langs)}</p>`:""}`:""}
      ${S2.basics.length?`<h4 class="cs-h">Details</h4><div class="prose vprose cs-basics">${rich(S2.basics.join("\n"),"characters:"+x.id)}</div>`:""}`;
  }else if(SHEETTAB==="feat"){
    body=`<div class="cs-feats">${S2.feats.map(f=>`<details class="cs-feat"><summary><b>${esc(f.name)}</b>${f.src?`<small>${esc(f.src)}</small>`:""}</summary><div class="prose">${rich(f.desc||"","characters:"+x.id)}</div></details>`).join("")||'<p class="vempty">No features listed.</p>'}</div>`;
  }else if(SHEETTAB==="spells"){
    const order=k=>k==="Cantrips"?0:k==="Other"?99:+k.replace(/\D/g,"");
    body=Object.keys(S2.spells).sort((a,b)=>order(a)-order(b)).map(k=>`<h4 class="cs-h">${esc(k)}</h4><div class="cs-spells">${S2.spells[k].map(s=>`<button type="button" class="cs-spell" data-spell="${esc(s)}" title="What does it do?">${esc(s)}</button>`).join("")}</div>`).join("");
  }else{
    body=`<ul class="cs-inv">${S2.inv.map(i=>`<li class="${i.eq?"eq":""}"><span>${esc(i.name)}</span>${i.eq?'<em>equipped</em>':""}${i.att?'<em class="att">attuned</em>':""}</li>`).join("")}</ul>${S2.curr?`<p class="cs-txt cs-cur"><b>Coins.</b> ${esc(S2.curr)}</p>`:""}`;
  }

}

const RULE_RE=new RegExp("\\b("+Object.keys(RULES).join("|")+")\\b","g");
function rulifyIn(root){if(!root)return;root.querySelectorAll(".prose,.statblock").forEach(scope=>{if(scope.closest("[contenteditable],.rte,form"))return;
  const w=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue&&RULE_RE.test(n.nodeValue)&&(RULE_RE.lastIndex=0,true)&&!(n.parentElement&&n.parentElement.closest("a,button,textarea,input,.rl,.rule,h1,h2,h3,[contenteditable]"))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;RULE_RE.lastIndex=0;let m,last=0;const f=document.createDocumentFragment();while((m=RULE_RE.exec(t))){f.appendChild(document.createTextNode(t.slice(last,m.index)));const s=document.createElement("span");s.className="rule";s.dataset.rule=m[1];s.textContent=m[0];s.tabIndex=0;f.appendChild(s);last=m.index+m[0].length}f.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(f,n)})})}

/* reveal checklist */
// A plan with scenes keeps its clues in the scenes, so the reveal checklist reads (and ticks) those instead of the old reveals text.
function revealItems(plan){if(plan&&Array.isArray(plan.scenes)){const out=[];plan.scenes.forEach(s=>(s.clues||[]).forEach((k,ci)=>{const t=String(k.t||"").trim();if(t)out.push({i:out.length,done:!!k.found,text:t,sid:s.id,ci})}));return out}
  return String(plan?.reveals||"").split("\n").map(s=>s.trim()).filter(Boolean).map((l,i)=>({i,done:/^\[x\]\s*/i.test(l),text:l.replace(/^\[[ x]?\]\s*/i,"")}))}
function revealList(plan){const it=revealItems(plan);if(!it.length)return "";return `<section class="tm-s rev"><h3>Reveal checklist <span class="mono">${it.filter(x=>x.done).length}/${it.length}</span></h3><ul class="revl">${it.map(x=>`<li class="${x.done?"done":""}"><label><input type="checkbox" data-reveal="${plan.id}|${x.i}" ${x.done?"checked":""}><span>${linkify(esc(x.text),"")}</span></label></li>`).join("")}</ul></section>`}
async function toggleReveal(pid,i,on){const p=rec("plans",pid);if(!p)return;
  if(Array.isArray(p.scenes)){const it=revealItems(p)[i];if(!it)return;learnFromReveal(pid,i,on,it.text);return stScenePatch(pid,sc=>{const s=sc.find(x=>x.id===it.sid);if(s&&s.clues[it.ci])s.clues[it.ci].found=on})}
  const lines=String(p.reveals||"").split("\n").map(s=>s.trim()).filter(Boolean);if(!lines[i])return;const t=lines[i].replace(/^\[[ x]?\]\s*/i,"");learnFromReveal(pid,i,on,t);lines[i]=(on?"[x] ":"")+t;const{id:_,...r}=p;await save("plans",pid,{...r,reveals:lines.join("\n")})}

let CLOCK={start:null,acc:0,running:false,lastBreak:0};try{const c=JSON.parse(localStorage.getItem("dmdesk-clock")||"null");if(c)CLOCK={...CLOCK,...c}}catch(e){}
function clockSave(){try{localStorage.setItem("dmdesk-clock",JSON.stringify(CLOCK))}catch(e){}}
function clockMs(){return CLOCK.acc+(CLOCK.running&&CLOCK.start?Date.now()-CLOCK.start:0)}
function fmtClock(ms){const m=Math.floor(ms/60000);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`}
function quietPCs(){const n=rcSession();const l=logFor(n);const had=new Set(l&&l.spotlight||[]);return S.characters.filter(x=>x.kind==="pc"&&!had.has(x.id))}
function clockHtml(){const ms=clockMs();const q=ms>=45*60000?quietPCs():[];
  return `<span class="sclock ${CLOCK.running?"on":""}"><b id="sclock-t">${fmtClock(ms)}</b><button class="btn sm" data-clock="${CLOCK.running?"pause":"start"}">${CLOCK.running?"Pause clock":ms?"Resume clock":"Start session clock"}</button>${ms&&!CLOCK.running?'<button class="btn sm" data-clock="reset">Reset</button>':""}</span>${q.length&&q.length<S.characters.filter(x=>x.kind==="pc").length?`<span class="quiet">Quiet so far: ${q.map(p=>`<button type="button" data-quiet="${p.id}" title="Mark ${esc(p.name)} as having had the spotlight">${esc((p.name||"").split(/[ "]/)[0])}</button>`).join("")}</span>`:""}`}

  const q=e.target.closest("[data-quiet]");if(q){e.stopPropagation();await toggleSpot(q.dataset.quiet,rcSession(),true);toast("Marked as having had the spotlight");if(TM)renderTable()}},true);
setInterval(()=>{if(!CLOCK.running)return;const ms=clockMs();const t=document.getElementById("sclock-t");if(t)t.textContent=fmtClock(ms);const per=90*60000;if(ms-CLOCK.lastBreak>=per){CLOCK.lastBreak=Math.floor(ms/per)*per;clockSave();toast(`You've been playing ${fmtClock(ms)}. Good time for a break?`)}},20000);

const COIN_RE=/(\d[\d,]*)\s*(pp|gp|ep|sp|cp)\b/gi;
async function logLoot(text){const n=rcSession();let m,coins={};COIN_RE.lastIndex=0;while((m=COIN_RE.exec(text)))coins[m[2].toLowerCase()]=(coins[m[2].toLowerCase()]||0)+num(m[1].replace(/,/g,""));

  if(Object.keys(coins).length){const purse={pp:0,gp:0,ep:0,sp:0,cp:0,...(S.settings.purse||{})};for(const k in coins)purse[k]=(num(purse[k])||0)+coins[k];await save("settings","purse",purse)}
  if(rest){const qm=rest.match(/^(\d+)\s*[x×]?\s+(.+)$/i);await save("loot",uid(),{name:qm?qm[2]:rest,qty:qm?num(qm[1]):1,holder:"party",notes:`Found in session ${n}.`,dmOnly:false})}
  const l=logFor(n)||{};const{id:_i,dmOnly:_d,secret:_s,...keep}=l;const lootLog=[...(Array.isArray(keep.lootLog)?keep.lootLog:[]),{at:Date.now(),text}];
  await save("logs","s"+n,{...keep,session:n,notes:keep.notes??rcNotesVal(n)??"",open:keep.open||"",spotlight:keep.spotlight||[],lootLog});
  toast(Object.keys(coins).length&&rest?"Added to the treasury and loot":Object.keys(coins).length?"Added to the treasury":"Added to party loot")}
function lootSection(){const n=rcSession();const l=logFor(n);const ll=(l&&Array.isArray(l.lootLog)?l.lootLog:[]);

let LAST_TIME_LINE=null;
async function dayStep(n,quiet){
  const c=cal();const today=fromIdx(c,toIdx(c,c.today)+n);
  await save("settings","calendar",{...(S.settings.calendar||{}),today});U.calY=today.y;U.calM=today.m;
  if(!isDM())return;
  if(n<0){ // undo the line the last step wrote, if it's still the last line
    if(LAST_TIME_LINE){const s=LAST_TIME_LINE.session;const cur=rcNotesVal(s)||"";const lines=cur.split("\n");if(lines.length&&lines[lines.length-1].includes(LAST_TIME_LINE.text)){lines.pop();U.rcNotes=lines.join("\n");markDirty(s);await saveLog(s);toast("Took the rest back out of your notes")}LAST_TIME_LINE=null}
    return}
  if(quiet){LAST_TIME_LINE=null;return}
  const text=n===1?`Long rest. The party wakes on ${fmtDate(c,today)}.`:`${n} days pass. It is now ${fmtDate(c,today)}.`;
  const s=await addSessionLine(text);LAST_TIME_LINE={session:s,text};
  toast(n===1?`Long rest logged in session ${s} notes`:`${n} days logged in session ${s} notes`);
}

  const pcs=S.characters.filter(c=>c.kind==="pc");const before=pcs.map(c=>({id:c.id,level:c.level}));
  for(const c of pcs){const{id,...r}=c;await save("characters",id,{...r,level:to})}

  <label>Pace<select data-trv="pace">${["fast","normal","slow"].map(k=>`<option value="${k}" ${TRV.pace===k?"selected":""}>${k[0].toUpperCase()+k.slice(1)}${k==="fast"?" (−5 passive Perception)":k==="slow"?" (can sneak)":""}</option>`).join("")}</select></label>
  <label>Ground<select data-trv="terrain"><option value="1" ${TRV.terrain==1?"selected":""}>Roads or open ground</option><option value="0.5" ${TRV.terrain==0.5?"selected":""}>Difficult (forest, swamp, mountains)</option></select></label>

  <div class="trv-out" id="trv-out">${trvOut(r,c)}</div>
  <div class="foot"><span class="grow">${num(TRV.miles)&&TRV.from&&TRV.to?`<button type="button" class="btn" data-act="trvSave">Save route</button>`:""}</span><button type="button" class="btn" data-act="close">Close</button>${r&&isDM()?`<button type="button" class="btn primary" data-act="trvGo">Move the calendar ${r.whole} day${r.whole===1?"":"s"}</button>`:""}</div></div>`,true);OPEN={kind:"travel"};

function trvOut(r,c){if(!r)return `<p class="vempty">Enter a distance to see how long the trip takes.</p>`;const arrive=fromIdx(c,toIdx(c,c.today)+r.whole);

async function trvGo(){const r=trvCalc();if(!r)return;const c=cal();const today=fromIdx(c,toIdx(c,c.today)+r.whole);

let MIG_BUSY=false;const MIG_DONE=new Set();
async function calMigrate(){
  const c=S.settings.calendar;const mig=c&&c.migrate;if(!mig||MIG_BUSY||MIG_DONE.has(mig.id)||!isDM()||!S.live)return;MIG_BUSY=true;MIG_DONE.add(mig.id);
  try{const map=mig.map||[];let n=0;
    for(const e of S.events.slice()){if(e.calv===mig.id||map[e.m]==null)continue;const{id,...r}=e;await save("events",id,{...r,m:map[e.m],calv:mig.id});n++}
    for(const x of S.notes.slice()){if(!x.ig||x.calv===mig.id||map[x.ig.m]==null)continue;const{id,...r}=x;await save("notes",id,{...r,ig:{...x.ig,m:map[x.ig.m]},calv:mig.id});n++}
    const lr=S.settings.learned;if(lr&&Array.isArray(lr.list)&&!lr.calv){await save("settings","learned",{list:lr.list.map(x=>x.m!=null&&map[x.m]!=null?{...x,m:map[x.m]}:x),calv:mig.id})}

/* ---------- render ---------- */
/* Keep keyboard focus on the same button across a redraw. Buttons without an id are found again by their data- attributes.
   Set FOCUS_NEXT to a selector to move focus somewhere else after the next redraw (a moved row, a new input). */
// every data- attribute counts (calendar days need y, m and d), except label, which armed buttons change in place
const FOCUS_SKIP=new Set(["label"]);
let FOCUS_NEXT=null;
function focusSel(ae,root){if(!ae||!root||!root.contains(ae)||ae.id||!ae.dataset)return null;const ks=Object.keys(ae.dataset).filter(k=>!FOCUS_SKIP.has(k));if(!ks.length)return null;
  return ae.tagName.toLowerCase()+ks.map(k=>`[data-${k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}="${CSS.escape(ae.dataset[k])}"]`).join("")}
function focusAfter(root,sel){const own=!!FOCUS_NEXT,s=FOCUS_NEXT||sel;FOCUS_NEXT=null;if(!s||!root)return;
  const all=root.querySelectorAll(s);if(!all.length||(!own&&all.length>1))return;  // two lookalikes: don't guess
  let el=all[0];
  // a button that turned itself off (Undo with nothing left) hands focus to the next usable control beside it
  if(el.disabled)el=[...(el.parentElement?.querySelectorAll("button,input,select")||[])].find(x=>!x.disabled&&x!==el)||null;
  if(el)el.focus({preventScroll:true})}

  const tabLinks=TABS.filter(([k])=>((k!=="prep")||isDM())&&(k!=="home"||!isDM())).map(([k,l,sh])=>[k,`<a href="#${k}" ${U.tab===k?'aria-current="page"':""}><span class="full">${l}</span><span class="short">${sh}</span><span class="n">${counts[k]||""}</span></a>`]);
  // The DM's menu follows the design: Session, Prep Board, Scenes, Party, then The Library. Players keep their own short list.
  const linkHtml=list=>list.map(([,h])=>h).join("");
  document.getElementById("tabs").innerHTML=isDM()?(sideMenu()?sideNav():phoneNav())
    :(sideMenu()?`<span class="nav-brand" aria-hidden="true">DM's Desk</span>`:"")+linkHtml(tabLinks);
  const banner=(S.live?"":`<div class="banner">Saving isn't available in this view, so changes last only until you close the page.</div>`)+(U.preview?`<div class="preview-bar"><span>Previewing what your players see.</span><button class="btn sm" data-act="previewToggle">Stop previewing</button></div>`:"");
  const views={home:vHome,party:vParty,notes:vNotes,calendar:vCalendar,quests:vQuests,world:vWorld,prep:vPrep};
  const y=window.scrollY,ta=aid&&ae.tagName==="TEXTAREA"?ae.scrollTop:0;
  renderPending=false;
  const hs=[...document.querySelectorAll("#app .sub-tabs, #app .seg, #app .lib-groups, #app .table-wrap, #app .spot-wrap, #app .graph-wrap, #app .calgrid-wrap")].map(e=>e.scrollLeft);
  // keep the comment panel where you were reading when the page redraws behind it
  const popEl=null,popKey=popEl&&popEl.getAttribute("aria-label"),popS=popEl?[popEl.scrollTop,popEl.querySelector(".bs-thread")?.scrollTop||0]:null;
  // the DM's older pages (quests, world, calendar) sit in one parchment card under the design's header

  if(popS){const np=document.querySelector("#app .bs-pop");if(np&&np.getAttribute("aria-label")===popKey){np.scrollTop=popS[0];const t=np.querySelector(".bs-thread");if(t)t.scrollTop=popS[1]}}
  if(aid&&!FOCUS_NEXT){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(_){}if(ta)el.scrollTop=ta}}
  else focusAfter(document.getElementById("app"),fsel);

function mdLite(t,raw){
  const lines=esc(t||"").split(/\n/);let out="",list=false,para=[];
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^\w])_(.+?)_(?!\w)/g,"$1<i>$2</i>");
  const flush=()=>{if(para.length){out+=`<p>${inl(para.join("<br>"))}</p>`;para=[]}};
  for(const l of lines){
    if(/^\s*[-*] /.test(l)){flush();if(!list){out+="<ul>";list=true}out+=`<li>${inl(l.replace(/^\s*[-*] /,""))}</li>`;continue}
    if(list){out+="</ul>";list=false}
    if(/^#{1,3} /.test(l)){flush();out+=`<h4>${inl(l.replace(/^#+ /,""))}</h4>`}
    else if(!l.trim())flush(); else para.push(l);
  }
  flush();if(list)out+="</ul>";return out||(raw?"":`<p style="color:var(--muted)">This note is empty.</p>`);
}

function readForm(type){

  FORMS[type].fields(c).forEach(([k,l,t])=>{
    if(t==="check")o[k]=document.getElementById("f-"+k).checked;
    else if(t==="igdate"){const on=document.getElementById("f-ig-on");if(on&&!on.checked){o[k]=null;return}
      const m=+document.getElementById(`f-${k}-m`).value,y=num(document.getElementById(`f-${k}-y`).value)??c.today.y,d=Math.min(Math.max(1,num(document.getElementById(`f-${k}-d`).value)||1),monthDays(c,y,m));o[k]={y,m,d}}
    else if(t==="number")o[k]=num(document.getElementById("f-"+k).value);
    else if(t==="image")o[k]=document.getElementById("f-"+k).value||"";
    else if(t==="checklist")o[k]=[...document.querySelectorAll(`#f-${k} .cl-row`)].map(r=>{const x=r.querySelector(".cl-text").value.trim();return x?(r.querySelector(".cl-done").checked?"[x] ":"")+x:""}).filter(Boolean).join("\n");
    else if(t==="plain"||t==="plain-tall")o[k]=document.getElementById("f-"+k).value.replace(/\s+$/,"");
    else if(t==="date")o[k]=document.getElementById("f-"+k).value||"";
    else if(t==="dates")o[k]=[...new Set([...document.querySelectorAll("#f-"+k+" input[type=date]")].map(i=>i.value).filter(Boolean))].sort();
    else if(t==="textarea"||t==="textarea-tall")o[k]=htmlToMd(document.getElementById("f-"+k));
    else o[k]=document.getElementById("f-"+k).value.trim();
  });

  const dmo=document.getElementById("f-dmOnly");if(dmo)o.dmOnly=dmo.checked;
  return o;
}

  const blocks=[];

    if(n.nodeType===3)return n.nodeValue.replace(/\u00a0/g," ");
    if(n.nodeType!==1)return "";

    if(!inner.trim())return inner;
    const sty=n.getAttribute("style")||"";
    const bold=t==="B"||t==="STRONG"||/font-weight:\s*(bold|[6-9]00)/.test(sty),ital=t==="I"||t==="EM"||/font-style:\s*italic/.test(sty);

  };

  const walk=parent=>{
    let run=[];
    const flush=()=>{if(run.length){blocks.push({t:"p",s:run.map(inline).join("")});run=[]}};
    for(const n of parent.childNodes){
      if(!isBlock(n)){run.push(n);continue}
      flush();
      const tag=n.tagName;
      if(/^H[1-6]$/.test(tag))blocks.push({t:"h",s:inline(n)});
      else if(tag==="UL"||tag==="OL")[...n.children].forEach(li=>blocks.push({t:"li",s:inline(li)}));
      else if([...n.childNodes].some(isBlock))walk(n);

    }
    flush();
  };
  walk(root);

  for(const b of blocks){
    let s=b.s.replace(/[ \t]+\n/g,"\n").replace(/\n[ \t]+/g,"\n").trim();
    if(!s)continue;
    if(b.t!=="p")s=s.replace(/\n+/g," ");
    const line=b.t==="h"?"# "+s:b.t==="li"?"- "+s:s;
    out+=(out?(prev==="li"&&b.t==="li"?"\n":"\n\n"):"")+line;prev=b.t;
  }
  return out;
}

    const moons=document.getElementById("c-moon").value.split(";").map(x=>x.split(",").map(y=>y.trim())).filter(p=>p[0]&&parseFloat(p[1])>0).map(([n,cy,sh])=>({name:n,cycle:parseFloat(cy),shift:parseFloat(sh)||0}));
    const weekdays=document.getElementById("c-wd").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!months.length||!weekdays.length){toast("Add at least one month and one weekday.");return}
    const m=Math.min(+document.getElementById("f-today-m").value,months.length-1);
    const ty=num(document.getElementById("f-today-y").value)??c.today.y;const today={y:ty,m,d:Math.min(Math.max(1,num(document.getElementById("f-today-d").value)||1),monthDays({months},ty,m))};
    const seasons=document.getElementById("c-seasons").value.split(";").map(x=>x.split(",").map(y=>y.trim())).filter(p=>p[0]&&parseFloat(p[1])>0).map(([n,l,st,md])=>{const o={name:n,length:parseFloat(l)};if(st)o.start=st;if(md)o.mid=md;return o});

    U.calY=today.y;U.calM=today.m;closeSheet();toast("Calendar saved")}
  if(k==="rename"){await save("settings","campaign",{name:document.getElementById("r-name").value.trim()||"The Campaign"});toast("Renamed")}

  if(k==="pin"){const mapId=f.dataset.map,m=rec("maps",mapId);if(!m)return;const pins=(m.pins||[]).slice();const ref=document.getElementById("pin-ref").value;const [type,rid]=ref?ref.split(":"):["",""];

const COPY_SKIP=new Set(["id","updated","created","at","dmOnly","revealed","img","image","portrait","avatar","color","x","y","w","h"]);
function entryText(type,x,withSecret){
  const out=["# "+(titleOf(type,x)||"Untitled")];
  const show=v=>Array.isArray(v)?v.map(i=>typeof i==="object"&&i?Object.values(i).filter(q=>typeof q==="string"||typeof q==="number").join(" "):String(i)).filter(Boolean).join("; "):typeof v==="object"&&v?"":String(v);
  Object.entries(x).forEach(([k,v])=>{if(COPY_SKIP.has(k)||k==="secret"||k==="title"||k==="name"||v===""||v==null||typeof v==="boolean")return;const t=show(v).trim();if(!t)return;const lab=k.replace(/([A-Z])/g," $1").replace(/^./,c=>c.toUpperCase());out.push(t.includes("\n")?`\n## ${lab}\n${t}`:`${lab}: ${t}`)});
  if(withSecret&&x.secret)out.push("\n## DM secrets\n"+x.secret);
  return out.join("\n")}
async function copyOut(text,msg){try{await navigator.clipboard.writeText(text);toast(msg)}catch(_){toast("Couldn't copy here. Try again from the page itself.")}}
function copyEntry(type,id,withSecret){const x=rec(type,id);if(x)copyOut(entryText(type,x,withSecret),withSecret?"Copied, including DM secrets":"Copied without DM secrets")}
function copyAll(){const skip=new Set(["meta","chats","logs","links"]);const parts=COLS.filter(c=>!skip.has(c)&&ALL[c].length).map(c=>"\n===== "+c.toUpperCase()+" =====\n\n"+ALL[c].map(x=>entryText(c,x,true)).join("\n\n"));copyOut((S.settings.campaign?.name||"Campaign")+"\n"+parts.join("\n"),"Campaign copied, including DM secrets")}
