<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>
.bs-form>:not(.bs-hist-h):not(.bs-hist){display:none!important}

.beat-cl{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.beat-cl li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;line-height:1.4}
.beat-cl input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.beat-cl li.done span{color:var(--muted);text-decoration:line-through}

.cl-add{align-self:flex-start;margin-top:8px}

<title>DM's Desk</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f1812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DM's Desk"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,400;0,500;0,700;1,400&family=Spectral+SC:wght@600;700&family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a leather-bound header over a parchment desk; party members as monster-style stat blocks, quests as sidebar notes, tables in rulebook stripes */
:root{
  --bg:#efe4c9; --paper:#f8efd9; --surface:#fdf6e6; --surface2:#f2e7cb; --block:#fdf1dc;
  --ink:#2a1d14; --muted:#6e5a44; --line:#d6c19a; --stripe:#e0e5c1; --side:#e9ecd2;
  --accent:#7a200d; --accent-ink:#f9ecc9; --accent-soft:#f1dcc6; --gold:#b8913f; --bar:#e69a28;
  --blood:#9b1c12; --blood-soft:#f3d4cb; --ok:#3f6b2a; --ok-soft:#dfe8c8; --warn:#8a5a00; --warn-soft:#f3e2b7;
  --hdr:#2b1510; --hdr2:#40201a; --hdr-ink:#f0dcae;
  --title:"Cinzel","Trajan Pro",Georgia,serif; --display:"Spectral SC","Cinzel",Georgia,serif; --drop:"Cinzel Decorative","Cinzel",Georgia,serif;
  --body:"Spectral","Book Antiqua",Georgia,serif; --ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif; --sc:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --mono:"Alegreya Sans",system-ui,sans-serif; --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16110d; --paper:#1d1611; --surface:#241b15; --surface2:#2c2219; --block:#2a1f17;
  --ink:#eadcc0; --muted:#b3a183; --line:#4b3a2a; --stripe:#2b2f21; --side:#262a1d;
  --accent:#e4876c; --accent-ink:#1d0f0a; --accent-soft:#3b2119; --gold:#d6b36a; --bar:#c27a1c;
  --blood:#f07a64; --blood-soft:#3d1c16; --ok:#a5c47f; --ok-soft:#24301a; --warn:#e3b553; --warn-soft:#352812;
  --hdr:#0f0907; --hdr2:#1e100c; --hdr-ink:#e9cf94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110d; --paper:#1d1611; --surface:#241b15; --surface2:#2c2219; --block:#2a1f17;
  --ink:#eadcc0; --muted:#b3a183; --line:#4b3a2a; --stripe:#2b2f21; --side:#262a1d;
  --accent:#e4876c; --accent-ink:#1d0f0a; --accent-soft:#3b2119; --gold:#d6b36a; --bar:#c27a1c;
  --blood:#f07a64; --blood-soft:#3d1c16; --ok:#a5c47f; --ok-soft:#24301a; --warn:#e3b553; --warn-soft:#352812;
  --hdr:#0f0907; --hdr2:#1e100c; --hdr-ink:#e9cf94; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,var(--paper),transparent 60%),radial-gradient(ellipse at 90% 100%,var(--surface2),transparent 55%);background-attachment:fixed;color:var(--ink);font:17px/1.55 var(--body);margin:0}
button,input,select,textarea{font:inherit;font-family:var(--ui);color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--hdr2),var(--hdr));color:var(--hdr-ink);border-bottom:3px solid var(--gold);box-shadow:0 2px 0 var(--hdr)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.brand small{font:700 12px var(--sc);letter-spacing:.24em;color:var(--gold)}
.brand h1{font:900 32px/1.05 var(--title);margin:2px 0 0;letter-spacing:.04em;text-wrap:balance}
.brand h1 button{all:unset;cursor:pointer;overflow-wrap:anywhere}
.brand h1 button:hover{color:#fff3d1}
.brand h1 button:focus-visible{outline:2px solid var(--gold)}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid var(--gold);border-radius:2px;padding:4px 6px 4px 12px;background:rgba(0,0,0,.25)}
.clock .d{font:600 16px var(--title);white-space:nowrap;letter-spacing:.02em}
.clock .w{color:var(--gold);font:500 14px var(--sc);white-space:nowrap;letter-spacing:.04em}
.clock .btn{background:transparent;color:var(--hdr-ink);border-color:rgba(214,179,106,.5)}
.clock .btn:hover{border-color:var(--gold);background:rgba(214,179,106,.15)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 16px 8px;text-decoration:none;color:var(--hdr-ink);opacity:.7;font:700 15px var(--sc);letter-spacing:.1em;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
nav.tabs a:hover{opacity:1}
nav.tabs a[aria-current="page"]{opacity:1;color:#fff3d1;border-bottom-color:var(--bar)}
nav.tabs a .n{font:500 12px var(--ui);margin-left:5px;opacity:.8}

main{padding-block:26px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.bar h2{font:700 30px/1.05 var(--display);color:var(--accent);margin:0 auto 0 0;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;color:var(--muted);font:700 14px var(--sc);letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:var(--r);cursor:pointer;font:700 14px var(--sc);letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--blood)}
.btn.danger.armed{background:var(--blood);color:var(--surface);border-color:var(--blood)}
.btn.sm{padding:1px 9px;font-size:13px}
.icon{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;font-family:var(--ui)}
input.search,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;min-width:0}
.fmtbar{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:var(--surface2);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.fmt{border:1px solid transparent;background:none;color:var(--ink);padding:3px 10px;border-radius:var(--r);cursor:pointer;font:700 14px var(--sc);letter-spacing:.04em;min-height:32px}
.fmt:hover{background:var(--accent-soft);color:var(--accent)}
.fmt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fmt b,.fmt i{font-family:var(--body);font-size:16px}
.rte{border:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:10px 12px;min-height:140px;max-height:60vh;overflow:auto;font:16px/1.5 var(--body);outline:none;overflow-wrap:anywhere}
.rte.tall{min-height:320px}
.rte:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rte:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}
.rte p{margin:0 0 10px}
.rte h4{font:700 19px var(--display);color:var(--accent);margin:12px 0 4px;border-bottom:1px solid var(--gold)}
.rte ul{margin:0 0 10px;padding-left:22px}
.rte b,.rte strong{color:var(--accent)}
input.search{width:230px;max-width:100%}
.label{font:700 13px var(--sc);letter-spacing:.12em;color:var(--accent)}
.empty{border:1px dashed var(--gold);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);font-style:italic;background:var(--paper)}
.mono{font-family:var(--ui);font-variant-numeric:lining-nums tabular-nums}
.pill{display:inline-block;font:700 12px var(--sc);letter-spacing:.08em;padding:1px 8px;border-radius:2px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);vertical-align:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--blood-soft);color:var(--blood);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;border-radius:var(--r);margin-bottom:16px}
.section-h{font:700 20px var(--display);color:var(--accent);margin:0 0 10px;border-bottom:1px solid var(--gold);padding-bottom:2px}

/* Party: stat blocks */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:32px}
.pc{background:var(--block);border-top:5px solid var(--bar);border-bottom:5px solid var(--bar);box-shadow:0 0 0 1px var(--line),0 3px 8px rgba(40,20,5,.15);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc h3{margin:0;font:700 22px/1.15 var(--display);color:var(--accent);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.pc h3:hover{text-decoration:underline;text-decoration-thickness:1px}
.pc .sub{font-style:italic;color:var(--ink);font-size:15px;line-height:1.3}
.taper{height:5px;background:var(--accent);clip-path:polygon(0 50%,0 0,100% 50%,0 100%);margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.stat b{display:block;font:500 21px/1.15 var(--ui);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.stat span{font:800 12px var(--sc);letter-spacing:.08em;color:var(--accent)}
.hp{display:flex;align-items:center;gap:6px}
.hpbar{flex:1;height:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.hpbar i.mid{background:var(--warn)} .hpbar i.low{background:var(--blood)}
.pcnote{font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcnote b{color:var(--accent);font-style:italic}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-family:var(--ui);font-size:16px}
th,td{text-align:left;padding:6px 10px;vertical-align:top}
th{font:800 14px var(--sc);letter-spacing:.06em;color:var(--ink);border-bottom:1px solid var(--ink)}
tbody tr:nth-child(odd) td{background:var(--stripe)}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--accent-soft)}
td b{font-family:var(--body)}
td .clip{display:block;max-width:320px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Notes: a page of the tome */
.notes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.nlist{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);max-height:72vh;overflow:auto}
.nitem{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.nitem:hover{background:var(--surface2)}
.nitem[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.nitem b{font:600 16px/1.25 var(--body);overflow-wrap:anywhere}
.nitem small{color:var(--muted);font:500 13px var(--sc);letter-spacing:.04em}
.reader{background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 14px rgba(40,20,5,.12);padding:26px 32px;min-width:0}
.reader h3.t{font:700 34px/1.1 var(--display);color:var(--accent);margin:6px 0 2px;text-wrap:balance;padding-bottom:4px;border-bottom:2px solid var(--gold)}
.reader .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font:500 14px var(--sc);letter-spacing:.04em;margin-bottom:6px}
.prose{max-width:68ch;overflow-wrap:anywhere;margin-top:14px}
.prose > p:first-child::first-letter{font:700 3.3em/.85 var(--drop);color:var(--accent);float:left;margin:.06em .08em 0 0}
.prose h4{font:700 20px var(--display);color:var(--accent);margin:20px 0 4px;border-bottom:1px solid var(--gold)}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px;padding-left:22px}
.prose b{color:var(--accent)}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h3{font:700 30px/1 var(--display);color:var(--accent);margin:0;min-width:200px}
.calgrid-wrap{overflow-x:auto}
.calgrid{display:grid;gap:3px;min-width:560px}
.dow{font:800 12px var(--sc);letter-spacing:.08em;color:var(--accent);text-align:center;padding:4px 0;border-bottom:1px solid var(--ink)}
.day{background:var(--paper);border:1px solid var(--line);min-height:80px;padding:4px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;border-radius:0}
.day:hover{border-color:var(--accent)}
.day .num{font:500 14px var(--ui);color:var(--muted)}
.day.today{border:2px solid var(--accent);background:var(--accent-soft)}
.day.today .num{color:var(--accent);font-weight:700}
.day.past{background:var(--surface2);opacity:.85}
.ev{font:500 13px/1.25 var(--ui);padding:1px 5px;background:var(--accent-soft);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--accent)}
.ev.k-session{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.ev.k-deadline{background:var(--blood-soft);color:var(--blood);border-color:var(--blood)}
.ev.k-festival{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.side{background:var(--side);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.side h4{margin:0;font:700 20px var(--display);color:var(--ink)}
.up{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;cursor:pointer}
.up:first-of-type{border-top:0;padding-top:0}
.up .in{font:700 13px var(--sc);color:var(--accent);min-width:48px}
.up div{min-width:0}
.up small{display:block;color:var(--muted);font:400 13px var(--ui)}

/* Quests: sidebar notes */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{margin:0;font:800 15px var(--sc);letter-spacing:.1em;color:var(--accent);display:flex;justify-content:space-between;border-bottom:1px solid var(--gold);padding-bottom:2px}
.q{background:var(--side);border:0;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;font-family:var(--body)}
.q:hover{background:var(--accent-soft)}
.q b{font:700 17px/1.2 var(--display);color:var(--ink);overflow-wrap:anywhere}
.q small{color:var(--muted);font-size:14px;font-family:var(--ui);overflow-wrap:anywhere}
.q.s-active{border-top-color:var(--accent);border-bottom-color:var(--accent)} .q.s-completed{opacity:.75} .q.s-failed{opacity:.6}

/* Sheet (forms) */
.scrim{position:fixed;inset:0;background:rgba(20,10,5,.55);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--paper);width:min(520px,100%);height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px;border-left:4px solid var(--bar)}
.sheet h2{font:700 28px/1.1 var(--display);color:var(--accent);margin:0;border-bottom:2px solid var(--gold);padding-bottom:4px}
.sheet form p,.sheet > p{font-style:italic}
.vblock{display:flex;flex-direction:column;gap:8px}
.vblock h2{border-bottom:0;padding-bottom:0;overflow-wrap:anywhere}
.vsub{font-style:italic;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prop{font-size:16px;line-height:1.4}
.prop b{color:var(--accent);font-style:italic}
.vprose{margin-top:4px}
.vprose > p:first-child::first-letter{font:inherit;color:inherit;float:none;margin:0}
.vempty{color:var(--muted);font-style:italic;margin:0}
.props{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.prop.none{color:var(--muted)}
.vh{margin:2px 0 0;font:700 19px var(--display);color:var(--accent)}
.vblock .stat b{font-size:19px}
@media (max-width:420px){.props{grid-template-columns:minmax(0,1fr)}}

.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:3px;grid-column:span 6;min-width:0}
.field.s2{grid-column:span 2} .field.s3{grid-column:span 3}
.field textarea{min-height:110px;resize:vertical;line-height:1.45;font-family:var(--body)}
.field textarea.tall{min-height:300px}
.field .hint{font:400 13px var(--ui);color:var(--muted)}
.check{flex-direction:row;align-items:center;gap:8px}
.sheet .foot{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.sheet .foot .grow{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--hdr);color:var(--hdr-ink);border:1px solid var(--gold);padding:7px 16px;border-radius:2px;z-index:30;font:500 15px var(--ui);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .notes,.cal-layout{grid-template-columns:minmax(0,1fr)}
  .nlist{max-height:260px}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .board{grid-template-columns:minmax(0,1fr)}
  .field.s2,.field.s3{grid-column:span 3}
  .reader{padding:18px}
  .brand h1{font-size:26px}
}
/* Phone-only pieces, hidden on wide screens */
.npc-list,.agenda,.qtabs,.reader .back{display:none}
.day.sel{outline:2px solid var(--gold);outline-offset:-2px}
@media (max-width:640px){
  body{font-size:16px}
  header.top{position:static}
  body::before{background:var(--hdr)}
  .topbar{padding-block:10px 10px;gap:8px}
  .brand small{display:none}
  .brand{flex:1 1 0}
  .gsearch{padding:0;width:44px;height:44px;justify-content:center;flex:0 0 44px}
  .gsearch .gs-l,.gsearch kbd{display:none}
  .gsearch svg{width:20px;height:20px}
  .brand h1{font-size:24px}
  .clock{width:100%;border-radius:2px;padding:6px 8px 6px 10px;row-gap:4px}
  .clock .d{font-size:15px;flex:1 0 100%}
  .clock .btn{flex:1 1 auto}
  .clock .icon{flex:0 0 36px}
  .clock .w{display:none}
  .clock .btn{min-height:36px}
  .clock .icon{width:36px;height:36px}
  /* tab bar moves to the bottom of the screen */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--hdr);border-top:2px solid var(--gold);gap:0;
    padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  nav.tabs a{flex:1 1 0;text-align:center;padding:12px 2px 13px;font-size:13px;letter-spacing:.06em;margin:0;border-bottom:0;border-top:3px solid transparent;margin-top:-2px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1}
  nav.tabs a[aria-current="page"]{border-top-color:var(--bar);border-bottom:0;background:rgba(255,255,255,.04)}
  nav.tabs a .n{margin:2px 0 0;font-size:11px;min-height:12px}
  main{padding-block:16px calc(88px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}

  .bar{gap:8px;margin-bottom:14px}
  .bar h2{flex:1 0 100%;font-size:26px}
  .bar input.search,.bar select.search{flex:1 1 100%;width:100%!important;min-height:42px;font-size:16px}
  .bar .btn{flex:1 1 auto;min-height:42px}
  .bar .seg{flex:1 1 100%}
  .seg button{flex:1;min-height:40px}
  .btn{min-height:40px}
  .btn.sm{min-height:36px;padding:2px 12px}
  .icon{width:40px;height:40px}

  .pcs{grid-template-columns:minmax(0,1fr);gap:14px}
  .table-wrap{display:none}
  .npc-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)}
  .npc{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:11px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%;font-family:var(--body)}
  .npc:nth-child(odd){background:var(--stripe)}
  .npc-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .npc-top b{font-size:17px;overflow-wrap:anywhere}
  .npc small{color:var(--muted);font:400 14px var(--ui);overflow-wrap:anywhere}
  .npc small.npc-role{color:var(--ink);font-style:italic;font-family:var(--body)}

  .notes{display:block}
  .nlist{max-height:none;overflow:visible}
  .nitem{padding:12px}
  .notes.reading .nlist{display:none}
  .notes:not(.reading) .reader{display:none}
  .reader{padding:14px 16px 20px}
  .reader .back{display:inline-block;margin-bottom:10px}
  .reader h3.t{font-size:28px}

  .cal-head h3{min-width:0;flex:1;font-size:24px;text-align:center}
  .cal-head .btn.sm{flex:1 0 100%}
  .calgrid{min-width:0;gap:2px}
  .dow{font-size:10px;letter-spacing:0}
  .day{min-height:44px;padding:3px;align-items:center;gap:2px}
  .day .ev,.day > .num + .num{display:none}
  .day.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .hint-d{display:none}
  .agenda{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .ag-sel{background:var(--paper);border:1px solid var(--gold);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .ag-selh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .ag-selh b{font-family:var(--display);color:var(--accent);font-size:18px}
  .ag-h{margin:8px 0 0;font:700 18px var(--display);color:var(--accent);border-bottom:1px solid var(--gold)}
  .ag{display:flex;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:8px 2px;cursor:pointer;width:100%;font-family:var(--body)}
  .ag-d{font:700 18px var(--ui);color:var(--accent);min-width:28px;text-align:center}
  .ag-t{display:flex;flex-direction:column;min-width:0}
  .ag-t b{overflow-wrap:anywhere}
  .ag-t small{color:var(--muted);font:400 13px var(--ui)}

  .qtabs{display:flex;width:100%;margin-bottom:12px}
  .qtabs button{padding:6px 2px;font-size:12px;letter-spacing:.02em;white-space:nowrap}
  .board{grid-template-columns:minmax(0,1fr)}
  .col.hide-m{display:none}
  .col h3{display:none}

  .scrim{background:var(--paper)}
  .sheet{border-left:0;padding-bottom:0}
  .sheet .foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto}
  .sheet .foot .btn{min-height:44px;flex:1}
  .sheet .foot .grow{flex:1;display:flex}
  .sheet .foot .grow:empty{display:none}
  .sheet .foot .grow .btn{width:100%}
  .field input,.field select,.field textarea{font-size:16px;min-height:42px}
  .field.s2,.field.s3{grid-column:span 3}
}

.gsearch{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:1px solid rgba(214,179,106,.5);color:var(--hdr-ink);border-radius:2px;padding:7px 10px 7px 12px;cursor:pointer;font:500 15px var(--ui);min-width:0}
.gsearch:hover{border-color:var(--gold);background:rgba(214,179,106,.15)}
.gsearch kbd{font:700 12px var(--ui);border:1px solid rgba(214,179,106,.5);border-radius:2px;padding:0 6px;color:var(--gold)}
.gs-sheet{width:min(640px,100%)}
.gs-in{width:100%;border:2px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:10px 12px;font:17px var(--ui);min-height:46px}
.gs-res{display:flex;flex-direction:column;gap:14px}
.gs-grp h3{margin:0 0 4px;font:700 18px var(--display);color:var(--accent);border-bottom:1px solid var(--gold);display:flex;justify-content:space-between}
.gs-grp h3 span{font:500 13px var(--ui);color:var(--muted)}
.gs-hit{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 4px;cursor:pointer;font-family:var(--body)}
.gs-hit:hover,.gs-hit:focus-visible{background:var(--accent-soft)}
.gs-hit b{font-size:17px;overflow-wrap:anywhere}
.gs-hit small{color:var(--muted);font:500 13px var(--sc);letter-spacing:.04em}
.gs-hit .snip{font-size:15px;color:var(--ink);overflow-wrap:anywhere}
mark{background:var(--warn-soft);color:var(--ink);padding:0 1px;border-radius:2px}
html.locked,html.locked body{overflow:hidden}
.scrim{overscroll-behavior:contain}
.sheet{overscroll-behavior:contain}.rte{overscroll-behavior:auto}
/* ---- relationship tones (shared by graph + labels) ---- */
:root{--rel-ok:var(--ok);--rel-bad:var(--blood);--rel-acc:#a0367a;--rel-gold:var(--gold);--rel-warn:var(--warn);--rel-muted:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rel-acc:#e58ac8}}
:root[data-theme="dark"]{--rel-acc:#e58ac8}
body.player .dm-only{display:none!important}
.hidden{display:none!important}
.preview-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hdr);color:var(--hdr-ink);border:1px solid var(--gold);padding:8px 14px;margin-bottom:16px;font:500 15px var(--ui)}
.preview-bar .btn{background:transparent;color:var(--hdr-ink);border-color:var(--gold)}

/* avatars */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block;background:var(--surface2);border:2px solid var(--gold)}
.av-i{display:inline-grid;place-items:center;font:700 14px var(--title);color:var(--accent);background:var(--accent-soft)}
.pc .hd-l{display:flex;gap:10px;align-items:flex-start;min-width:0}
.v-hero{display:flex;gap:16px;align-items:center}
.v-hero .av{width:96px!important;height:96px!important;font-size:34px!important}
.v-hero > div{min-width:0}
.namecell{display:flex;align-items:center;gap:8px}
.img-field .img-prev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-field img{max-width:160px;max-height:120px;border:1px solid var(--line);border-radius:var(--r);object-fit:cover}
.note-img{max-width:100%;max-height:420px;object-fit:contain;border:1px solid var(--line);margin:8px 0;display:block}

/* links */
a.xref{color:var(--accent);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
a.xref:hover{text-decoration-color:var(--accent);background:var(--accent-soft)}
.bl,.pinlist{display:flex;flex-direction:column}
.bl-i{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:7px 2px;cursor:pointer;font-family:var(--body);width:100%}
.bl-i:hover{background:var(--accent-soft)}
.bl-i small{color:var(--muted);font:500 13px var(--sc);letter-spacing:.04em}
.secret{background:var(--blood-soft);border:1px dashed var(--blood);padding:10px 14px;border-radius:var(--r)}
.secret-h{font:800 13px var(--sc);letter-spacing:.12em;color:var(--blood);margin-bottom:4px}
.secret p{margin:0 0 8px}
.pill.dmp{background:var(--hdr);color:var(--hdr-ink);border-color:var(--gold)}
.rels{display:flex;flex-direction:column;gap:2px}
.rel-i{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:5px 2px;cursor:pointer;font-family:var(--body);width:100%;border-bottom:1px solid var(--line)}
.rel-i:hover{background:var(--accent-soft)}
.rel-i span{display:flex;flex-direction:column;min-width:0}
.rel-i small{color:var(--muted);font:400 14px var(--ui)}
.tone{font:700 13px var(--sc);letter-spacing:.04em}
.t-ok{color:var(--rel-ok)} .t-bad{color:var(--rel-bad)} .t-acc{color:var(--rel-acc)} .t-gold{color:var(--rel-gold)} .t-warn{color:var(--rel-warn)} .t-muted{color:var(--rel-muted)}
.carry{margin:0;padding-left:20px}

/* faction block */
.facblock{background:var(--side);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:10px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin:10px 0}
.facblock .full{grid-column:1/-1}
@media (max-width:520px){.facblock{grid-template-columns:minmax(0,1fr)}}

/* world */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.mapcard{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper);padding:0;cursor:pointer;text-align:left;font-family:var(--body);overflow:hidden;box-shadow:0 3px 8px rgba(40,20,5,.12)}
.mapcard img,.mapph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.mapph{display:grid;place-items:center;color:var(--muted);font-style:italic}
.mapph.big{aspect-ratio:16/9}
.mc-t{padding:8px 12px;display:flex;flex-direction:column}
.mc-t small{color:var(--muted);font:500 13px var(--sc)}
.sheet.wide{width:min(1100px,100%)}
.map-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:4px}
.map-head h2{border:0;padding:0}
.map-head .grow{flex:1}
.hint-p{margin:0;color:var(--muted);font:400 14px var(--ui)}
.map-view{overflow:auto;border:1px solid var(--line);background:var(--surface2);max-height:72vh;overscroll-behavior:contain}
.map-inner{position:relative;min-width:100%}
.map-inner img{display:block;width:100%;height:auto;user-select:none}
.map-inner.editing{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pin-dot{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid var(--accent-ink);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pin-l{order:-1;font:700 12px var(--ui);background:var(--hdr);color:var(--hdr-ink);padding:1px 6px;border-radius:2px;margin-bottom:4px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.pin:hover .pin-dot,.pin:focus-visible .pin-dot{background:var(--bar)}
.graph-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
.graph{display:block;width:100%;min-width:640px;height:auto}
.graph .node{cursor:pointer}
.graph .node:hover circle,.graph .node:focus circle{stroke:var(--bar);stroke-width:4}
.graph .ni{font:700 15px var(--title);fill:var(--accent)}
.graph .nl{font:600 13px var(--ui);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.graph .edge{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font:500 14px var(--ui);color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.ring{width:14px;height:14px;border-radius:50%;border:3px solid var(--bar);background:none}
.rel-list{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.rel-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 4px;cursor:pointer;font-family:var(--body)}
.rel-row:nth-child(odd){background:var(--stripe)}
.rel-row:hover{background:var(--accent-soft)}
.rel-row small{color:var(--muted);font:400 14px var(--ui)}
@media (max-width:640px){.rel-row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.rel-row small{grid-column:1/-1}}

/* treasury */
.treasury{background:var(--block);border:1px solid var(--line);padding:12px 14px;margin-bottom:32px;display:flex;flex-direction:column;gap:10px}
.purse{display:flex;flex-wrap:wrap;gap:8px}
.coin{display:flex;align-items:center;gap:6px;border:1px solid var(--gold);background:var(--paper);padding:3px 4px 3px 10px;border-radius:999px}
.coin span{font:800 13px var(--sc);color:var(--accent)}
.coin input{width:72px;border:0;background:var(--surface);border-radius:999px;padding:3px 8px;text-align:right;font:600 15px var(--ui);font-variant-numeric:tabular-nums}
.coin b{font:600 15px var(--ui);padding-right:8px}
.loot-head{display:flex;justify-content:space-between;align-items:center}
.loot{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.loot-i{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);padding:8px 10px;cursor:pointer;font-family:var(--body);min-width:0}
.loot-i:hover{border-color:var(--accent)}
.loot-i small{color:var(--muted);font:500 13px var(--sc)}
.li-d{font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* prep */
.prep{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.prep-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.plan{background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 14px rgba(40,20,5,.12);padding:18px 22px}
.plan-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:10px}
.plan-h h3{margin:0;font:700 28px/1.1 var(--display);color:var(--accent)}
.plan-acts{display:flex;gap:6px;flex-wrap:wrap}
.pl-s h4{font:700 19px var(--display);color:var(--accent);margin:14px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);background:var(--surface);border-radius:999px;padding:2px 10px 2px 3px;cursor:pointer;font:500 14px var(--ui)}
.chip:hover{background:var(--accent-soft)}
.chip .av{border-width:1px}
details.past summary,.threads details summary{cursor:pointer;font:700 15px var(--sc);color:var(--accent);letter-spacing:.06em;padding:6px 0}
.threads{position:static}
.threads h4{display:flex;align-items:baseline;gap:8px}
.threads h4 .mono{font-size:15px;color:var(--muted)}
.tq{display:flex;gap:6px}
.tq input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px}
.th{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:7px}
.th input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.th-t{border:0;background:none;text-align:left;padding:0;cursor:pointer;font:15px/1.4 var(--body);color:var(--ink);display:flex;flex-direction:column;min-width:0}
.th-t small{color:var(--muted);font:400 13px var(--ui)}
.th.done .th-t{text-decoration:line-through;color:var(--muted)}
.tools{background:var(--block);border:1px solid var(--line);border-top:5px solid var(--bar);padding:14px 16px}
.tools-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools-h h3{margin:0;font:700 22px var(--display);color:var(--accent)}
.tool{display:flex;flex-direction:column;gap:10px}
.tool-d{margin:0;color:var(--muted);font:400 15px var(--ui)}
.tool textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font:15px/1.45 var(--ui);resize:vertical}
.tool-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:default}
.ai-out{background:var(--paper);border:1px solid var(--gold);padding:12px 16px}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:var(--r);max-width:92%}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);font:500 15px var(--ui)}
.msg.assistant{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
.askf{display:flex;gap:6px;flex-wrap:wrap}
.askf input{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font:16px var(--ui)}
.genk{flex-wrap:wrap}
.gen-card{background:var(--paper);border:1px solid var(--gold);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.gen-card h4{margin:0;font:700 22px var(--display);color:var(--accent)}
.gen-card p{margin:0}
.names{columns:2;margin:0}
textarea.bk{width:100%;min-height:160px;font:12px var(--ui)}
@media (max-width:860px){.prep{grid-template-columns:minmax(0,1fr)}.threads{position:static;max-height:none}}
@media (max-width:640px){
  nav.tabs a{font-size:11px;letter-spacing:.02em;padding-inline:0}
  nav.tabs a .full{display:none}
  .plan{padding:14px}
  .tools-h .seg{width:100%}.tools-h .seg button{flex:1;font-size:12px;padding-inline:4px}

}

.navback{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:none;min-height:30px}
.reader-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.reader .reader-nav .back{margin-bottom:0}
@media (min-width:641px){.reader-nav:not(:has(.navback)){display:none}}
.rc-status > span:last-child{font:15px/1.4 var(--body);padding-top:4px}
/* ---- round 2 ---- */
.muted{color:var(--muted)}
.nextgame{font:600 14px var(--ui);color:var(--hdr-ink);border:1px dashed rgba(214,179,106,.6);padding:5px 10px;border-radius:2px;white-space:nowrap}
.nextgame:empty{display:none}
.tm-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bar);color:var(--hdr);border:1px solid var(--gold);border-radius:2px;padding:7px 12px;cursor:pointer;font:800 14px var(--sc);letter-spacing:.06em}
.tm-btn:hover{filter:brightness(1.08)}
.sub-tabs{margin-bottom:16px}
.sub-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.plain-ta{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font:15px/1.45 var(--ui);resize:vertical;min-height:110px}
.plain-ta.tall{min-height:300px}

/* encounters */
.enc-party{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--side);padding:8px 12px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.enc-party input{width:60px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:4px 8px;margin-left:4px}
.enc-rows{display:flex;flex-direction:column;gap:6px}
.enc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto 90px auto;gap:8px;align-items:center}

.cs-tabs button{flex:1 0 auto;border:0;background:none;padding:8px 12px;font:700 13px var(--sc);letter-spacing:.04em;color:var(--muted);cursor:pointer;white-space:nowrap}
.cs-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.cs-body{padding:12px}
.cs-ab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cs-abx{display:flex;flex-direction:column;gap:4px}
.cs-roll{cursor:pointer;font-family:var(--ui)}
.cs-abm{display:flex;flex-direction:column;align-items:center;border:2px solid var(--gold);background:var(--paper);border-radius:8px;padding:5px 2px 4px;color:var(--ink)}
.cs-abm span{font:800 11px var(--ui);letter-spacing:.08em;color:var(--accent)}
.cs-abm b{font:700 22px/1.1 var(--display)}
.cs-abm small{font:600 12px var(--ui);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 7px;background:var(--surface)}
.cs-abm:hover,.cs-save:hover,.cs-skb:hover,.cs-qb.cs-roll:hover{border-color:var(--accent);background:var(--accent-soft)}
.cs-save{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:3px 0;font:600 12px var(--ui);color:var(--muted)}
.cs-save.on{color:var(--accent);border-color:var(--accent);font-weight:800}
.cs-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin-top:8px}
.cs-pass span{font-size:10px;text-align:center;line-height:1.2}
.cs-qb{flex:1;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:4px 2px}
.cs-qb span{font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cs-qb b{font:700 18px var(--ui);color:var(--ink)}
.cs-h{margin:14px 0 6px;font:700 15px var(--display);color:var(--accent);border-bottom:1px solid var(--gold)}
.cs-sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px}
.cs-skb{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:4px 8px;color:var(--ink);text-align:left}
.cs-skb span{font:500 14px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-skb small{font:600 10px var(--ui);color:var(--muted)}
.cs-skb b{font:700 15px var(--ui);min-width:26px;text-align:right}
.cs-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.cs-skb.proficient .cs-dot{background:var(--accent);border-color:var(--accent)}
.cs-skb.expertise .cs-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--accent)}
.cs-skb.proficient b,.cs-skb.expertise b{color:var(--accent)}
.cs-txt{margin:2px 0 4px;font:400 14px/1.45 var(--ui);color:var(--ink)}
.cs-basics{font-size:15px}
.cs-feats{display:flex;flex-direction:column;gap:4px}
.cs-feat{border:1px solid var(--line);background:var(--paper);border-radius:var(--r)}
.cs-feat summary{cursor:pointer;padding:6px 10px;display:flex;gap:8px;align-items:baseline;list-style:none}
.cs-feat summary::-webkit-details-marker{display:none}
.cs-feat summary::before{content:"▸";color:var(--muted);font-size:12px}
.cs-feat[open] summary::before{content:"▾"}
.cs-feat summary b{font:700 14px var(--ui)}
.cs-feat summary small{font:500 12px var(--ui);color:var(--muted)}
.cs-feat .prose{padding:0 12px 8px 26px;font-size:15px}
.cs-spells{display:flex;flex-wrap:wrap;gap:5px}
.cs-spell{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:3px 10px;font:500 13px var(--ui)}
.cs-inv{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px}
.cs-inv li{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:4px 8px;font:500 14px var(--ui)}
.cs-inv li span{flex:1;min-width:0}
.cs-inv li.eq{border-left:3px solid var(--accent)}
.cs-inv em{font:600 11px var(--ui);font-style:normal;color:var(--accent)}
.cs-inv em.att{color:var(--ok)}
.cs-cur{margin-top:8px}
.cs-src{padding:6px 12px;border-top:1px solid var(--line);font:500 12px var(--ui);color:var(--muted)}
.csheet .prose > p:first-child::first-letter,.csheet .vprose > p:first-child::first-letter{float:none;font:inherit;color:inherit;margin:0;padding:0;line-height:inherit;initial-letter:normal}
.stats.two{grid-template-columns:repeat(2,1fr)}
.pc-pass{margin:6px 0 2px;text-align:center}.pc-pass-h{font:700 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}.pc-pass-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pc-pass-g div{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 0}.pc-pass-g b{font:600 17px var(--ui);color:var(--ink)}.pc-pass-g span{font:600 10px var(--ui);color:var(--muted);letter-spacing:.02em}
.linkish{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.ccond{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.ccond span{background:var(--blood);color:#fff;border-radius:10px;padding:0 7px;font:600 11px var(--ui)}
@media (max-width:640px){.cs-ab{grid-template-columns:repeat(3,minmax(0,1fr))}.stats.hp-int{grid-template-columns:1fr 1fr}.stats.hp-int .stat-hp{grid-column:1/-1;order:-1}}
/* ---- round 6 ---- */

.pin-body{flex:1;overflow:auto;padding:12px 14px 30px;overscroll-behavior:contain}

.dockbtn{display:inline-flex;align-items:center;gap:6px}

#qnote{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:27;width:min(520px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--gold);border-top:4px solid var(--accent);box-shadow:0 12px 30px rgba(0,0,0,.35);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-family:var(--ui)}

.dcl{display:flex;flex-wrap:wrap;gap:4px}

.lootq{display:flex;gap:6px;margin-bottom:6px}
.lootq input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:6px 8px;font:500 15px var(--ui)}

.pstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-width:1500px;margin:0 auto 16px}
.ps{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--bar);padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}

.ps-n span{font:700 13px var(--ui);color:var(--accent);border:1px solid var(--gold);border-radius:4px;padding:0 6px}

.tm-keep .pin-body{max-height:70vh;padding:8px 0 0}
.hdr-ico{padding:0;width:38px;justify-content:center}
@media (min-width:641px){.hdr-ico,.style-btn{height:34px;padding:0;width:38px;justify-content:center}}

/* ---- expand / collapse ---- */
.cz{cursor:pointer;user-select:none;position:relative}
.cz::after{content:"";display:inline-block;width:.42em;height:.42em;margin-left:.45em;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-.2em) rotate(45deg);opacity:.45;transition:transform .15s}

.cz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cz-hide{display:none!important}
.cz.cz-shut{margin-bottom:0}
.czall{display:inline-flex;gap:4px}

<script>
const HARPTOS=["Hammer","Alturiak","Ches","Tarsakh","Mirtul","Kythorn","Flamerule","Eleasis","Eleint","Marpenoth","Uktar","Nightal"];
const DEFAULT_CAL={months:HARPTOS.map(n=>({name:n,days:30})),weekdays:["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th"],weekName:"tenday",era:"DR",today:{y:1492,m:0,d:1}};
const NOTE_CATS={session:"Session recap",location:"Location",faction:"Faction",lore:"Lore",monster:"Monster",shop:"Shop & inn",item:"Item",plot:"Plot hook",rules:"Rules & rulings",other:"Other"};
const QSTAT={active:"Active",rumor:"Rumor",completed:"Completed",failed:"Failed"};
const EVKIND={session:"Session",festival:"Festival",deadline:"Deadline",travel:"Travel",event:"Event"};
const TABS=[["home","Party page","Party"],["party","Characters","Cast"],["notes","Notes","Notes"],["quests","Quests","Quests"],["calendar","Calendar","Calendar"],["world","World","World"],["prep","Prep","Prep"]];

const S={characters:[],notes:[],quests:[],events:[],threads:[],plans:[],links:[],loot:[],maps:[],logs:[],encounters:[],tables:[],clocks:[],chats:[],meta:[],monsters:[],todos:[],settings:{},loaded:false,live:false};
const U={tab:"party",charFilter:"all",charQ:"",noteSel:null,noteQ:"",noteCat:"all",calY:null,calM:null,noteReading:false,calSel:null,questTab:"active",preview:false,prepTab:"plan",calView:"month",tableSel:null,worldTab:"maps",toolTab:"recap",planSel:null};
const isPhone=()=>window.matchMedia("(max-width:640px)").matches;
let db=null;

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseInt(v,10);return Number.isFinite(n)?n:null};
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}

function cal(){const c=S.settings.calendar||{};return{...DEFAULT_CAL,...c,months:(c.months&&c.months.length?c.months:DEFAULT_CAL.months),weekdays:(c.weekdays&&c.weekdays.length?c.weekdays:DEFAULT_CAL.weekdays),today:c.today||DEFAULT_CAL.today}}
const yearLen=c=>c.months.reduce((a,m)=>a+m.days,0);
/* a month can carry a leap day: leapEvery N years, counted from leapOffset (Shieldmeet after Midsummer) */
const isLeap=(mo,y)=>!!(mo&&mo.leapEvery)&&(((y-(mo.leapOffset||0))%mo.leapEvery)+mo.leapEvery)%mo.leapEvery===0;
const monthDays=(c,y,m)=>{const mo=c.months[m];return mo?mo.days+(isLeap(mo,y)?1:0):30};
function daysBeforeYear(c,y){let n=y*yearLen(c);c.months.forEach(mo=>{if(mo.leapEvery){const E=mo.leapEvery,o=mo.leapOffset||0;n+=Math.floor((y-1-o)/E)-Math.floor((-1-o)/E)}});return n}
function toIdx(c,{y,m,d}){let i=daysBeforeYear(c,y);for(let k=0;k<m;k++)i+=monthDays(c,y,k);return i+(d-1)}
function fromIdx(c,i){const avg=yearLen(c)+c.months.reduce((a,mo)=>a+(mo.leapEvery?1/mo.leapEvery:0),0);let y=Math.floor(i/avg);while(daysBeforeYear(c,y)>i)y--;while(daysBeforeYear(c,y+1)<=i)y++;let r=i-daysBeforeYear(c,y),m=0;while(m<c.months.length-1&&r>=monthDays(c,y,m)){r-=monthDays(c,y,m);m++}return{y,m,d:r+1}}
/* moons: phase 0 = new, 0.5 = full */
const MOON_ICONS=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"],MOON_NAMES=["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"];
function moonPhase(mo,idx){const f=((idx-(mo.shift||0))/mo.cycle)%1;return f<0?f+1:f}
const moonStep=(mo,idx)=>Math.floor(moonPhase(mo,idx)*8+0.5)%8;
/* seasons: a repeating cycle over the average year (leap days included), shifted by seasonOffset days from the first day of the year */
const avgYear=c=>yearLen(c)+c.months.reduce((a,mo)=>a+(mo.leapEvery?1/mo.leapEvery:0),0);
function seasonAt(c,idx){const ss=(c.seasons||[]).filter(x=>x&&x.length>0);if(!ss.length)return null;const Y=avgYear(c);let pos=((idx-(c.seasonOffset||0))%Y+Y)%Y;for(let i=0;i<ss.length;i++){if(pos<ss[i].length||i===ss.length-1)return {i,s:ss[i],pos,frac:pos/ss[i].length};pos-=ss[i].length}return null}
/* solstices, equinoxes and season starts that fall on a day */
function naturalOn(c,idx){const a=seasonAt(c,idx),b=seasonAt(c,idx-1);if(!a||!b)return [];const out=[];
  if(a.i!==b.i)out.push(a.s.start||`${a.s.name} begins`);
  else if(a.s.mid&&a.frac>=0.5&&b.frac<0.5)out.push(a.s.mid);
  return out}
function naturalUpcoming(c,from,n){const out=[];for(let i=from;i<from+Math.ceil(avgYear(c))+2&&out.length<n;i++)naturalOn(c,i).forEach(t=>out.push({t,i}));return out}
function weekdayText(c,dt){const mo=c.months[dt.m];if(mo&&mo.festival)return `${mo.name}, a festival day`;const i=wd(c,dt);if(i<0)return "";const w=c.weekdays[i];const W=["First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth"];return /^[IVXLC]+$/.test(w)?`${W[i]||ord(i+1)} day of the ${c.weekName}`:`${w} day of the ${c.weekName}`}
const wd=(c,dt)=>{const n=c.weekdays.length;if(c.months[dt.m]?.festival)return -1;if(c.overflow===false)return (dt.d-1)%n;return ((toIdx(c,dt)%n)+n)%n};
const fmtDate=(c,dt)=>dt?`${ord(dt.d)} of ${c.months[dt.m]?.name??"?"}, ${dt.y}${c.era?" "+c.era:""}`:"";
const shortDate=(c,dt)=>`${dt.d} ${(c.months[dt.m]?.name||"?").replace(/^The /,"")}`;

/* ================= data layer: public + DM-only stores ================= */
const COLS=["characters","notes","quests","events","threads","plans","links","loot","maps","logs","encounters","tables","clocks","chats","meta","monsters","todos"];
const ALWAYS_DM=new Set(["threads","plans","logs","encounters","tables","chats","meta","monsters","todos"]);
const SECRET="dm/secret";
const RAW={};COLS.forEach(c=>RAW[c]={pub:new Map(),dm:new Map(),x:new Map()});
const ALL={};COLS.forEach(c=>ALL[c]=[]);
let ROLE="dm",assets=null,sampleFn=null,downloads=null,userCap=null,dataVer=0;
const isDM=()=>ROLE==="dm"&&!U.preview;

/* In-memory stand-in with the same shape as the db capability, used when saving isn't available */
function memDb(){
  const store=new Map(),subs=new Map();
  const fire=path=>{const docs=[...(store.get(path)||new Map()).entries()].map(([id,d])=>({id,data:()=>d}));(subs.get(path)||[]).forEach(cb=>cb({docs}))};
  return{collection(path){return{
    doc(id){return{set:async d=>{if(!store.has(path))store.set(path,new Map());store.get(path).set(id,JSON.parse(JSON.stringify(d)));fire(path)},delete:async()=>{store.get(path)?.delete(id);fire(path)}}},
    onSnapshot(cb){if(!subs.has(path))subs.set(path,[]);subs.get(path).push(cb);setTimeout(()=>fire(path),0);return()=>{}},
    get:async()=>({docs:[...(store.get(path)||new Map()).entries()].map(([id,d])=>({id,data:()=>d}))}),
    where(f,op,v){return{get:async()=>({docs:[...(store.get(path)||new Map()).entries()].filter(([,d])=>d[f]===v).map(([id,d])=>({id,data:()=>d}))})}}
  }}};
}
function merge(col){
  const r=RAW[col],out=[];
  for(const [id,d] of r.pub)if(!r.dm.has(id))out.push({...d,id,dmOnly:false});
  for(const [id,d] of r.dm)out.push({...d,id,dmOnly:true});
  for(const o of out){const x=r.x.get(o.id);o.secret=x?x.secret||"":""}
  ALL[col]=out;
}
function project(){
  const dm=isDM();
  COLS.forEach(col=>{S[col]=dm?ALL[col]:ALL[col].filter(x=>!x.dmOnly).map(x=>({...x,secret:""}))});
  dataVer++;
}
let renderQ=false;
/* don't redraw the page under someone who's typing in it; catch up once they leave the field */
function typingInApp(){const a=document.activeElement;return !!a&&document.getElementById("app").contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!/^(checkbox|radio|file|button|submit|hidden)$/.test(a.type)))}
let renderPending=false;
function queueRender(){if(renderQ)return;renderQ=true;requestAnimationFrame(()=>{renderQ=false;project();if(typingInApp()){renderPending=true;if(TM)renderTable()}else{renderPending=false;render()}refreshOpenSheet()})}
document.addEventListener("focusout",e=>{if(!renderPending||!(document.getElementById("app").contains(e.target)||document.getElementById("tablemode").contains(e.target)))return;setTimeout(()=>{if(renderPending&&!typingInApp()&&!typingInTable()){renderPending=false;render()}},300)});
/* opening: hold the page until every collection has arrived once, so it draws one time instead of flickering through partial states */
const BOOT={ready:false,need:Infinity,seen:new Set(),caps:false};
function bootSeen(k){if(BOOT.ready)return;BOOT.seen.add(k);bootCheck()}
function bootCheck(){if(!BOOT.ready&&BOOT.caps&&BOOT.seen.size>=BOOT.need){BOOT.ready=true;queueRender()}}
function bootForce(){if(!BOOT.ready){BOOT.ready=true;BOOT.caps=true;queueRender()}}
setTimeout(bootForce,6000);
function subscribe(){
  const dm=ROLE==="dm";
  BOOT.need=COLS.length*(dm?3:1)+1;
  COLS.forEach(col=>{
    const on=(kind,path)=>db.collection(path).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));RAW[col][kind]=m;merge(col);S.loaded=true;bootSeen(kind+"|"+col);queueRender()},()=>bootSeen(kind+"|"+col));
    on("pub",col);
    if(dm){on("dm",SECRET+"/"+col);on("x",SECRET+"/x_"+col)}
  });
  db.collection("settings").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.settings=o;S.loaded=true;bootSeen("settings");queueRender()},()=>bootSeen("settings"));
}
async function save(col,id,data,opts){
  if(col==="settings"){data.updated=Date.now();try{await db.collection("settings").doc(id).set(data)}catch(e){toast(saveErr(e))}return}
  const {secret,dmOnly:want,id:_i,...pub}=data;pub.updated=(opts&&opts.keepDate&&pub.updated)||Date.now();
  const dmOnly=ALWAYS_DM.has(col)||RAW[col].dm.has(id)||!!want;
  const r=RAW[col];
  const isNew=!r.pub.has(id)&&!r.dm.has(id);
  if(!isNew){const prevRec=ALL[col].find(x=>x.id===id);if(prevRec)recordHistory(col,id,prevRec)}
  if(!dmOnly&&!pub.revealed&&["characters","notes","quests","events","maps"].includes(col)&&(r.dm.has(id)||(isNew&&!(col==="notes"&&pub.category==="session")&&!(col==="characters"&&pub.kind==="pc"))))pub.revealed={session:rcSession(),at:Date.now()};
  try{

const STOP=new Set(["The","Oracle","Lord","Lady","Sir","Brother","Sister","Captain","Commander","General","King","Queen","Old","Young","Great","Shadow","Session","Church","Council","Hand","Band","Royal","Grove","Guild","Half","Deep","Heart","Sun","Red","Mortal","Divine"]);
let LX={ver:-1};
function linkIndex(){
  if(LX.ver===dataVer)return LX;
  const terms=[],seen=new Set(),byKey=new Map();
  const add=(name,type,id)=>{name=String(name||"").trim();if(name.length<3||seen.has(name))return;seen.add(name);terms.push({name,type,id});const k=type+":"+id;if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(name)};
  const firstWords=new Map();
  S.characters.forEach(c=>{const w=(c.name||"").replace(/^The\s+/,"").split(/\s+/)[0];if(w)firstWords.set(w,(firstWords.get(w)||0)+1)});
  S.characters.forEach(c=>{const n=c.name||"";add(n,"characters",c.id);const noThe=n.replace(/^The\s+/,"");if(noThe!==n)add(noThe,"characters",c.id);
    const parts=noThe.split(/\s+/);if(parts.length>1){const w=parts[0];if(w.length>=4&&/^[A-Z]/.test(w)&&!STOP.has(w)&&firstWords.get(w)===1)add(w,"characters",c.id)}});
  S.notes.filter(n=>n.category!=="session").forEach(n=>{add(n.title,"notes",n.id);const t=(n.title||"").replace(/^The\s+/,"");if(t!==n.title)add(t,"notes",n.id)});
  S.quests.forEach(q=>add(q.title,"quests",q.id));
  S.maps.forEach(m=>add(m.title,"maps",m.id));
  S.monsters.forEach(m=>add(m.name,"monsters",m.id));
  terms.sort((a,b)=>b.name.length-a.name.length);
  const map=new Map(terms.map(t=>[esc(t.name),t]));
  const re=terms.length?new RegExp("(?<![\\w&])("+terms.map(t=>esc(t.name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\w])","g"):null;
  LX={ver:dataVer,re,map,byKey};return LX;
}
function linkify(html,selfKey){
  const {re,map}=linkIndex();if(!re)return html;
  let inA=0;
  return html.split(/(<[^>]+>)/).map(part=>{
    if(part.startsWith("<")){if(/^<a[\s>]/i.test(part))inA++;else if(/^<\/a>/i.test(part))inA=Math.max(0,inA-1);return part}
    if(inA)return part;
    return part.replace(re,m=>{const t=map.get(m);if(!t||t.type+":"+t.id===selfKey)return m;return `<a class="xref" href="#" data-act="open" data-type="${t.type}" data-id="${t.id}">${m}</a>`});
  }).join("");
}

let GRAPH={key:""};
function graphLayout(nodes,edges,W,H){
  const key=nodes.map(n=>n.id).join(",")+"|"+edges.map(e=>e.a+e.b).join(",")+"|"+W;
  if(GRAPH.key===key)return GRAPH.pos;
  const N=nodes.length,pos=new Map(),idx=new Map(nodes.map((n,i)=>[n.id,i]));
  nodes.forEach((n,i)=>{const a=i/N*Math.PI*2;pos.set(n.id,{x:W/2+Math.cos(a)*W*.35,y:H/2+Math.sin(a)*H*.35,vx:0,vy:0})});
  const k=Math.sqrt(W*H/Math.max(N,1))*.75;
  for(let it=0;it<500;it++){
    const t=1-it/500;
    for(const a of nodes){const pa=pos.get(a.id);pa.vx=0;pa.vy=0}
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const pa=pos.get(nodes[i].id),pb=pos.get(nodes[j].id);let dx=pa.x-pb.x,dy=pa.y-pb.y,d=Math.hypot(dx,dy)||.01;const f=k*k/d;dx/=d;dy/=d;pa.vx+=dx*f;pa.vy+=dy*f;pb.vx-=dx*f;pb.vy-=dy*f}
    for(const e of edges){const pa=pos.get(e.a),pb=pos.get(e.b);if(!pa||!pb)continue;let dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy)||.01;const f=d*d/k;dx/=d;dy/=d;pa.vx+=dx*f;pa.vy+=dy*f;pb.vx-=dx*f;pb.vy-=dy*f}
    for(const n of nodes){const p=pos.get(n.id);p.vx+=(W/2-p.x)*.02*k/10;p.vy+=(H/2-p.y)*.02*k/10;const v=Math.hypot(p.vx,p.vy)||1,step=Math.min(v,k*t*.9);p.x+=p.vx/v*step;p.y+=p.vy/v*step;p.x=Math.max(50,Math.min(W-50,p.x));p.y=Math.max(40,Math.min(H-50,p.y))}
  }
  for(let pass=0;pass<80;pass++){let moved=false;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const pa=pos.get(nodes[i].id),pb=pos.get(nodes[j].id);let dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.hypot(dx,dy)||.01;const min=Math.abs(dy)<40?130:92;
      if(d<min){const push=(min-d)/2;dx/=d;dy/=d;pa.x-=dx*push;pa.y-=dy*push;pb.x+=dx*push;pb.y+=dy*push;moved=true}}
    for(const n of nodes){const p=pos.get(n.id);p.x=Math.max(80,Math.min(W-80,p.x));p.y=Math.max(40,Math.min(H-50,p.y))}
    if(!moved)break}
  GRAPH={key,pos};void idx;return pos;
}
function relGraph(){
  const ids=new Set();S.links.forEach(l=>{if(rec("characters",l.a)&&rec("characters",l.b)){ids.add(l.a);ids.add(l.b)}});
  const nodes=[...ids].map(id=>rec("characters",id)).sort((a,b)=>a.name.localeCompare(b.name));
  const edges=S.links.filter(l=>ids.has(l.a)&&ids.has(l.b));
  if(!nodes.length)return `<div class="empty">No relationships yet. ${isDM()?"Use <b>Add relationship</b> to connect two characters.":""}</div>`;
  const W=1000,H=Math.max(560,Math.min(900,nodes.length*30)),pos=graphLayout(nodes,edges,W,H);
  const col=k=>`var(--rel-${REL_TONE[k]||"muted"})`;
  let svg=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Relationship map"><defs>${Object.keys(REL).map(k=>`<marker id="ar-${k}" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col(k)}"/></marker>`).join("")}<clipPath id="cc"><circle r="22" cx="0" cy="0"/></clipPath></defs>`;
  for(const e of edges){const a=pos.get(e.a),b=pos.get(e.b);const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    const x1=a.x+ux*26,y1=a.y+uy*26,x2=b.x-ux*28,y2=b.y-uy*28;const dirn=e.kind==="serves"||e.kind==="mentor";
    svg+=`<g class="edge" data-act="open" data-type="links" data-id="${e.id}"><title>${esc(rec("characters",e.a).name)} — ${esc(REL[e.kind]||"Linked")}${e.label?": "+esc(e.label):""} — ${esc(rec("characters",e.b).name)}</title><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col(e.kind)}" stroke-width="${e.kind==="enemy"?2.6:2}" ${e.kind==="enemy"||e.kind==="rival"?'stroke-dasharray="6 4"':""} ${dirn?`marker-end="url(#ar-${e.kind})"`:""}/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="14"/></g>`}
  for(const n of nodes){const p=pos.get(n.id);const pc=n.kind==="pc";
    svg+=`<g class="node" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})" data-act="open" data-type="characters" data-id="${n.id}" tabindex="0"><title>${esc(n.name)}</title><circle r="24" fill="var(--block)" stroke="${pc?"var(--bar)":"var(--accent)"}" stroke-width="${pc?3.5:2}"/>${n.img?`<image href="${esc(imgUrl(n.img))}" x="-22" y="-22" width="44" height="44" clip-path="url(#cc)" preserveAspectRatio="xMidYMid slice"/>`:`<text y="6" text-anchor="middle" class="ni">${esc(initials(n.name))}</text>`}<text y="42" text-anchor="middle" class="nl">${esc(n.name.length>22?n.name.slice(0,21)+"…":n.name)}</text></g>`}
  svg+=`</svg>`;
  return `<div class="graph-wrap">${svg}</div><div class="legend">${Object.keys(REL).filter(k=>edges.some(e=>e.kind===k)).map(k=>`<span><i style="background:${col(k)}"></i>${REL[k]}</span>`).join("")}<span><i class="ring pc"></i>Party member</span></div>`;
}

/* session plans read as bullets: one point per line, "Label: details" lines get a bold label with the details split into sub-points */
const plInline=(t,key)=>rich(t,key).replace(/^\s*<p>([\s\S]*)<\/p>\s*$/,"$1");
const plSentences=t=>String(t).split(/(?<=[.!?])\s+(?=[A-Z"'“(])/).map(x=>x.trim()).filter(Boolean);
function planBullets(text,key){
  const lines=String(text||"").split("\n").map(l=>l.trim()).filter(Boolean);if(!lines.length)return "";
  let out="",open=false;const ul=()=>{if(!open){out+=`<ul class="pl-ul">`;open=true}},close=()=>{if(open){out+="</ul>";open=false}};
  lines.forEach(l=>{
    if(/^#{1,4} /.test(l)){close();out+=`<h5 class="pl-sub">${plInline(l.replace(/^#{1,4} /,""),key)}</h5>`;return}
    l=l.replace(/^[-*•]\s+/,"");
    const m=l.match(/^\**([^:.!?*]{2,60}?)\**:\s+(.+)$/);
    ul();
    if(m){const parts=plSentences(m[2]).map(x=>x[0].toUpperCase()+x.slice(1));const lead=parts.length>1&&parts[0].split(/\s+/).length<=4?parts.shift():"";
      out+=`<li><b class="pl-lab">${plInline(m[1],key)}${parts.length>1||lead?":":""}</b>${parts.length>1?`${lead?` ${plInline(lead,key)}`:""}<ul>${parts.map(x=>`<li>${plInline(x,key)}</li>`).join("")}</ul>`:` ${lead?plInline(lead,key)+" ":""}${plInline(parts[0]||m[2],key)}`}</li>`}
    else plSentences(l).forEach(x=>{out+=`<li>${plInline(x,key)}</li>`});
  });close();return out}
function vPrepPlan(c,tabs){
  const plans=S.plans.slice().sort((a,b)=>(b.session||0)-(a.session||0));
  const cur=plans.find(p=>p.id===U.planSel)||plans.find(p=>p.status!=="played")||plans[0];
  const open=S.threads.filter(t=>t.status!=="resolved").sort((a,b)=>(b.updated||0)-(a.updated||0));
  const done=S.threads.filter(t=>t.status==="resolved");
  const sec=(label,v)=>v?`<section class="pl-s"><h4>${label}</h4><div class="prose vprose">${label==="Scene opener"?rich(v,"plans:"+cur.id):planBullets(v,"plans:"+cur.id)}</div></section>`:"";
  let plan;
  if(cur){
    const mentioned=[...new Map(backlinksFrom(textOf("plans",cur)).map(o=>[o.type+o.id,o])).values()];
    plan=`<article class="plan"><div class="plan-h"><div><span class="label">Session ${cur.session||"?"} ${cur.status==="played"?"· played":"· planned"}</span><h3>${esc(cur.title||`Session ${cur.session||"?"}`)}</h3></div>
      <div class="plan-acts"><button class="btn sm" data-act="edit" data-type="plans" data-id="${cur.id}">Edit</button>${moreMenu([mi("planPlayed",cur.status==="played"?"Mark as planned":"Mark as played",`data-id="${cur.id}"`),mi("copyR20","Copy for Roll20",`data-type="plans" data-id="${cur.id}"`)])}</div></div>
      ${entCmdHtml("plans",cur.id)}
      ${mentioned.length?`<div class="chips">${mentioned.map(o=>`<button class="chip" data-act="open" data-type="${o.type}" data-id="${o.id}">${o.type==="characters"?avatar(rec("characters",o.id),20):""}${esc(o.name)}</button>`).join("")}</div>`:""}
      ${sec("Scene opener",cur.opener)}${sec("Encounters & scenes",cur.encounters)}${sec("NPCs & places",cur.cast)}${sec("Loot to hand out",cur.loot)}${sec("Threads to pull",cur.threads)}${sec("Other notes",cur.notes)}
      ${revealList(cur)}${cur.twists?twistSection(cur):""}
      ${!cur.opener&&!cur.encounters&&!cur.cast&&!cur.loot&&!cur.threads&&!cur.notes&&!cur.reveals&&!cur.twists?`<p class="vempty">This plan is empty. Use Edit to fill it in.</p>`:""}
      ${bsEmbedHtml("plans",cur.id)}
    </article>`;
  }else plan=`<div class="empty">No session plan yet. Plan the next game: the opener, likely encounters, who might show up and what loot to hand out.</div>`;
  const others=plans.filter(p=>p!==cur);

  <div class="prep">
    <div class="prep-main">${briefPanel()}${plan}
      ${others.length?`<details class="past"><summary>Other plans · ${others.length}</summary>${others.map(p=>`<button class="bl-i" data-act="planPick" data-id="${p.id}"><b>${esc(p.title||"Session "+p.session)}</b><small>Session ${p.session||"?"} · ${p.status==="played"?"played":"planned"}</small></button>`).join("")}</details>`:""}
      ${toolsPanel()}
    </div>
    <aside class="side threads"><h4>Loose threads <span class="mono">${open.length}</span></h4>
      <form data-form="threadQuick" class="tq"><input id="tq-in" placeholder="Add a loose thread…" aria-label="New loose thread" value="${esc(U.tq||"")}"><button class="btn sm primary" type="submit">Add</button></form>
      ${open.length?open.map(threadRow).join(""):`<p class="vempty">Nothing unresolved. Nice.</p>`}
      ${done.length?`<details><summary>Resolved · ${done.length}</summary>${done.map(threadRow).join("")}</details>`:""}
    </aside>
  </div>`;
}
function backlinksFrom(text){
  const {re,map}=linkIndex();if(!re)return [];
  const out=[];String(esc(text||"")).replace(re,m=>{const t=map.get(m);if(t&&t.type!=="maps")out.push({type:t.type,id:t.id,name:titleOf(t.type,rec(t.type,t.id)||{})||m});return m});
  return out;
}
const threadRow=t=>`<div class="th ${t.status==="resolved"?"done":""}"><input type="checkbox" id="th-${t.id}" data-thread="${t.id}" ${t.status==="resolved"?"checked":""} aria-label="Resolved"><button class="th-t" data-act="open" data-type="threads" data-id="${t.id}"><span>${linkify(esc(t.text||""),"")}</span>${t.notes?`<small>${esc(plain(t.notes).slice(0,90))}</small>`:""}</button>${isDM()&&t.status!=="resolved"?thPlanBtn(t):""}</div>`;
/* one click: put a loose thread into the next session plan's "Threads to pull" */
const thNext=()=>S.plans.filter(p=>p.status!=="played").sort((a,b)=>(num(a.session)||0)-(num(b.session)||0))[0]||null;
const thLine=t=>plain(t.text||"").replace(/\s+/g," ").trim();
const thInPlan=(t,p)=>!!p&&String(p.threads||"").toLowerCase().includes(thLine(t).toLowerCase().slice(0,60));
function thPlanBtn(t){const p=thNext();const inn=thInPlan(t,p);return `<button type="button" class="th-plan ${inn?"on":""}" data-thplan="${t.id}" title="${inn?`Already in ${esc(p.title||"the plan")}. Click to take it out.`:p?`Add to Threads to pull in ${esc(p.title||"the next plan")}`:"Add to the next session plan"}" aria-label="${inn?"Remove from session plan":"Add to session plan"}">${inn?"✓ In plan":"+ Plan"}</button>`}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-thplan]");if(!b)return;e.preventDefault();e.stopPropagation();const t=rec("threads",b.dataset.thplan);if(!t)return;
  let p=thNext();const line=thLine(t);
  if(!p){const n=nextSession(),pid=uid();await save("plans",pid,{title:`Session ${n}`,session:n,status:"planned",threads:line});toast(`Started a plan for session ${n} with this thread`);return}
  const{id,...r}=p;const L=String(r.threads||"").split("\n").filter(l=>l.trim());
  if(thInPlan(t,p)){const k=line.toLowerCase().slice(0,60);await save("plans",id,{...r,threads:L.filter(l=>!l.toLowerCase().includes(k)).join("\n")});toast(`Taken out of ${p.title||"the plan"}`)}
  else{await save("plans",id,{...r,threads:L.concat([line]).join("\n")});toast(`Added to ${p.title||"the plan"}: Threads to pull`)}},true);

function campaignDigest(limit){
  const c=cal(),parts=[];
  const add=(h,t)=>{t=plain(t||"").trim();if(t)parts.push(`## ${h}\n${t}`)};
  parts.push(`Campaign: ${S.settings.campaign?.name||"Untitled"}. In-world date: ${fmtDate(c,c.today)}.`);
  S.characters.forEach(x=>add(`${x.kind==="pc"?"Party member":"NPC"}: ${x.name}`,[[x.race,x.cls,x.level?"level "+x.level:""].filter(Boolean).join(", "),x.status&&x.status!=="alive"?"Status: "+x.status:"",x.attitude?"Attitude: "+x.attitude:"",x.location?"Location: "+x.location:"",x.faction?"Faction: "+x.faction:"",x.notes,x.backstory?"Backstory: "+plain(x.backstory).slice(0,2500):"",x.secret?"DM secret: "+x.secret:""].filter(Boolean).join("\n")));
  S.notes.slice().sort((a,b)=>(a.session||0)-(b.session||0)).forEach(n=>add(`${NOTE_CATS[n.category]||"Note"}: ${n.title}`,[n.leader?"Leader: "+n.leader:"",n.goals?"Goals: "+n.goals:"",n.allies?"Allies: "+n.allies:"",n.enemies?"Enemies: "+n.enemies:"",n.members?"Key members: "+n.members:"",n.body,n.secret?"DM secret: "+n.secret:""].filter(Boolean).join("\n")));
  S.quests.forEach(q=>add(`Quest (${QSTAT[q.status]||"Rumor"}): ${q.title}`,[q.giver?"Giver: "+q.giver:"",q.reward?"Reward: "+q.reward:"",q.notes,q.secret?"DM secret: "+q.secret:""].filter(Boolean).join("\n")));
  S.events.forEach(e=>add(`Event on ${fmtDate(c,{y:e.y??c.today.y,m:e.m,d:e.d})}: ${e.title}`,e.notes));
  S.links.forEach(l=>{const a=rec("characters",l.a),b=rec("characters",l.b);if(a&&b)parts.push(`Relationship: ${a.name} — ${REL[l.kind]||"linked"} — ${b.name}${l.label?" ("+l.label+")":""}`)});
  S.threads.forEach(t=>add(`Loose thread (${t.status==="resolved"?"resolved":"open"})`,[t.text,t.notes].join("\n")));
  S.loot.forEach(l=>parts.push(`Party item: ${l.name}${l.holder&&l.holder!=="party"?" (carried by "+(rec("characters",l.holder)?.name||"?")+")":""}`));
  let s=parts.join("\n\n");if(s.length>limit)s=s.slice(0,limit)+"\n…(notes truncated)";
  return s;
}
function aiErr(e){const c=e&&e.code;return c==="not_granted"||c==="sampling_disabled"?"Claude isn't allowed in this view. You can allow it from the artifact's permissions.":c==="rate_limited"?"Too many requests just now. Try again in a minute.":c==="refused"?"Claude declined that one. Try rewording it.":c==="cancelled"?"":"Something went wrong. Try again."}
/* running session log: notes keep saving, recap can be updated */
const logFor=n=>S.logs.find(l=>l.session===n);
const recapFor=n=>{const l=logFor(n);return (l&&l.recapId&&rec("notes",l.recapId))||S.notes.find(x=>x.category==="session"&&x.session===n)};
function rcSession(){
  if(U.rcN!=null&&String(U.rcN).trim()!=="")return num(U.rcN)||recapNext();
  const max=Math.max(0,...S.notes.filter(n=>n.category==="session").map(n=>n.session||0));
  const last=S.logs.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
  return last&&(last.session||0)>=max?last.session:recapNext();
}
const rcNotesVal=n=>U.rcDirty===n?(U.rcNotes||""):(logFor(n)?.notes||"");
const rcOpenVal=n=>U.rcDirty===n?(U.rcOpen||""):(logFor(n)?.open||"");
const noteLines=t=>String(t||"").split("\n").map(x=>x.trim()).filter(x=>x&&x!=="-");
function newLines(n){const old=new Set(noteLines(logFor(n)?.genNotes));return noteLines(rcNotesVal(n)).filter(x=>!old.has(x))}
let logTimer=null;
function markDirty(n){if(U.rcDirty!==n){U.rcNotes=rcNotesVal(n);U.rcOpen=rcOpenVal(n);U.rcDirty=n}}
function saveLogSoon(n){clearTimeout(logTimer);logTimer=setTimeout(()=>saveLog(n),700)}

}

  const npcs=S.characters.filter(x=>x.kind!=="pc").map(x=>x.name).join(", ");
  let prompt;
  if(existing){

/* ================= round 2: encounters, tables, spotlight, arcs, reveals, schedule, timeline, table mode ================= */
const CRS=["0","1/8","1/4","1/2",...Array.from({length:30},(_,i)=>String(i+1))];
const CR_XP={"0":10,"1/8":25,"1/4":50,"1/2":100,"1":200,"2":450,"3":700,"4":1100,"5":1800,"6":2300,"7":2900,"8":3900,"9":5000,"10":5900,"11":7200,"12":8400,"13":10000,"14":11500,"15":13000,"16":15000,"17":18000,"18":20000,"19":22000,"20":25000,"21":33000,"22":41000,"23":50000,"24":62000,"25":75000,"26":90000,"27":105000,"28":120000,"29":135000,"30":155000};
/* 2024 DMG: XP budget per character [Low, Moderate, High] */
const BUDGET=[null,[50,75,100],[100,150,200],[150,225,400],[250,375,500],[500,750,1100],[600,1000,1400],[750,1300,1700],[1000,1700,2100],[1300,2000,2600],[1600,2300,3100],[1900,2900,4100],[2200,3700,4700],[2600,4200,5400],[2900,4900,6200],[3300,5400,7800],[3800,6100,9800],[4500,7200,11700],[5000,8700,14200],[5500,10700,17200],[6400,13200,22000]];
const fmtN=n=>Number(n||0).toLocaleString("en-US");
function partyLevels(){const pcs=S.characters.filter(x=>x.kind==="pc"&&x.status!=="dead");return pcs.map(p=>Math.max(1,Math.min(20,num(p.level)||6)))}
function encMath(e){
  const lv=(e.party&&e.party.length?e.party:partyLevels());const levels=lv.length?lv:[6,6,6,6];
  const b=[0,1,2].map(k=>levels.reduce((a,l)=>a+BUDGET[Math.max(1,Math.min(20,l))][k],0));
  const xp=(e.monsters||[]).reduce((a,m)=>a+(CR_XP[m.cr]||0)*(num(m.count)||0),0);
  const diff=xp===0?"none":xp<b[0]?"trivial":xp<b[1]?"low":xp<b[2]?"moderate":xp<=b[2]*1.15?"high":"deadly";
  return {xp,b,diff,size:levels.length,avg:Math.round(levels.reduce((a,l)=>a+l,0)/levels.length*10)/10};
}
const DIFF={none:["No monsters yet","muted"],trivial:["Below Low","muted"],low:["Low","ok"],moderate:["Moderate","warn"],high:["High","bad"],deadly:["Above High","bad"]};
const encLine=e=>{const m=encMath(e);return `**${e.title||"Encounter"}** (${DIFF[m.diff][0]}, ${fmtN(m.xp)} XP): ${(e.monsters||[]).filter(x=>x.name).map(x=>`${x.count||1}× ${x.name}`).join(", ")}`};
let ENC=null;
function openEncounter(id){

  encSheet(true);
}
function encParty(){if(ENC.partyOverride){const {size,level}=ENC.partyOverride;return Array.from({length:Math.max(1,num(size)||1)},()=>Math.max(1,Math.min(20,num(level)||1)))}return partyLevels()}
function encSheet(focus){

  const pl=encParty(),ov=ENC.partyOverride;
  showSheet(`<div class="sheet wide enc" role="dialog" aria-label="Encounter builder"><h2>${ENC.id?"Edit encounter":"New encounter"}</h2>

    <div class="enc-party"><span class="label">Party</span>

        :`<span>${pl.length} characters · levels ${esc([...new Set(pl)].join(", ")||"–")}</span><button type="button" class="btn sm" data-act="encPartyEdit">Change</button>`}</div>
    <div class="enc-rows" id="enc-rows">${ENC.monsters.map((m,i)=>`<div class="enc-row"><input data-enc="${i}" data-f="name" id="enc-n-${i}" value="${esc(m.name)}" placeholder="Monster" aria-label="Monster name"><label class="enc-cr">CR <select data-enc="${i}" data-f="cr" aria-label="Challenge rating">${CRS.map(c=>`<option ${String(m.cr)===c?"selected":""}>${c}</option>`).join("")}</select></label><label class="enc-ct">× <input data-enc="${i}" data-f="count" id="enc-c-${i}" inputmode="numeric" value="${esc(m.count)}" aria-label="How many"></label><span class="enc-xp mono" id="enc-x-${i}">${fmtN((CR_XP[m.cr]||0)*(num(m.count)||0))} XP</span><button type="button" class="btn icon" data-act="encDel" data-i="${i}" aria-label="Remove">×</button></div>`).join("")}</div>
    <div class="tool-acts"><button type="button" class="btn sm" data-act="encAdd">Add monster</button>${known.map(m=>`<button type="button" class="chip" data-act="encQuick" data-name="${esc(m.name)}" data-cr="${esc(m.cr)}">+ ${esc(m.name)} <small>CR ${esc(m.cr)}</small></button>`).join("")}</div>
    <div id="enc-sum">${encSummary()}</div>

    <div class="fields"><div class="field"><span class="label">Tactics & notes</span><textarea id="enc-notes" rows="4" class="plain-ta" placeholder="Terrain, phases, what the monsters want">${esc(ENC.notes)}</textarea></div></div>
    <p class="hint-p">Difficulty uses the 2024 Dungeon Master's Guide XP budgets. Treat it as a guide: action economy, terrain and phases matter too.</p>

}
function encSummary(){

${have.length?`Existing entries (don't repeat them):\n${have.join("\n")}\n`:""}Each entry is one or two sentences a DM can use immediately. Reply with only a JSON object: {"entries":[string,...]}`,{cache:false});

/* ---------- schedule ---------- */
function nextGame(){
  const sc=S.settings.schedule;if(!sc||!sc.next)return null;
  let d=new Date(sc.next);if(isNaN(d))return null;
  const step=sc.repeat==="weekly"?7:sc.repeat==="biweekly"?14:0,now=Date.now();
  if(step)while(d.getTime()+4*3600e3<now)d=new Date(d.getTime()+step*864e5);
  return d;
}
function nextGameText(){
  const d=nextGame();if(!d)return "";
  const now=new Date(),days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  if(d.getTime()+4*3600e3<now.getTime())return "";
  const when=days===0?"tonight":days===1?"tomorrow":days<0?"":`in ${days} days`;
  return `Next game ${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}, ${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}${when?` · ${when}`:""}`;
}
