function realDatesText(ds){if(!Array.isArray(ds)||!ds.length)return "";const d=ds.map(x=>new Date(x+"T12:00"));const sameYear=d.every(x=>x.getFullYear()===d[0].getFullYear());return d.map(x=>x.toLocaleDateString("en-US",{month:"short",day:"numeric"})).join(", ")+(sameYear?", "+d[0].getFullYear():"")}
function vTimeline(c){
  const tIdx=toIdx(c,c.today),items=[];
  S.events.forEach(e=>items.push({i:toIdx(c,{y:e.y??c.today.y,m:e.m,d:e.d}),col:"events",x:e,label:e.title,kind:(EVKIND[e.kind]||"Event")+(e.realDates&&e.realDates.length?" · played "+realDatesText(e.realDates):"")}));
  S.notes.filter(n=>n.ig&&n.ig.m!=null).forEach(n=>items.push({i:toIdx(c,n.ig),col:"notes",x:n,label:n.title,kind:NOTE_CATS[n.category]||"Note",real:n.played}));
  items.sort((a,b)=>a.i-b.i||((a.x.session||0)-(b.x.session||0)));
  if(!items.length)return `<div class="empty">Nothing on the timeline yet. Events and notes with an in-game date show up here.</div>`;
  let h="",prev=null,todayDone=false;
  const todayMark=()=>`<div class="tl-today"><span>Today · ${esc(fmtDate(c,c.today))}</span></div>`;
  for(const it of items){
    if(!todayDone&&it.i>tIdx){if(prev!==null&&tIdx-prev>0)h+=`<div class="tl-gap">${tIdx-prev} day${tIdx-prev>1?"s":""} later</div>`;h+=todayMark();todayDone=true;prev=tIdx}
    if(prev!==null&&it.i!==prev){const g=it.i-prev;h+=`<div class="tl-gap">${g>0?`${fmtN(g)} day${g>1?"s":""} later`:""}</div>`}
    if(it.i!==prev)h+=`<div class="tl-date">${esc(fmtDate(c,fromIdx(c,it.i)))}</div>`;
    h+=`<button class="tl-item k-${it.col}" data-act="open" data-type="${it.col}" data-id="${it.x.id}"><span class="tl-dot"></span><span><b>${esc(it.label||"Untitled")}</b> ${dmBadge(it.x)}<small>${esc(it.kind)}${it.real?" · played "+esc(new Date(it.real+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})):""}</small></span></button>`;
    prev=it.i;
  }
  if(!todayDone){if(prev!==null&&tIdx>prev)h+=`<div class="tl-gap">${tIdx-prev} day${tIdx-prev>1?"s":""} later</div>`;h+=todayMark()}
  return `<div class="timeline">${h}</div>`;
}

function cleanFields(type,f){
  const allowed=new Set(FIELDS[type].split(/,\s*/).map(x=>x.split(" ")[0]));const out={};
  for(const [k,v] of Object.entries(f||{})){if(!allowed.has(k))continue;
    if(["level","hpMax","hp","hpTemp","pp","qty","session","y","m","d","str","dex","con","int","wis","cha"].includes(k)||(k==="ac"&&type!=="monsters"))out[k]=v===""||v==null?null:num(v);
    else if(["dmOnly","pinned","yearly","done"].includes(k))out[k]=!!v;
    else if(k==="realDates")out[k]=(Array.isArray(v)?v:String(v||"").split(/[,\s]+/)).map(String).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();
    else if(k==="monsters")out[k]=Array.isArray(v)?v.map(m=>({name:String(m.name||""),cr:CR_XP[String(m.cr)]!==undefined?String(m.cr):"1",count:num(m.count)||1})):[];
    else out[k]=v==null?"":String(v);}
  return out;
}

}

function askRules(){return `You are the assistant built into "DM's Desk", a Dungeons & Dragons campaign manager. The DM types either a question or an instruction.
- Instruction: carry it out with the tools, then reply in one or two plain sentences saying what you did.
- Information: when the DM just tells you something about the campaign (what happened, what an NPC did or wants, a decision, a new person or place, what the party found out), don't ask what to do with it. File it everywhere it applies, using the tools: append a short line to each character, place, faction, quest or thread it touches (add "(session N)" when it happened in play); change short fields that changed (status, attitude, location); create entries for new named people, places or items (dmOnly unless the party knows them); add a calendar event if it's a dated happening; call add_party_knowledge if the players' characters now know it; tick a milestone if it was reached. Then reply in one or two sentences listing where you put it. The DM can undo, so act rather than ask. Only ask if it's truly unclear who or what it's about.
- Question: answer it from the campaign notes below, concisely, using the exact names as written. If the notes don't say, say so plainly and suggest what the DM might decide. Lines marked "DM secret" are hidden from players: point it out when an answer depends on one. Questions usually need no tools.
- Don't write anything before or between tool calls; write your reply once, at the end.

Rules:
- Use the exact ids from the index below. Read an entry with get_entry before rewriting any of its text fields, or use update_entry's 'append' to add to them.
- New entries the players shouldn't see yet get dmOnly: true. Party members and session recaps are visible to players by default.
- You cannot delete anything. If asked to, say the DM can delete it from the entry's Edit screen.
- Don't invent campaign facts the DM didn't give you. If something is ambiguous (two people with similar names), ask instead of guessing.
- Text fields use simple formatting: lines starting "# " are headings, "- " are bullets, **bold**.
- If the DM wants to see something, call open_entry or go_to.


LEARNING. When the DM corrects something you did, or tells you a lasting preference about how you should work, do what they asked and also call suggest_rule with a one-sentence rule so they can keep it. Don't suggest rules for one-off facts about the campaign; those go in the notes.

WHERE THINGS GO. Put each fact in the field made for it, never all in "notes":
- characters: voice = how they sound and their mannerisms; pronounce = how to say the name; race = species only; cls = class, job or role; location = where they are now; faction = the group they belong to; status and attitude = the short values listed; backstory = their life before the campaign; secret = anything the players don't know (true identity, hidden motives, possession, plans); notes = appearance, personality and what they've done in play (dated with "(session N)" when known). Relationships between two characters are "links" entries (a, b, kind, label), not lines in notes. Items someone carries are "loot" entries with holder set.
- notes: body = the main description; secret = what the players don't know; for factions use leader, goals, allies, enemies, members, base, alignment; for places set parent to the place it's inside; shops keep wares in stock.
- quests: giver, location, reward in their own fields; secret for hidden truths; beats for story steps.
- plans (session plans): opener = the read-aloud text that starts the session; encounters = fights, puzzles, social scenes and how they start or play out (setup, positions, phases, the party's options); cast = the NPCs, creatures and places in play, with what the DM needs about each (layout, how an NPC acts or speaks); loot = treasure to hand out; threads = loose threads, character moments and hooks to pull this session; reveals = secrets or clues to reveal, one per line; twists = prepared twists, one per line; notes = only what fits none of these. Write each as short "Label: detail" lines, one point per line.
When an entry already has facts sitting in the wrong field, and you're editing that entry anyway, move them to the right field (remove them from the old one) without losing or inventing anything.

Fields by type:
${ASK_TYPES.map(t=>`${t}: ${FIELDS[t]}`).join("\n")}

Current state:
${askState()}

CAMPAIGN NOTES
${campaignDigest(150000)}`}

/* ---------- faction clocks ---------- */
function clockSvg(seg,filled,size){
  seg=Math.max(2,Math.min(12,num(seg)||4));filled=Math.max(0,Math.min(seg,num(filled)||0));const r=size/2-3,cx=size/2,cy=size/2;let p="";
  for(let i=0;i<seg;i++){const a0=-Math.PI/2+i*2*Math.PI/seg,a1=a0+2*Math.PI/seg;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    p+=`<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${i<filled?"var(--accent)":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.5"/>`}
  return `<svg class="clock-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${filled} of ${seg}">${p}</svg>`;
}
function clockCard(k,compact){
  const seg=num(k.segments)||6,f=Math.min(seg,num(k.filled)||0),full=f>=seg;
  return `<div class="clk ${full?"full":""} ${compact?"compact":""}">${clockSvg(seg,f,compact?44:72)}<div class="clk-b"><b>${esc(k.title||"Clock")}</b><small>${esc(k.faction||"")}${k.faction?" · ":""}${f} of ${seg}${full?` · <span class="t-bad">triggered</span>`:""} ${dmBadge(k)}</small>
    ${!compact&&k.trigger?`<span class="clk-t"><b>When it fills:</b> ${linkify(esc(k.trigger),"")}</span>`:""}
    <span class="clk-acts dm-only"><button class="btn icon" data-act="clkTick" data-id="${k.id}" data-n="-1" aria-label="Remove a segment">−</button><button class="btn icon" data-act="clkTick" data-id="${k.id}" data-n="1" aria-label="Fill a segment">+</button>${compact?"":`<button class="btn sm" data-act="edit" data-type="clocks" data-id="${k.id}">Edit</button>`}</span></div></div>`;
}
async function tickClock(id,n){const k=rec("clocks",id);if(!k)return;const seg=num(k.segments)||6;const f=Math.max(0,Math.min(seg,(num(k.filled)||0)+n));if(f===(num(k.filled)||0))return;const{id:_,...keep}=k;await save("clocks",id,{...keep,filled:f});if(f>=seg&&n>0)toast(`“${k.title}” has filled`)}
function vClocks(){
  const list=S.clocks.slice().sort((a,b)=>((num(b.filled)||0)/(num(b.segments)||1))-((num(a.filled)||0)/(num(a.segments)||1)));
  const c=cal(),last=S.settings.offscreen?.lastIdx,days=last!=null?toIdx(c,c.today)-last:null;

  ${offPanel(days)}
  ${list.length?`<div class="clks">${list.map(k=>clockCard(k)).join("")}</div>`:`<div class="empty">No clocks yet. Try "Rival gang finds the silver amulet" with 6 segments.</div>`}`;
}

async function offGo(){

Faction clocks:
${clocks}

    OFF.items=(data&&Array.isArray(data.items)?data.items:[]).slice(0,8).map(x=>({title:String(x.title||"Development"),details:String(x.details||""),clock:x.clock&&rec("clocks",String(x.clock))?String(x.clock):null,ticks:Math.max(-2,Math.min(3,num(x.ticks)||0)),keep:true}));

async function offApply(){

/* ---------- shops ---------- */
const COIN_CP={pp:1000,gp:100,ep:50,sp:10,cp:1};
function parsePrice(s){const m=String(s||"").match(/([\d,.]+)\s*(pp|gp|ep|sp|cp)/i);if(!m)return null;return {n:parseFloat(m[1].replace(/,/g,"")),coin:m[2].toLowerCase(),cp:Math.round(parseFloat(m[1].replace(/,/g,""))*COIN_CP[m[2].toLowerCase()])}}
function stockRows(n){return String(n.stock||"").split("\n").map(l=>l.trim()).filter(Boolean).map((l,i)=>{const [name,price,qty]=l.split("|").map(x=>(x||"").trim());return {i,name:name||l,price:price||"",qty:qty===""||qty==null?null:num(qty)}})}
function stockBlock(n){
  const rows=stockRows(n);if(!rows.length&&!isDM())return "";
  return `<div class="stock"><div class="loot-head"><b>For sale</b><span class="dm-only">${sampleFn?`<button class="btn sm" data-act="stockGen" data-id="${n.id}" ${AI.stockBusy?"disabled":""}>${AI.stockBusy?"Writing…":rows.length?"Add wares with Claude":"Stock it with Claude"}</button>`:""}</span></div>
    ${rows.length?`<table class="stock-t"><thead><tr><th>Item</th><th>Price</th><th>Stock</th><th class="dm-only"></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${linkify(esc(r.name),"")}</td><td class="mono">${esc(r.price)}</td><td class="mono">${r.qty==null?"∞":r.qty}</td><td class="dm-only">${r.qty===0?`<span class="muted">Sold out</span>`:`<button class="btn sm" data-act="stockSell" data-id="${n.id}" data-i="${r.i}">Sell to party</button>`}</td></tr>`).join("")}</tbody></table>`:`<p class="vempty">No stock yet. Edit the note to add items, one per line as <b>Item | price | quantity</b>.</p>`}</div>`;
}
async function stockSell(id,i){
  const n=rec("notes",id);if(!n)return;const rows=stockRows(n),r=rows.find(x=>x.i===i);if(!r)return;
  const pr=parsePrice(r.price);const purse={pp:0,gp:0,ep:0,sp:0,cp:0,...(S.settings.purse||{})};let changed=false;
  if(pr){
    const total=Object.entries(COIN_CP).reduce((a,[k,v])=>a+(num(purse[k])||0)*v,0);
    if(total<pr.cp){toast(`The party can't afford that (${r.price}).`);return}
    if((num(purse[pr.coin])||0)>=pr.n&&Number.isInteger(pr.n))purse[pr.coin]=(num(purse[pr.coin])||0)-pr.n;
    else{let left=total-pr.cp;purse.pp=0;purse.ep=0;purse.gp=Math.floor(left/100);left-=purse.gp*100;purse.sp=Math.floor(left/10);purse.cp=left-purse.sp*10;changed=true}
    await save("settings","purse",purse);
  }
  await save("loot",uid(),{name:r.name,holder:"party",qty:1,value:r.price,notes:`Bought at ${n.title}.`,dmOnly:false});
  if(r.qty!=null){const lines=String(n.stock).split("\n").map(l=>l.trim()).filter(Boolean);lines[i]=[r.name,r.price,String(Math.max(0,r.qty-1))].join(" | ");const{id:_,...keep}=n;await save("notes",id,{...keep,stock:lines.join("\n")})}
  toast(`Sold ${r.name}${pr?` for ${r.price}`:""}${changed?" (coins converted to make change)":""}. Added to Party Treasury.`);
}
async function stockGen(id){
  const n=rec("notes",id);if(!n||!sampleFn||AI.stockBusy)return;AI.stockBusy=true;render();
  try{const d=await sampleFn.json(`Write a shop inventory for "${n.title}" in a D&D 5e (2024 rules) campaign set in their world.${n.body?` About the shop: ${plain(n.body).slice(0,800)}`:""}
${n.stock?`Already stocked (don't repeat):\n${n.stock}\n`:""}Give 8 to 12 items with standard prices in gp/sp/cp, including at most two uncommon magic items. Reply with only a JSON object: {"items":[{"name":string,"price":string like "50 gp","qty":number}]}`,{cache:false});
    const add=(d&&Array.isArray(d.items)?d.items:[]).map(x=>[String(x.name||"").replace(/\|/g,"/"),String(x.price||""),String(num(x.qty)??1)].join(" | ")).filter(l=>l.trim()!=="|  |");
    if(add.length){const{id:_,...keep}=n;await save("notes",id,{...keep,stock:[...(n.stock?String(n.stock).split("\n"):[]),...add].join("\n").trim()});toast(`Added ${add.length} items`)}
  }catch(e){const m=e.code==="invalid_json"?"That came back garbled. Try again.":aiErr(e);if(m)toast(m)}

/* ---------- import from PDF or pasted text ---------- */
const IMP={busy:false,stage:"",text:"",name:"",items:null,undo:[]};
let pdfjsReady=null;
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error("load"));document.head.appendChild(sc)})}
function loadPdfJs(){
  if(pdfjsReady)return pdfjsReady;
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  /* the worker script runs on the page itself (sets window.pdfjsWorker), since a cross-site Worker isn't allowed here */
  pdfjsReady=loadScript(base+"pdf.min.js").then(()=>loadScript(base+"pdf.worker.min.js")).then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";return window.pdfjsLib}).catch(e=>{pdfjsReady=null;throw e});
  return pdfjsReady;
}
async function pdfText(file){
  const lib=await loadPdfJs();const buf=await file.arrayBuffer();const doc=await lib.getDocument({data:buf,isEvalSupported:false}).promise;let out=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let line="",lastY=null;const lines=[];
    for(const it of tc.items){const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2){lines.push(line);line=""}line+=it.str;lastY=y}lines.push(line);out.push(lines.join("\n"));IMP.stage=`Reading page ${i} of ${doc.numPages}…`;impRender()}

const MINUS=/[−–]/g;

function doRoll(spec){

/* making text rollable */
const SKILLS=["Acrobatics","Animal Handling","Arcana","Athletics","Deception","History","Insight","Intimidation","Investigation","Medicine","Nature","Perception","Performance","Persuasion","Religion","Sleight of Hand","Stealth","Survival","Strength","Dexterity","Constitution","Intelligence","Wisdom","Charisma","Initiative","Str","Dex","Con","Int","Wis","Cha"];

function findRollMatches(text){
  const out=[];const add=(i,len,spec)=>{if(out.some(o=>i<o.i+o.len&&o.i<i+len))return;out.push({i,len,spec})};let m;
  const ar=/(Attack Roll:\s*)([+\-−]\s?\d+)/g;while((m=ar.exec(text)))add(m.index+m[1].length,m[2].length,{kind:"attack",bonus:m[2].replace(/\s/g,"").replace(MINUS,"-")});

/* average damage */
function calcResult(c){
  const t=parseDice(c.dmg);if(!t)return null;const avg=avgTerms(t),dice=diceOnlyAvg(t),[mn,mx]=minMax(t);
  const resF=c.res==="resist"?0.5:c.res==="vuln"?2:c.res==="immune"?0:1;
  if(c.mode==="save"){const dc=+c.dc||0,sb=+c.save||0;let fail=Math.min(1,Math.max(0,(dc-1-sb)/20));const succ=1-fail;const per=(fail*avg+succ*(c.half?avg/2:0))*resF;const n=Math.max(1,+c.targets||1);
    return {mode:"save",fail,avg:avg*resF,half:c.half?avg/2*resF:0,per,total:per*n,n,mn:mn*resF,mx:mx*resF}}

  if(c.adv==="adv"){hit=1-(1-hit)**2;cr=1-(1-cr)**2}else if(c.adv==="dis"){hit=hit**2;cr=cr**2}
  const critAvg=avg+dice;const per=((hit-cr)*avg+cr*critAvg)*resF;const n=Math.max(1,+c.n||1);
  return {mode:"attack",hit,cr,avg:avg*resF,critAvg:critAvg*resF,per,total:per*n,n,mn:mn*resF,mx:mx*resF}}

const KEYS=[["/","Search"],["D","Dice tray"],["N","Quick note"],["K","Keep the open entry open"],["P","Show or hide Kept open"],["T","Table mode"],["B","Saved ideas"],["1–6","Characters, Notes, Quests, Calendar, World, Prep"],["?","This list (or the keyboard button at the top)"],["Esc","Close"],["Alt + click","On a heading: collapse or expand that whole group"]];
function showKeys(){showSheet(`<div class="sheet" role="dialog" aria-label="Keyboard shortcuts"><h2>Keyboard shortcuts</h2><table class="keys">${KEYS.map(([k,l])=>`<tr><td><kbd>${k}</kbd></td><td>${l}</td></tr>`).join("")}</table><p class="vempty">Shortcuts work when you're not typing in a box. Forgot them? Click the keyboard button at the top of the page, or press <kbd>?</kbd>. Hover over a button to see its shortcut.</p><div class="foot"><span class="grow"></span><button type="button" class="btn primary" data-act="close">Done</button></div></div>`,true)}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;const a=document.activeElement;if(a&&(a.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))return;
  const k=e.key;
  if(k==="d"||k==="D"){e.preventDefault();DICE.open?closeDice():openDice();return}
  if((k==="n"||k==="N")&&isDM()){e.preventDefault();quickNote();return}
  if(k==="k"||k==="K"){if(OPEN&&(OPEN.kind==="view"||OPEN.kind==="monster")){e.preventDefault();pinToggle(OPEN.kind==="monster"?"monsters":OPEN.type,OPEN.id)}return}
  if(k==="p"||k==="P"){e.preventDefault();DOCK_OPEN=!DOCK_OPEN;pinsSave();renderDock();return}
  if((k==="t"||k==="T")&&isDM()){e.preventDefault();document.querySelector(TM?"[data-act=tmExit]":"[data-act=tmOpen]")?.click();return}
  if(/^[1-7]$/.test(k)&&!TM){e.preventDefault();const vis=TABS.filter(([x])=>((x!=="prep"&&x!=="command")||isDM())&&(x!=="home"||!isDM()));const t=vis[+k-1];if(t){closeSheet();location.hash=t[0]}return}
  if((k==="b"||k==="B")&&isDM()&&!TM){e.preventDefault();closeSheet();U.prepTab="ideas";if(location.hash!=="#prep")location.hash="prep";else render();return}

  if(k==="?"){e.preventDefault();showKeys();return}
});

/* rules on hover */
const RULES={
  Blinded:"Can't see; automatically fails checks that need sight. Attacks against it have Advantage; its attacks have Disadvantage.",
  Charmed:"Can't attack or target the charmer with harmful effects. The charmer has Advantage on social checks against it.",
  Deafened:"Can't hear; automatically fails checks that need hearing.",
  Exhaustion:"Each level: −2 to every D20 Test and −5 ft. Speed. A Long Rest removes one level; level 6 is death.",
  Frightened:"Disadvantage on ability checks and attacks while the source is in sight. Can't willingly move closer to it.",
  Grappled:"Speed 0. Disadvantage on attacks against anyone but the grappler. The grappler can drag it (moving costs extra).",
  Incapacitated:"Can't take actions, Bonus Actions or Reactions. Concentration breaks; can't speak. Disadvantage on Initiative.",
  Invisible:"Can't be seen without magic. Advantage on Initiative. Attacks against it have Disadvantage; its attacks have Advantage.",
  Paralyzed:"Incapacitated and Speed 0. Fails Str and Dex saves. Attacks against it have Advantage; hits from within 5 ft. are crits.",
  Petrified:"Turned to stone and Incapacitated. Fails Str and Dex saves, resists all damage, immune to poison. Attacks against it have Advantage.",
  Poisoned:"Disadvantage on attack rolls and ability checks.",
  Prone:"Can only crawl or spend half its Speed to stand. Disadvantage on attacks. Attacks within 5 ft. have Advantage; farther ones have Disadvantage.",
  Restrained:"Speed 0. Disadvantage on attacks and Dex saves. Attacks against it have Advantage.",
  Stunned:"Incapacitated. Fails Str and Dex saves. Attacks against it have Advantage.",
  Unconscious:"Incapacitated and Prone; drops what it holds. Fails Str and Dex saves. Attacks have Advantage; hits from within 5 ft. are crits.",
  Bloodied:"At half its Hit Points or fewer.",
  Concentrating:"Taking damage needs a Con save (DC 10 or half the damage, max 30) to keep the spell. Ends if Incapacitated.",
  Concentration:"Taking damage needs a Con save (DC 10 or half the damage, max 30) to keep the spell. Ends if Incapacitated."};
const RULE_RE=new RegExp("\\b("+Object.keys(RULES).join("|")+")\\b","g");
function rulifyIn(root){if(!root)return;root.querySelectorAll(".prose,.statblock").forEach(scope=>{if(scope.closest("[contenteditable],.rte,form"))return;
  const w=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue&&RULE_RE.test(n.nodeValue)&&(RULE_RE.lastIndex=0,true)&&!(n.parentElement&&n.parentElement.closest("a,button,textarea,input,.rl,.rule,h1,h2,h3,[contenteditable]"))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;RULE_RE.lastIndex=0;let m,last=0;const f=document.createDocumentFragment();while((m=RULE_RE.exec(t))){f.appendChild(document.createTextNode(t.slice(last,m.index)));const s=document.createElement("span");s.className="rule";s.dataset.rule=m[1];s.textContent=m[0];s.tabIndex=0;f.appendChild(s);last=m.index+m[0].length}f.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(f,n)})})}
let RULE_TIP=null;
function showRule(el){const r=RULES[el.dataset.rule||el.dataset.cond];if(!r)return;if(!RULE_TIP){RULE_TIP=document.createElement("div");RULE_TIP.id="ruletip";RULE_TIP.setAttribute("role","tooltip");document.body.appendChild(RULE_TIP)}
  RULE_TIP.innerHTML=`<b>${esc(el.dataset.rule||el.dataset.cond)}</b> ${esc(r)}`;RULE_TIP.hidden=false;const b=el.getBoundingClientRect();const w=Math.min(300,innerWidth-24);RULE_TIP.style.width=w+"px";
  let left=Math.max(12,Math.min(innerWidth-w-12,b.left+b.width/2-w/2));RULE_TIP.style.left=left+"px";const h=RULE_TIP.offsetHeight;RULE_TIP.style.top=(b.top>h+14?b.top-h-8:b.bottom+8)+"px"}
function hideRule(){if(RULE_TIP)RULE_TIP.hidden=true}
document.addEventListener("mouseover",e=>{const el=e.target.closest(".rule,.cond");if(el)showRule(el);else if(!e.target.closest("#ruletip"))hideRule()});
document.addEventListener("focusin",e=>{const el=e.target.closest(".rule");if(el)showRule(el)});
document.addEventListener("click",e=>{const el=e.target.closest(".rule");if(el){e.stopPropagation();showRule(el)}else if(!e.target.closest("#ruletip"))hideRule()},true);

/* reveal checklist */
function revealItems(plan){return String(plan?.reveals||"").split("\n").map(s=>s.trim()).filter(Boolean).map((l,i)=>({i,done:/^\[x\]\s*/i.test(l),text:l.replace(/^\[[ x]?\]\s*/i,"")}))}
function revealList(plan){const it=revealItems(plan);if(!it.length)return "";return `<section class="tm-s rev"><h3>Reveal checklist <span class="mono">${it.filter(x=>x.done).length}/${it.length}</span></h3><ul class="revl">${it.map(x=>`<li class="${x.done?"done":""}"><label><input type="checkbox" data-reveal="${plan.id}|${x.i}" ${x.done?"checked":""}><span>${linkify(esc(x.text),"")}</span></label></li>`).join("")}</ul></section>`}
async function toggleReveal(pid,i,on){const p=rec("plans",pid);if(!p)return;const lines=String(p.reveals||"").split("\n").map(s=>s.trim()).filter(Boolean);if(!lines[i])return;const t=lines[i].replace(/^\[[ x]?\]\s*/i,"");learnFromReveal(pid,i,on,t);lines[i]=(on?"[x] ":"")+t;const{id:_,...r}=p;await save("plans",pid,{...r,reveals:lines.join("\n")})}
document.addEventListener("change",e=>{const el=e.target.closest("[data-reveal]");if(!el)return;const [pid,i]=el.dataset.reveal.split("|");el.closest("li")?.classList.toggle("done",el.checked);toggleReveal(pid,+i,el.checked)},true);
function revealsFor(n){const p=S.plans.find(x=>num(x.session)===n);const done=revealItems(p).filter(x=>x.done).map(x=>x.text);const l=logFor(n);const loot=(l&&Array.isArray(l.lootLog)?l.lootLog:[]).map(x=>x.text);
  return (done.length?`\nRevealed to the players this session (from the DM's checklist):\n${done.map(x=>"- "+x).join("\n")}\n`:"")+(loot.length?`\nLoot found this session:\n${loot.map(x=>"- "+x).join("\n")}\n`:"")}

/* session clock */
let CLOCK={start:null,acc:0,running:false,lastBreak:0};try{const c=JSON.parse(localStorage.getItem("dmdesk-clock")||"null");if(c)CLOCK={...CLOCK,...c}}catch(e){}
function clockSave(){try{localStorage.setItem("dmdesk-clock",JSON.stringify(CLOCK))}catch(e){}}
function clockMs(){return CLOCK.acc+(CLOCK.running&&CLOCK.start?Date.now()-CLOCK.start:0)}
function fmtClock(ms){const m=Math.floor(ms/60000);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`}
function quietPCs(){const n=rcSession();const l=logFor(n);const had=new Set(l&&l.spotlight||[]);return S.characters.filter(x=>x.kind==="pc"&&!had.has(x.id))}
function clockHtml(){const ms=clockMs();const q=ms>=45*60000?quietPCs():[];
  return `<span class="sclock ${CLOCK.running?"on":""}"><b id="sclock-t">${fmtClock(ms)}</b><button class="btn sm" data-clock="${CLOCK.running?"pause":"start"}">${CLOCK.running?"Pause clock":ms?"Resume clock":"Start session clock"}</button>${ms&&!CLOCK.running?'<button class="btn sm" data-clock="reset">Reset</button>':""}</span>${q.length&&q.length<S.characters.filter(x=>x.kind==="pc").length?`<span class="quiet">Quiet so far: ${q.map(p=>`<button type="button" data-quiet="${p.id}" title="Mark ${esc(p.name)} as having had the spotlight">${esc((p.name||"").split(/[ "]/)[0])}</button>`).join("")}</span>`:""}`}
document.addEventListener("click",async e=>{const c=e.target.closest("[data-clock]");if(c){e.stopPropagation();const a=c.dataset.clock;if(a==="start"){CLOCK.start=Date.now();CLOCK.running=true}else if(a==="pause"){CLOCK.acc=clockMs();CLOCK.running=false;CLOCK.start=null}else{CLOCK={start:null,acc:0,running:false,lastBreak:0}}clockSave();if(TM)renderTable();return}
  const q=e.target.closest("[data-quiet]");if(q){e.stopPropagation();await toggleSpot(q.dataset.quiet,rcSession(),true);toast("Marked as having had the spotlight");if(TM)renderTable()}},true);
setInterval(()=>{if(!CLOCK.running)return;const ms=clockMs();const t=document.getElementById("sclock-t");if(t)t.textContent=fmtClock(ms);const per=90*60000;if(ms-CLOCK.lastBreak>=per){CLOCK.lastBreak=Math.floor(ms/per)*per;clockSave();toast(`You've been playing ${fmtClock(ms)}. Good time for a break?`)}},20000);

/* loot log */
const COIN_RE=/(\d[\d,]*)\s*(pp|gp|ep|sp|cp)\b/gi;
async function logLoot(text){const n=rcSession();let m,coins={};COIN_RE.lastIndex=0;while((m=COIN_RE.exec(text)))coins[m[2].toLowerCase()]=(coins[m[2].toLowerCase()]||0)+num(m[1].replace(/,/g,""));
  const rest=text.replace(COIN_RE,"").replace(/^[\s,;+and]+|[\s,;+and]+$/gi,"").trim();
  if(Object.keys(coins).length){const purse={pp:0,gp:0,ep:0,sp:0,cp:0,...(S.settings.purse||{})};for(const k in coins)purse[k]=(num(purse[k])||0)+coins[k];await save("settings","purse",purse)}
  if(rest){const qm=rest.match(/^(\d+)\s*[x×]?\s+(.+)$/i);await save("loot",uid(),{name:qm?qm[2]:rest,qty:qm?num(qm[1]):1,holder:"party",notes:`Found in session ${n}.`,dmOnly:false})}
  const l=logFor(n)||{};const{id:_i,dmOnly:_d,secret:_s,...keep}=l;const lootLog=[...(Array.isArray(keep.lootLog)?keep.lootLog:[]),{at:Date.now(),text}];
  await save("logs","s"+n,{...keep,session:n,notes:keep.notes??rcNotesVal(n)??"",open:keep.open||"",spotlight:keep.spotlight||[],lootLog});
  toast(Object.keys(coins).length&&rest?"Added to the treasury and loot":Object.keys(coins).length?"Added to the treasury":"Added to party loot")}
function lootSection(){const n=rcSession();const l=logFor(n);const ll=(l&&Array.isArray(l.lootLog)?l.lootLog:[]);
  return `<section class="tm-s"><h3>Loot this session</h3><form class="lootq" data-lootq="1"><input id="lootq-in" placeholder="e.g. 120 gp, or Potion of Healing" autocomplete="off" aria-label="Loot found"><button class="btn sm primary" type="submit">Add</button></form>${ll.length?`<ul class="lootl">${ll.slice().reverse().map(x=>`<li>${esc(x.text)}</li>`).join("")}</ul>`:'<p class="vempty">Coins go to the treasury; items go to party loot.</p>'}</section>`}
document.addEventListener("submit",async e=>{const f=e.target.closest("[data-lootq]");if(!f)return;e.preventDefault();e.stopPropagation();const v=document.getElementById("lootq-in").value.trim();if(!v)return;document.getElementById("lootq-in").value="";await logLoot(v);if(TM)renderTable()},true);

/* party strip */
function partyStrip(){const pcs=S.characters.filter(x=>x.kind==="pc").sort((a,b)=>(a.name||"").localeCompare(b.name||""));if(!pcs.length)return "";
  return `<div class="pstrip">${pcs.map(p=>{const S2=p.sheet?parseSheet(p.sheet):null;const nm=(p.name||"").split(/[ "]/)[0];const pv=n=>{if(!S2)return n==="Perception"?(p.pp??"–"):"–";const sk=S2.skills.find(s=>s.name===n);return sk?10+sk.bonus:10+S2.abil[SKILL_AB[n]].mod};const conds=String(p.conditions||"").split(",").filter(Boolean);
    return `<div class="ps"><button type="button" class="ps-n" data-act="view" data-type="characters" data-id="${p.id}">${avatar(p,30)}<b>${esc(nm)}</b><span>AC ${p.ac??"–"}</span></button>

async function copyText(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg||"Copied. Paste it into Roll20 chat.")}catch(_){const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;left:-9999px";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?(msg||"Copied. Paste it into Roll20 chat."):"Couldn't copy here. Select the text instead.")}}
const r20=s=>String(s||"").replace(/\s*\n+\s*/g," ").replace(/\*\*|__/g,"").trim();
function descCmd(text){return "/desc "+r20(plain(text))}
document.addEventListener("click",e=>{const c=e.target.closest("[data-copy20]");if(!c)return;e.preventDefault();e.stopPropagation();const kind=c.dataset.copy20;
  if(kind==="desc"){const src=c.dataset.src==="last"?lastTimeText():c.dataset.src==="opener"?(rec("plans",c.dataset.id)?.opener||""):c.closest("section,.lt-card")?.querySelector(".prose")?.innerText||"";copyText(descCmd(src))}
  else if(kind==="say"){const inp=c.closest(".say20")?.querySelector("input");const x=S.characters.find(y=>y.id===c.dataset.id);if(!inp||!inp.value.trim()||!x)return;copyText(`/desc ${x.name}: “${inp.value.trim()}”`);inp.value=""}
  else if(kind==="em"){const inp=c.closest(".say20")?.querySelector("input");const x=S.characters.find(y=>y.id===c.dataset.id);if(!inp||!inp.value.trim()||!x)return;copyText(`/desc ${x.name} ${inp.value.trim()}`);inp.value=""}
  else if(kind==="roll"){const en=DICE.log[+c.dataset.i];if(!en)return;const rows=[];const at=en.items.find(x=>x.kind==="attack");if(at)rows.push(`{{To hit=[[1d20${at.expr.replace(/^d20/,"")}]]}}`);en.items.filter(x=>x.kind!=="attack").forEach(x=>rows.push(`{{${x.kind==="damage"?(x.type?CAP(x.type):"Damage"):x.kind==="check"?"Roll":"Roll"}=[[${x.expr}]]}}`));
    copyText(rows.length===1&&!at&&en.items.length===1?`/r ${en.items[0].expr}`:`&{template:default} {{name=${en.label||"Roll"}}} ${rows.join(" ")}`,"Copied as a Roll20 roll. Paste it into chat.")}
},true);

/* twist list */
function twistItems(plan){return String(plan?.twists||"").split("\n").map(s=>s.trim()).filter(Boolean).map((l,i)=>({i,used:/^\[x\]\s*/i.test(l),text:l.replace(/^\[[ x]?\]\s*/i,"")}))}
function twistSection(plan){const it=twistItems(plan);if(!plan)return "";return `<section class="tm-s twists"><h3>Twists <span class="mono">${it.filter(x=>!x.used).length} left</span></h3>${it.length?`<ul class="twl">${it.map(x=>`<li class="${x.used?"used":""}"><span>${linkify(esc(x.text),"")}</span>${x.used?'<em>used</em>':`<button type="button" class="btn sm" data-twist="${plan.id}|${x.i}">Use</button>`}</li>`).join("")}</ul>${it.some(x=>!x.used)?`<button type="button" class="btn sm" data-twistrand="${plan.id}">Random twist</button>`:""}`:`<p class="vempty">Add a few to the session plan's Twists field for when energy dips.</p>`}</section>`}
async function useTwist(pid,i){const p=rec("plans",pid);if(!p)return;const lines=String(p.twists||"").split("\n").map(s=>s.trim()).filter(Boolean);if(!lines[i])return;const t=lines[i].replace(/^\[[ x]?\]\s*/i,"");lines[i]="[x] "+t;const{id:_,...r}=p;await save("plans",pid,{...r,twists:lines.join("\n")});await addSessionLine("Twist: "+t);toast("Twist used and noted")}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-twist]");if(t){e.stopPropagation();const[p,i]=t.dataset.twist.split("|");await useTwist(p,+i);if(TM)renderTable();return}
  const r=e.target.closest("[data-twistrand]");if(r){e.stopPropagation();const p=rec("plans",r.dataset.twistrand);const left=twistItems(p).filter(x=>!x.used);if(!left.length)return;const x=pick(left);showSheet(`<div class="sheet" role="dialog" aria-label="Random twist"><h2>Twist</h2><p class="twist-big">${linkify(esc(x.text),"")}</p><div class="foot"><span class="grow"></span><button type="button" class="btn" data-act="close">Not now</button><button type="button" class="btn primary" data-twist="${p.id}|${x.i}" data-act="close">Use it</button></div></div>`,true)}},true);

/* spell lookup */
const SPELLQ={busy:{}};
function spellDoc(){return rec("meta","spells")||{}}
function spellKey(n){return String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
async function spellInfo(name){const k=spellKey(name);const d=spellDoc();if(d[k])return d[k];if(!sampleFn)return null;if(SPELLQ.busy[k])return SPELLQ.busy[k];
  SPELLQ.busy[k]=(async()=>{try{const t=await sampleFn(`Summarize the D&D 2024 (5.5e) spell "${name}" for a DM at the table, in your own words. Use exactly these lines, short:\nLevel & school:\nCasting time:\nRange:\nComponents:\nDuration:\nEffect: (2-3 sentences: who it affects, save or attack, damage or effect)\nHigher levels: (one line, or "None")\nIf it isn't a real spell, say "Unknown spell" only.`,{cache:true});const txt=String(typeof t==="string"?t:(t&&t.text)||"").trim();if(txt){const cur=spellDoc();const{id:_,...keep}=cur;await save("meta","spells",{...keep,[k]:txt})}return txt}catch(e){return null}finally{delete SPELLQ.busy[k]}})();return SPELLQ.busy[k]}
let SPELLPOP=null;
async function showSpell(el){const name=el.dataset.spell;if(!SPELLPOP){SPELLPOP=document.createElement("div");SPELLPOP.id="spellpop";document.body.appendChild(SPELLPOP)}
  const place=()=>{const b=el.getBoundingClientRect();const w=Math.min(340,innerWidth-24);SPELLPOP.style.width=w+"px";SPELLPOP.style.left=Math.max(12,Math.min(innerWidth-w-12,b.left))+"px";const h=SPELLPOP.offsetHeight;SPELLPOP.style.top=Math.max(12,(b.bottom+h+10<innerHeight?b.bottom+6:b.top-h-6))+"px"};
  const k=spellKey(name);const cached=spellDoc()[k];
  SPELLPOP.innerHTML=`<div class="sp-h"><b>${esc(name)}</b><button type="button" class="btn icon" data-spclose aria-label="Close">✕</button></div><div class="sp-b">${cached?spellBody(cached):sampleFn?'<p class="vempty">Looking it up…</p>':'<p class="vempty">No saved summary for this spell.</p>'}</div>`;SPELLPOP.hidden=false;place();
  if(!cached&&sampleFn){const t=await spellInfo(name);if(SPELLPOP.hidden||!SPELLPOP.querySelector(".sp-h b")||SPELLPOP.querySelector(".sp-h b").textContent!==name)return;SPELLPOP.querySelector(".sp-b").innerHTML=t?spellBody(t):'<p class="vempty">Couldn\'t look that up. Try again.</p>';place()}}
function spellBody(t){return `<div class="sp-lines">${String(t).split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([A-Za-z &]+):\s*(.*)$/);return m?`<div><b>${esc(m[1])}.</b> ${esc(m[2])}</div>`:`<div>${esc(l)}</div>`}).join("")}</div><small class="sp-note">Saved summary.</small>`}
document.addEventListener("click",e=>{const s=e.target.closest("[data-spell]");if(s){e.preventDefault();e.stopPropagation();showSpell(s);return}if(e.target.closest("[data-spclose]")||(SPELLPOP&&!SPELLPOP.hidden&&!e.target.closest("#spellpop"))){if(SPELLPOP)SPELLPOP.hidden=true}},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SPELLPOP&&!SPELLPOP.hidden){SPELLPOP.hidden=true;e.stopPropagation()}},true);

/* timers */
let TIMERS=[];try{TIMERS=JSON.parse(localStorage.getItem("dmdesk-timers")||"[]")}catch(e){}
function timersSave(){try{localStorage.setItem("dmdesk-timers",JSON.stringify(TIMERS))}catch(e){}}
function timerLeft(t){return t.kind==="rounds"?t.left:Math.max(0,Math.round((t.end-Date.now())/1000))}
function fmtLeft(t){if(t.kind==="rounds")return `${t.left} round${t.left===1?"":"s"}`;const s=timerLeft(t);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`:`${m}:${String(ss).padStart(2,"0")}`}
function timerSection(){return `<section class="tm-s timers"><h3>Timers</h3><form class="tmr-f" data-tmrform="1"><input id="tmr-l" placeholder="What's running out? e.g. Torch" autocomplete="off" aria-label="Timer label"><input id="tmr-n" type="number" min="1" value="10" aria-label="Amount"><select id="tmr-u" aria-label="Unit"><option value="rounds">rounds</option><option value="min" selected>minutes</option><option value="hour">hours</option></select><button class="btn sm primary" type="submit">Start</button></form>
  <div class="tmr-pre">${[["1 min spell","rounds",10],["Torch","hour",1],["10 min","min",10],["Short rest","hour",1],["Concentration 1 hr","hour",1]].map(([l,u,n])=>`<button type="button" class="chip sm" data-tmrpre="${esc(l)}|${u}|${n}">${esc(l)}</button>`).join("")}</div>
  ${TIMERS.length?`<ul class="tmr-l">${TIMERS.map(t=>`<li class="${timerLeft(t)<=0?"done":""}"><b>${esc(t.label)}</b><span class="tmr-left" data-tid="${t.id}">${timerLeft(t)<=0?"Done":fmtLeft(t)}</span><button type="button" class="btn icon" data-tmrx="${t.id}" aria-label="Remove">✕</button></li>`).join("")}</ul>${TIMERS.some(t=>t.kind==="rounds"&&t.left>0)?'<button type="button" class="btn sm" data-tmrround>Next round</button>':""}`:""}</section>`}
function addTimer(label,unit,n){n=Math.max(1,num(n)||1);const t={id:uid(),label:label||"Timer",kind:unit==="rounds"?"rounds":"real",fired:false};if(t.kind==="rounds")t.left=n;else t.end=Date.now()+n*(unit==="hour"?3600:60)*1000;TIMERS.push(t);timersSave();if(TM)renderTable();toast(`${t.label}: ${fmtLeft(t)}`)}
document.addEventListener("submit",e=>{const f=e.target.closest("[data-tmrform]");if(!f)return;e.preventDefault();e.stopPropagation();addTimer(document.getElementById("tmr-l").value.trim(),document.getElementById("tmr-u").value,document.getElementById("tmr-n").value)},true);
document.addEventListener("click",e=>{const p=e.target.closest("[data-tmrpre]");if(p){e.stopPropagation();const[l,u,n]=p.dataset.tmrpre.split("|");addTimer(l,u,n);return}
  const x=e.target.closest("[data-tmrx]");if(x){e.stopPropagation();TIMERS=TIMERS.filter(t=>t.id!==x.dataset.tmrx);timersSave();if(TM)renderTable();return}
  if(e.target.closest("[data-tmrround]")){e.stopPropagation();TIMERS.forEach(t=>{if(t.kind==="rounds"&&t.left>0){t.left--;if(t.left===0&&!t.fired){t.fired=true;toast(`${t.label} has run out`)}}});timersSave();if(TM)renderTable()}},true);
setInterval(()=>{let changed=false;TIMERS.forEach(t=>{if(t.kind==="real"){const el=document.querySelector(`.tmr-left[data-tid="${t.id}"]`);if(el)el.textContent=timerLeft(t)<=0?"Done":fmtLeft(t);if(timerLeft(t)<=0&&!t.fired){t.fired=true;changed=true;toast(`${t.label} has run out`);el&&el.closest("li")?.classList.add("done")}}});if(changed)timersSave()},1000);

/* last time on */
/* "last time" = the newest recap from before the session you're about to run (the next unplayed plan), or simply the newest recap */
function lastRecap(){const recaps=S.notes.filter(x=>x.category==="session").sort((a,b)=>(b.session||0)-(a.session||0));const up=S.plans.filter(p=>p.status!=="played"&&num(p.session)).sort((a,b)=>num(a.session)-num(b.session))[0];const n=up?num(up.session):Infinity;return recaps.find(x=>(x.session||0)<n)||recaps[0]||null}
function lastTimeText(){const r=lastRecap();if(!r)return "";const t=plain(r.body||"");const cut=t.search(/\n\s*(As the scene fades|As the scene opens)/i);return (cut>0?t.slice(0,cut):t).trim()}
function lastTimeCard(plan){const r=lastRecap();if(!r)return "";const t=lastTimeText();
  return `<section class="tm-s lt-card"><h3>Last time on ${esc(S.settings.campaign?.name||"the campaign")}</h3><div class="prose vprose lt-text">${rich(t.length>900?t.slice(0,900).replace(/\s+\S*$/,"")+"…":t)}</div><div class="lt-acts"><button type="button" class="btn sm" data-copy20="desc" data-src="last">Copy for Roll20 chat</button><button type="button" class="btn sm" data-act="open" data-type="notes" data-id="${r.id}">Full ${esc(r.title||"recap")}</button>${plan&&plan.opener?`<button type="button" class="btn sm" data-copy20="desc" data-src="opener" data-id="${plan.id}">Copy scene opener</button>`:""}</div></section>`}

/* wrap-up */
const WRAP={step:null,active:false};
async function wrapAll(){
  closeSheet();if(TM)document.querySelector("[data-act=tmExit]")?.click();U.prepTab="plan";if(location.hash!=="#prep")location.hash="prep";
  const n=rcSession();WRAP.active=true;WRAP.step="Writing the session "+n+" recap…";render();
  await recapGo();
  if(!AI.recap||!AI.recap.trim()){WRAP.active=false;WRAP.step=null;render();return}
  WRAP.step="Saving the recap and reading it for everything else it changes…";render();
  const plan=S.plans.find(p=>num(p.session)===n&&p.status!=="played");if(plan){const{id,...r}=plan;await save("plans",id,{...r,status:"played"})}
  await recapSave();
  WRAP.step=null;render();document.querySelector("#app .fup")?.scrollIntoView({block:"start",behavior:"smooth"});
}
function wrapUp(){const n=rcSession();const notes=noteLines(rcNotesVal(n)).length;const plan=S.plans.find(p=>num(p.session)===n);const rev=revealItems(plan).filter(x=>x.done).length;const l=logFor(n);const loot=(l&&l.lootLog||[]).length;const ms=clockMs();
  const sched=S.settings.schedule||{};
  showSheet(`<div class="sheet" role="dialog" aria-label="Wrap up the session"><h2>Wrap up session ${n}</h2>
    <ul class="wrap-sum"><li><b>${ms?fmtClock(ms):"–"}</b> played</li><li><b>${notes}</b> note line${notes===1?"":"s"}</li><li><b>${rev}</b> reveal${rev===1?"":"s"}</li><li><b>${loot}</b> loot entr${loot===1?"y":"ies"}</li></ul>
    ${sampleFn?`<section class="wrap-s wrap-all"><h3>Do it all</h3><p class="tool-d">Writes and saves the session ${n} recap, then gathers everything it changes into one list to review: what the party learned, milestones reached, calendar events and the date, and updates to characters, threads and clocks. A Checkup runs after you apply.</p><button type="button" class="btn primary" data-wrap="all" ${notes?"":"disabled"}>Wrap it all up</button></section><p class="label">Or step by step</p>`:""}
    <section class="wrap-s"><h3>1. Recap</h3><p class="tool-d">Writes the session ${n} recap from your notes, reveals, loot and encounter results, then shows the follow-up suggestions for the rest of the Desk.</p><button type="button" class="btn primary" data-wrap="recap" ${sampleFn&&notes?"":"disabled"}>Write the recap</button>${!notes?'<p class="vempty">Add a quick note or two first.</p>':""}</section>
    <section class="wrap-s"><h3>2. Calendar</h3><p class="tool-d">Today in the world: <b>${esc(fmtDate(cal(),cal().today))}</b>.</p><div class="wrap-row"><button type="button" class="btn sm" data-act="day" data-n="1">+1 day</button><button type="button" class="btn sm" data-act="day" data-n="week">+1 ${esc(cal().weekName||"week")}</button><button type="button" class="btn sm" data-wrap="calsync">Update from notes</button></div></section>
    <section class="wrap-s"><h3>3. Next game</h3><div class="wrap-row"><input type="datetime-local" id="wrap-next" value="${esc(sched.next||"")}" aria-label="Next game"><button type="button" class="btn sm" data-wrap="next">Save</button></div><p class="vempty">Your pre-game brief arrives the day before.</p></section>
    ${plan&&plan.status!=="played"?`<section class="wrap-s"><h3>4. Session plan</h3><button type="button" class="btn sm" data-wrap="played" data-id="${plan.id}">Mark "${esc(plan.title||"plan")}" as played</button></section>`:""}
    <div class="foot"><span class="grow"></span><button type="button" class="btn" data-act="close">Done</button></div></div>`,true)}
document.addEventListener("click",async e=>{const w=e.target.closest("[data-wrap]");if(!w){if(e.target.closest("[data-act=wrapUp]")){e.stopPropagation();if(CLOCK.running){CLOCK.acc=clockMs();CLOCK.running=false;CLOCK.start=null;clockSave()}wrapUp()}return}
  e.stopPropagation();const a=w.dataset.wrap;
  if(a==="all"){wrapAll();return}
  if(a==="recap"){closeSheet();if(TM)document.querySelector("[data-act=tmExit]")?.click();U.prepTab="plan";if(location.hash!=="#prep")location.hash="prep";setTimeout(()=>{render();recapGo();document.querySelector("#app .tools")?.scrollIntoView({block:"start"})},150)}
  else if(a==="calsync"){closeSheet();if(TM)document.querySelector("[data-act=tmExit]")?.click();if(location.hash!=="#calendar")location.hash="calendar";setTimeout(()=>calSyncGo(false),200)}
  else if(a==="next"){const v=document.getElementById("wrap-next").value;await save("settings","schedule",{...(S.settings.schedule||{}),next:v});toast(v?"Next game saved":"Next game cleared")}
  else if(a==="played"){const pl=rec("plans",w.dataset.id);if(pl){const{id,...r}=pl;await save("plans",id,{...r,status:"played"});w.disabled=true;w.textContent="Marked as played"}}},true);

/* ---------- expand / collapse ---------- */
let CZ=new Set();try{CZ=new Set(JSON.parse(localStorage.getItem("dmdesk-collapsed")||"[]"))}catch(e){}
function czSave(){try{localStorage.setItem("dmdesk-collapsed",JSON.stringify([...CZ].slice(-400)))}catch(e){}}
const CZ_RULES=[
  {sel:".tm-s > h3",g:"tm",wrap:true},{sel:".pl-s > h4",g:"plan",wrap:true},{sel:".side > h4",g:"side",wrap:true},
  {sel:"h3.vh",g:"view",stop:"h3.vh,.taper"},{sel:"h3.section-h",g:"list",stop:"h3.section-h"},
  {sel:"h4.sb-h",g:"sb",stop:"h4.sb-h,.taper"},{sel:"h4.cs-h",g:"cs",stop:"h4.cs-h"},
  {sel:".prose > h1, .prose > h2, .prose > h3, .prose > h4, .prose > h5",g:"prose",level:true}];
const czText=h=>{const c=h.cloneNode(true);c.querySelectorAll("button,.mono,small,.pill").forEach(x=>x.remove());return c.textContent.toLowerCase().replace(/[\d/·:]+/g," ").replace(/\s+/g," ").trim()};
function czKey(h,r){const ctx=r.g==="list"||r.g==="prose"?(location.hash||"#")+":":"";const own=r.g==="prose"?(h.closest("[data-pintype]")?"pin":h.closest("#modal")?"modal":"app")+":":"";return r.g+":"+ctx+own+czText(h)}
function czRange(h,r){const out=[];if(r.wrap){let n=h.nextElementSibling;while(n){out.push(n);n=n.nextElementSibling}return out}
  const lv=r.level?+h.tagName[1]:0;let n=h.nextElementSibling;while(n){if(r.level){if(/^H[1-6]$/.test(n.tagName)&&+n.tagName[1]<=lv)break}else if(n.matches(r.stop)||n.querySelector(r.stop))break;out.push(n);n=n.nextElementSibling}return out}
function czApply(root){if(!root)return;CZ_RULES.forEach(r=>root.querySelectorAll(r.sel).forEach(h=>{if(h.closest("[contenteditable],form,.rte,#dicetray"))return;const k=czKey(h,r);const range=czRange(h,r);if(!range.length&&!h.classList.contains("cz"))return;
  h.classList.add("cz");h.dataset.czk=k;h.dataset.czg=r.g;h.setAttribute("role","button");h.tabIndex=0;const shut=CZ.has(k);h.setAttribute("aria-expanded",!shut);h.classList.toggle("cz-shut",shut);range.forEach(n=>n.classList.toggle("cz-hide",shut))}));try{czToggleLabel()}catch(e){}}
function czToggle(h){const k=h.dataset.czk;if(!k)return;CZ.has(k)?CZ.delete(k):CZ.add(k);czSave();const scope=h.closest("#app,#modal,#tablemode,#pindock")||document;czApply(scope)}
document.addEventListener("click",e=>{const h=e.target.closest(".cz");if(!h||e.target.closest("a,button,input,select,label,.rl,.rule")&&e.target.closest("a,button,input,select,label,.rl,.rule")!==h)return;
  if(e.altKey){const sib=[...h.parentElement.parentElement.querySelectorAll(`.cz[data-czg="${h.dataset.czg}"]`)];const shut=!CZ.has(h.dataset.czk);sib.forEach(x=>{shut?CZ.add(x.dataset.czk):CZ.delete(x.dataset.czk)});czSave();czApply(h.closest("#app,#modal,#tablemode,#pindock")||document);return}
  czToggle(h)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("cz")){e.preventDefault();czToggle(e.target)}});
/* re-fold collapsed sections right away, before the browser paints, so a redraw never flashes them open */
let czBusy=false;const czObs=new MutationObserver(recs=>{if(czBusy)return;const roots=new Set();recs.forEach(r=>{const el=r.target.nodeType===1?r.target:r.target.parentElement;const root=el&&el.closest("#app,#modal,#tablemode,#pindock");if(root)roots.add(root)});czBusy=true;try{roots.forEach(czApply)}finally{czObs.takeRecords();czBusy=false}});
["app","modal","tablemode"].forEach(id=>{const el=document.getElementById(id);if(el)czObs.observe(el,{childList:true,subtree:true})});
setTimeout(()=>{const d=document.getElementById("pindock");if(d)czObs.observe(d,{childList:true,subtree:true})},60);
function czAll(scopeSel,shut){const sc=document.querySelector(scopeSel);if(!sc)return;sc.querySelectorAll(".cz").forEach(h=>{shut?CZ.add(h.dataset.czk):CZ.delete(h.dataset.czk)});czSave();czApply(sc)}
document.addEventListener("toggle",e=>{const d=e.target;if(!(d instanceof HTMLDetailsElement)||!d.classList.contains("more")||!d.open)return;const m=d.querySelector(".more-m");if(!m)return;m.style.left="";m.style.right="";const r=m.getBoundingClientRect(),W=document.documentElement.clientWidth;if(r.left<12){m.style.left="0";m.style.right="auto"}const r2=m.getBoundingClientRect();if(r2.right>W-12){const shift=r2.right-(W-12);m.style.left=(parseFloat(getComputedStyle(m).left)||0)-shift+"px";m.style.right="auto"}},true);
document.addEventListener("click",e=>{const inMenu=e.target.closest("details.more");document.querySelectorAll("details.more[open]").forEach(d=>{if(d!==inMenu||e.target.closest(".mi"))d.open=false})},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-cztoggle]");if(!b)return;e.stopPropagation();const sel=b.dataset.cztoggle;const root=document.querySelector(sel);const anyOpen=!!root&&[...root.querySelectorAll(".cz")].some(h=>!h.classList.contains("cz-shut"));czAll(sel,anyOpen);b.textContent=anyOpen?"Expand all":"Collapse all";czToggleLabel()},true);
function czToggleLabel(){document.querySelectorAll("[data-cztoggle]").forEach(b=>{const root=document.querySelector(b.dataset.cztoggle);if(!root)return;const hs=[...root.querySelectorAll(".cz")];if(hs.length){const want=hs.some(h=>!h.classList.contains("cz-shut"))?"Collapse all":"Expand all";if(b.textContent!==want)b.textContent=want}})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-czall]");if(!b)return;e.stopPropagation();const [sel,mode]=b.dataset.czall.split("|");czAll(sel,mode==="shut")},true);



/* ================= Rules for Claude: standing instructions every Claude feature reads first ================= */
const rulesDoc=()=>rec("meta","rules")||{list:[]};
const rulesList=()=>JSON.parse(JSON.stringify(rulesDoc().list||[]));
async function rulesStore(list){const d=rulesDoc();const{id:_,...keep}=d;await save("meta","rules",{...keep,list:list.slice(0,80)})}
async function ruleAdd(text){text=String(text||"").trim().replace(/\s+/g," ");if(!text)return;const list=rulesList();if(list.some(r=>r.text.toLowerCase()===text.toLowerCase())){toast("That rule is already there");return}list.push({id:uid(),text,at:Date.now()});await rulesStore(list);toast("Rule added. Claude will follow it from now on.")}
function rulesPreamble(){const L=(rulesDoc().list||[]).map(r=>r.text).filter(Boolean);return "WRITING FOR THE DM. Anything you write into the Desk (notes, plans, recaps, threads, characters) is for the DM to read at the table. State facts and decisions plainly, e.g. \"The skull portal is one-way.\" Never write \"DM decision\", \"the DM can/may/decides\", \"DM to confirm\", or reminders addressed to yourself or to an assistant. Mark unknowns as \"Open question: ...\". Instructions about how you should work belong in the DM's rules, not in their notes.\n\n"+(L.length?`THE DM'S STANDING RULES. Follow these in everything you write or change; they override any default below:\n${L.map(t=>"- "+t).join("\n")}\n\n`:"")}
function withRules(input){const pre=rulesPreamble();if(!pre)return input;if(typeof input==="string")return pre+input;if(Array.isArray(input)&&input.length){const a=input.slice();a[0]={...a[0],content:pre+a[0].content};return a}return input}
function wrapSample(raw){if(!raw)return raw;const f=(input,opts)=>raw(withRules(input),opts);f.json=(input,opts)=>raw.json(withRules(input),opts);f.limits=(...a)=>raw.limits(...a);f.raw=raw;return f}
function sugHtml(where,list){return (list||[]).map((t,i)=>`<div class="sug"><span>✦ Make this a standing rule? <b>${esc(t)}</b></span><button type="button" class="btn sm primary" data-sugadd="${where}|${i}">Add rule</button><button type="button" class="btn sm" data-sugno="${where}|${i}">No thanks</button></div>`).join("")}

/* ---------- brainstorm ---------- */
const BS={topic:"free",tones:new Set(),tie:true,ask:"",focus:null,busy:false,cur:null,expanding:{},expErr:{},more:null};
const BS_TOPICS=[["free","Anything"],["hooks","Plot hooks"],["twists","Twists"],["npcs","NPCs"],["places","Locations"],["encounters","Encounters"],["villain","Villain's next move"],["rumors","Rumors"],["treasure","Treasure"],["puzzles","Puzzles & riddles"],["moments","Character moments"],["session","Next session ideas"],["names","Names"]];
const BS_TONES=["Dark","Mysterious","Funny","Epic","Grim","Whimsical","Tense","Heartfelt"];
const BS_SAVE=[["note","Note"],["thread","Loose thread"],["twist","Twist in plan"],["reveal","Reveal in plan"],["quest","Quest rumor"],["npc","NPC"]];
function bsDoc(){return rec("meta","brainstorms")||{}}
/* stored records come back read-only, so hand out an editable copy */
function bsList(){return JSON.parse(JSON.stringify(bsDoc().list||[])).sort((a,b)=>(b.at||0)-(a.at||0))}
/* keep every brainstorm that's attached to a page; trim only old unattached ones, and stay well under the size limit */
function bsTrim(list){let out=list.filter((s,i)=>s.focus||i<30);while(out.length>1&&JSON.stringify(out).length>700000){const k=out.map((s,i)=>[s,i]).filter(([s])=>!s.focus).pop();out.splice(k?k[1]:out.length-1,1)}return out}
async function bsStore(list){const d=bsDoc();const{id:_,...keep}=d;await save("meta","brainstorms",{...keep,list:bsTrim(list)})}
function bsFocusText(){if(!BS.focus)return "";const x=rec(BS.focus.type,BS.focus.id);if(!x)return "";return `\nFOCUS (build the ideas around this ${COL_LABEL[BS.focus.type]||"entry"}):\n${titleOf(BS.focus.type,x)}\n${plain(textOf(BS.focus.type,x)).slice(0,3000)}\n`}
async function bsGo(opts={}){
  if(!sampleFn||BS.busy)return;BS.busy=true;render();
  const topic=(BS_TOPICS.find(t=>t[0]===BS.topic)||[0,"Ideas"])[1];const tones=[...BS.tones].join(", ");
  const base=opts.like?`Give 5 fresh variations on this idea, each going a different direction:\n"${opts.like.title}: ${opts.like.pitch}"`:BS.topic==="free"?(BS.ask?"Help with the DM's prompt below. Give 5 distinct ideas or answers.":"Give 5 distinct ideas the DM could use in the next session."):`Give 5 distinct ${topic.toLowerCase()} ideas.`;
  const party=S.characters.filter(x=>x.kind==="pc").map(x=>`${x.name} (${[x.race,x.cls].filter(Boolean).join(" ")})`).join(", ");
  const prompt=`You are a creative partner for the DM of a D&D 2024 campaign (six level-6 players, milestone leveling, played on Roll20). ${base}
${BS.ask?`The DM's prompt: ${BS.ask}\n`:""}${tones?`Tone: ${tones}.\n`:""}Party: ${party}.${bsFocusText()}
${BS.tie?`Tie ideas into the campaign below: reuse existing NPCs, places, factions, open threads and the party's backstories where it fits. Don't contradict established facts.\n\nCAMPAIGN NOTES:\n${campaignDigest(60000)}`:"Ideas can be standalone."}

Make each idea concrete and usable at the table tonight. Vary them: don't give five versions of the same thing.
Reply with only JSON: {"ideas":[{"title":string (under 8 words),"pitch":string (2-3 sentences),"ties":string (one short line on how it connects to the campaign, or ""),"saveAs":"note"|"thread"|"twist"|"reveal"|"quest"|"npc"}]}`;
  try{const d=await sampleFn.json(prompt,{cache:false});const ideas=(Array.isArray(d?.ideas)?d.ideas:[]).filter(x=>x&&x.title).slice(0,6).map(x=>({id:uid(),title:String(x.title),pitch:String(x.pitch||""),ties:String(x.ties||""),saveAs:BS_SAVE.some(s=>s[0]===x.saveAs)?x.saveAs:"note",expanded:"",saved:""}));
    if(!ideas.length)throw {code:"invalid_json"};
    const sess={id:uid(),at:Date.now(),topic:BS.topic,tones:[...BS.tones],ask:BS.ask,focus:BS.focus,like:opts.like?opts.like.title:"",ideas};
    BS.cur=sess.id;const list=[sess,...bsList()];await bsStore(list)}
  catch(e){const m=e.code==="invalid_json"?"The ideas came back garbled. Try again.":aiErr(e);if(m)toast(m)}
  BS.busy=false;render()}
async function bsExpand(sid,iid){
  const find=()=>{const list=bsList();const s=list.find(x=>x.id===sid);return {list,it:s&&s.ideas.find(x=>x.id===iid)}};
  const {it}=find();if(!it)return;
  if(!sampleFn){toast("Claude isn't available in this view, so ideas can't be developed here.");return}
  if(BS.expanding[iid])return;
  BS.expanding[iid]=true;delete BS.expErr[iid];render();
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),120000);
  try{
    const r=await sampleFn(`Develop this D&D idea into something the DM can run: "${it.title}: ${it.pitch}"${it.ties?` (${it.ties})`:""}.
Write in Markdown, under 350 words, with short sections: **Setup** (what the players see first), **What's really going on**, **Key NPCs or creatures** (names, one line each, reuse existing campaign NPCs where it fits), **How it can play out** (2-3 branches), **Clues or hooks to drop**. Use the campaign notes below for consistency.\n\nCAMPAIGN NOTES:\n${campaignDigest(25000)}`,{cache:false,signal:ctl.signal});
    const text=String(r&&r.text||"").trim();
    if(!text)throw {code:"empty"};
    // re-read the list now: the stored copy may have changed while Claude was writing
    const fresh=find();if(!fresh.it)throw {code:"gone"};
    fresh.it.expanded=text;delete fresh.it.prevDev;await bsStore(fresh.list);
  }catch(e){
    const c=e&&e.code;
    BS.expErr[iid]=c==="empty"?"Claude sent back nothing. Try again.":c==="gone"?"That brainstorm was deleted while Claude was writing.":c==="unsaved"?"Claude wrote it, but it couldn't be saved. Try again.":(c==="cancelled"||(e&&e.name==="AbortError")||ctl.signal.aborted)?"That took too long and was stopped. Try again.":(aiErr(e)||"Something went wrong. Try again.");
  }finally{clearTimeout(timer);delete BS.expanding[iid];render()}
}
async function bsSave(sid,iid,kind){const list=bsList();const s=list.find(x=>x.id===sid);const it=s&&s.ideas.find(x=>x.id===iid);if(!it)return;
  const dev=bsPicked(it);const body=`${it.pitch}${it.ties?`\n\n*Ties in:* ${it.ties}`:""}${dev?`\n\n${dev}`:""}`;

/* ---- +1 day is a long rest: it moves the date and writes the rest into this session's notes ---- */
let LAST_TIME_LINE=null;
async function dayStep(n,quiet){
  const c=cal();const today=fromIdx(c,toIdx(c,c.today)+n);
  await save("settings","calendar",{...(S.settings.calendar||{}),today});U.calY=today.y;U.calM=today.m;
  if(!isDM())return;
  if(n<0){ // undo the line the last step wrote, if it's still the last line
    if(LAST_TIME_LINE){const s=LAST_TIME_LINE.session;const cur=rcNotesVal(s)||"";const lines=cur.split("\n");if(lines.length&&lines[lines.length-1].includes(LAST_TIME_LINE.text)){lines.pop();U.rcNotes=lines.join("\n");markDirty(s);await saveLog(s);toast("Took the rest back out of your notes")}LAST_TIME_LINE=null}
    return}
  if(quiet){LAST_TIME_LINE=null;return}
  const text=n===1?`Long rest. The party wakes on ${fmtDate(c,today)}.`:`${n} days pass. It is now ${fmtDate(c,today)}.`;
  const s=await addSessionLine(text);LAST_TIME_LINE={session:s,text};
  if(n>=2)offAuto();
  toast(n===1?`Long rest logged in session ${s} notes`:`${n} days logged in session ${s} notes`);
}

async function msSave(d,lvSet){const{id,...keep}=d;await save("meta","milestones",keep);const lv=lvSet??partyLevel();
  await save("settings","progress",{level:lv,next:lv+1,done:(d.items||[]).filter(x=>x.done).length,total:(d.items||[]).length,items:(d.items||[]).filter(x=>x.done||!x.hidden).map(x=>({text:x.text,done:!!x.done}))})}
async function msAdd(text,hidden){text=String(text||"").trim();if(!text)return;const d=msDoc();const items=(d.items||[]).slice();items.push({id:uid(),text,done:false,hidden:!!hidden,added:Date.now()});await msSave({...d,items})}
async function msToggle(id,key){const d=msDoc();const items=(d.items||[]).map(x=>x.id===id?{...x,[key]:!x[key],doneSession:key==="done"&&!x.done?rcSession():x.doneSession}:x);await msSave({...d,items})}

async function msLevelUp(){
  const d=msDoc();const from=partyLevel(),to=from+1;
  const pcs=S.characters.filter(c=>c.kind==="pc");const before=pcs.map(c=>({id:c.id,level:c.level}));

async function msUndoLevel(){const u=MS.undo;if(!u)return;for(const b of u.before){const c=rec("characters",b.id);if(c){const{id,...r}=c;await save("characters",id,{...r,level:b.level})}}await msSave(u.doc,num(u.before[0]?.level)||undefined);MS.undo=null;toast("Level up undone");render()}

const TRAVEL_MODES={foot:["On foot or mounted",{fast:4,normal:3,slow:2}],cart:["Cart or wagon",{fast:3,normal:2.5,slow:2}],row:["Rowboat",{fast:1.5,normal:1.5,slow:1.5}],keel:["Keelboat",{fast:1,normal:1,slow:1}],sail:["Sailing ship",{fast:2,normal:2,slow:2}],air:["Airship",{fast:8,normal:8,slow:8}]};
const TRV={from:"",to:"",miles:"",mode:"foot",pace:"normal",terrain:1,hours:8,est:null,busy:false};
const routes=()=>(rec("meta","routes")?.list)||[];
function placeNames(){return [...new Set([...S.notes.filter(n=>/location|place|shop/.test(n.category||"")).map(n=>n.title),...(S.maps||[]).flatMap(m=>(m.pins||[]).map(p=>p.label))].filter(Boolean))].sort()}
function trvCalc(){const mph=TRAVEL_MODES[TRV.mode][1][TRV.pace];const perDay=mph*num(TRV.hours||8)*(TRV.terrain||1);const miles=num(TRV.miles);if(!miles||!perDay)return null;const days=miles/perDay;return {perDay,days,whole:Math.max(1,Math.ceil(days-1e-9))}}
function trvSheet(){
  const c=cal(),r=trvCalc();const names=placeNames();
  showSheet(`<div class="sheet" role="dialog" aria-label="Travel time"><h2>Travel time</h2>
  <datalist id="trv-places">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>

let MIG_BUSY=false;const MIG_DONE=new Set();
async function calMigrate(){
  const c=S.settings.calendar;const mig=c&&c.migrate;if(!mig||MIG_BUSY||MIG_DONE.has(mig.id)||!isDM()||!S.live)return;MIG_BUSY=true;MIG_DONE.add(mig.id);
  try{const map=mig.map||[];let n=0;
    for(const e of S.events.slice()){if(e.calv===mig.id||map[e.m]==null)continue;const{id,...r}=e;await save("events",id,{...r,m:map[e.m],calv:mig.id});n++}
    for(const x of S.notes.slice()){if(!x.ig||x.calv===mig.id||map[x.ig.m]==null)continue;const{id,...r}=x;await save("notes",id,{...r,ig:{...x.ig,m:map[x.ig.m]},calv:mig.id});n++}
    const lr=S.settings.learned;if(lr&&Array.isArray(lr.list)&&!lr.calv){await save("settings","learned",{list:lr.list.map(x=>x.m!=null&&map[x.m]!=null?{...x,m:map[x.m]}:x),calv:mig.id})}

  MIG_BUSY=false;
}

function mdLite(t,raw){
  const lines=esc(t||"").split(/\n/);let out="",list=false,para=[];
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^\w])_(.+?)_(?!\w)/g,"$1<i>$2</i>");
  const flush=()=>{if(para.length){out+=`<p>${inl(para.join("<br>"))}</p>`;para=[]}};
  for(const l of lines){
    if(/^\s*[-*] /.test(l)){flush();if(!list){out+="<ul>";list=true}out+=`<li>${inl(l.replace(/^\s*[-*] /,""))}</li>`;continue}
    if(list){out+="</ul>";list=false}
    if(/^#{1,3} /.test(l)){flush();out+=`<h4>${inl(l.replace(/^#+ /,""))}</h4>`}
    else if(!l.trim())flush(); else para.push(l);
  }
  flush();if(list)out+="</ul>";return out||(raw?"":`<p style="color:var(--muted)">This note is empty.</p>`);
}

function agenda(c,y,m){

  const evs=S.events.filter(e=>e.m===m&&(e.yearly||e.y===y)).sort((a,b)=>a.d-b.d);
  const row=e=>`<button class="ag" data-act="view" data-type="events" data-id="${e.id}"><span class="ag-d">${e.d}</span><span class="ag-t"><b>${esc(e.title)}</b><small>${EVKIND[e.kind]||"Event"}${e.yearly?" · yearly":""}</small></span></button>`;
  let h=`<div class="agenda">`;
  if(sel){const se=evs.filter(e=>e.d===sel.d);
    h+=`<div class="ag-sel"><div class="ag-selh"><b>${esc(fmtDate(c,sel))}</b><button class="btn sm primary dm-only" data-act="newEvent" data-y="${sel.y}" data-m="${sel.m}" data-d="${sel.d}">Add event</button></div>${se.length?se.map(row).join(""):`<p class="vempty">Nothing on this day.</p>`}</div>`}

  h+=`<h4 class="ag-h">This month</h4>${evs.length?evs.map(row).join(""):`<p class="vempty">No events this month.</p>`}</div>`;
  return h;
}

  if(el.id==="imp-pdf"&&el.files[0]){const f=el.files[0];IMP.name=f.name;document.getElementById("imp-name").textContent=f.name;

      const ta=document.getElementById("imp-text");if(ta)ta.value=IMP.text}catch(err){toast("Couldn't read that file. Try pasting the text instead.")}
    IMP.busy=false;impRender();return}
  if(el.dataset.spot){const [pc,ss]=el.dataset.spot.split("|");toggleSpot(pc,num(ss),el.checked);return}
  if(el.dataset.beat){const [qid,i]=el.dataset.beat.split("|");toggleBeat(qid,num(i),el.checked);return}
  if(el.dataset.enc!=null&&el.dataset.f==="cr"){const i=num(el.dataset.enc);ENC.monsters[i].cr=el.value;const x=document.getElementById("enc-x-"+i);if(x)x.textContent=fmtN((CR_XP[el.value]||0)*(num(ENC.monsters[i].count)||0))+" XP";document.getElementById("enc-sum").innerHTML=encSummary();return}
  if(el.dataset.upload&&el.files[0]){

document.addEventListener("keydown",e=>{

});
document.addEventListener("submit",async e=>{

    else if(type==="threads"){if(!data.text){toast("Describe the thread.");return}}
    else if(type==="plans"){if(!data.title)data.title=`Session ${data.session||nextSession()}`}
    else if(!data.title&&!data.name){toast(type==="characters"||type==="loot"?"Give it a name.":"Give it a title.");return}
    const old=S[type].find(x=>x.id===id)||{};const{id:_,...keep}=old;
    await save(type,id,{...keep,...data});if(type==="notes")U.noteSel=id;if(type==="plans")U.planSel=id;
    if(type==="maps"){closeSheet();toast("Saved");setTimeout(()=>openMap(id),60)}else{closeSheet();toast("Saved")}}
  if(k==="cal"){const months=document.getElementById("c-months").value.split("\n").map(l=>l.split(",").map(x=>x.trim())).filter(p=>p[0]).map(([n,d,...fl])=>{const mm=n.match(/^(.*?)\s*\((.*)\)\s*$/);const o={name:(mm?mm[1]:n).trim(),days:Math.max(1,num(d)||30)};if(mm&&mm[2])o.sub=mm[2].trim();fl.forEach(f=>{if(/^festival$/i.test(f))o.festival=true;const lp=f.match(/^leap\s+(\d+)(?:\+(\d+))?\s*(.*)$/i);if(lp){o.leapEvery=+lp[1];if(lp[2])o.leapOffset=+lp[2];if(lp[3])o.leapName=lp[3].trim()}});return o});
    const moons=document.getElementById("c-moon").value.split(";").map(x=>x.split(",").map(y=>y.trim())).filter(p=>p[0]&&parseFloat(p[1])>0).map(([n,cy,sh])=>({name:n,cycle:parseFloat(cy),shift:parseFloat(sh)||0}));
    const weekdays=document.getElementById("c-wd").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!months.length||!weekdays.length){toast("Add at least one month and one weekday.");return}
    const m=Math.min(+document.getElementById("f-today-m").value,months.length-1);
    const ty=num(document.getElementById("f-today-y").value)??c.today.y;const today={y:ty,m,d:Math.min(Math.max(1,num(document.getElementById("f-today-d").value)||1),monthDays({months},ty,m))};
    const seasons=document.getElementById("c-seasons").value.split(";").map(x=>x.split(",").map(y=>y.trim())).filter(p=>p[0]&&parseFloat(p[1])>0).map(([n,l,st,md])=>{const o={name:n,length:parseFloat(l)};if(st)o.start=st;if(md)o.mid=md;return o});
    const prev=S.settings.calendar||{};await save("settings","calendar",{...prev,seasons,seasonOffset:parseFloat(document.getElementById("c-soff").value)||0,months,weekdays,weekName:document.getElementById("c-wn").value.trim()||"week",era:document.getElementById("c-era").value.trim(),overflow:document.getElementById("c-ovf").value==="run",moons,today});
    U.calY=today.y;U.calM=today.m;closeSheet();toast("Calendar saved")}
  if(k==="rename"){await save("settings","campaign",{name:document.getElementById("r-name").value.trim()||"The Campaign"});toast("Renamed")}
  if(k==="schedule"){const v=document.getElementById("sch-dt").value;await save("settings","schedule",{next:v,repeat:document.getElementById("sch-rep").value});toast(v?"Schedule saved":"Schedule cleared");return}
  if(k==="askReply"){const inp=document.getElementById("ask-reply");const v=(inp?.value||"").trim();if(!v)return;inp.value="";askGoDesk(v);return}
  if(k==="todoQuick"){const kind=f.dataset.kind,inp=document.getElementById(kind==="goal"?"tq-goal":"tq-todo");const v=(inp?.value||"").trim();if(!v)return;inp.value="";inp.blur();await save("todos",uid(),{text:v,kind,done:false});project();render();setTimeout(()=>document.getElementById(kind==="goal"?"tq-goal":"tq-todo")?.focus(),60);return}
  if(k==="threadQuick"){const v=(document.getElementById("tq-in").value||"").trim();if(!v)return;U.tq="";await save("threads",uid(),{text:v,status:"open"});setTimeout(()=>document.getElementById("tq-in")?.focus(),60)}
  if(k==="rcAdd"){const v=(document.getElementById("rc-add").value||"").trim();if(!v)return;const n=rcSession();markDirty(n);const cur=U.rcNotes.replace(/\s+$/,"");U.rcNotes=(cur?cur+"\n":"")+(/^[-*] /.test(v)?v:"- "+v);U.rcAdd="";await saveLog(n);render();setTimeout(()=>document.getElementById("rc-add")?.focus(),40);return}
  if(k==="ask"){const v=document.getElementById("ask-in").value;U.askQ="";askGo(v)}
  if(k==="pin"){const mapId=f.dataset.map,m=rec("maps",mapId);if(!m)return;const pins=(m.pins||[]).slice();const ref=document.getElementById("pin-ref").value;const [type,rid]=ref?ref.split(":"):["",""];
    const pn={x:+f.dataset.x,y:+f.dataset.y,label:document.getElementById("pin-label").value.trim(),type,ref:rid};
    if(f.dataset.i!=="")pins[+f.dataset.i]=pn;else pins.push(pn);const{id,...r}=m;await save("maps",mapId,{...r,pins});openMap(mapId)}

});

/* copy as text: one page or the whole campaign, ready to paste into the Claude app or a player handout */
const COPY_SKIP=new Set(["id","updated","created","at","dmOnly","revealed","img","image","portrait","avatar","color","x","y","w","h"]);
function entryText(type,x,withSecret){
  const out=["# "+(titleOf(type,x)||"Untitled")];
  const show=v=>Array.isArray(v)?v.map(i=>typeof i==="object"&&i?Object.values(i).filter(q=>typeof q==="string"||typeof q==="number").join(" "):String(i)).filter(Boolean).join("; "):typeof v==="object"&&v?"":String(v);
  Object.entries(x).forEach(([k,v])=>{if(COPY_SKIP.has(k)||k==="secret"||k==="title"||k==="name"||v===""||v==null||typeof v==="boolean")return;const t=show(v).trim();if(!t)return;const lab=k.replace(/([A-Z])/g," $1").replace(/^./,c=>c.toUpperCase());out.push(t.includes("\n")?`\n## ${lab}\n${t}`:`${lab}: ${t}`)});
  if(withSecret&&x.secret)out.push("\n## DM secrets\n"+x.secret);
  return out.join("\n")}
async function copyOut(text,msg){try{await navigator.clipboard.writeText(text);toast(msg)}catch(_){toast("Couldn't copy here. Try again from the page itself.")}}
function copyEntry(type,id,withSecret){const x=rec(type,id);if(x)copyOut(entryText(type,x,withSecret),withSecret?"Copied, including DM secrets":"Copied without DM secrets")}
function copyAll(){const skip=new Set(["meta","chats","logs","links"]);const parts=COLS.filter(c=>!skip.has(c)&&ALL[c].length).map(c=>"\n===== "+c.toUpperCase()+" =====\n\n"+ALL[c].map(x=>entryText(c,x,true)).join("\n\n"));copyOut((S.settings.campaign?.name||"Campaign")+"\n"+parts.join("\n"),"Campaign copied, including DM secrets")}
